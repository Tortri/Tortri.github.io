<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        textarea, button, a { touch-action: manipulation; }
        .cell-input {
            resize: none;
            overflow: hidden;
            min-height: 44px;
        }
        .week-slide-enter { animation: weekSlide 0.15s ease-out; }
        @keyframes weekSlide {
            from { opacity: 0.4; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">

    <div class="max-w-6xl mx-auto p-4 sm:p-8">

        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-300 dark:border-slate-800 pb-3 mb-4">
            <div class="flex items-center gap-3">
                <button onclick="shiftWeek(-1)" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">◄</button>
                <div class="text-center">
                    <div id="weekTitle" class="text-xl font-semibold tracking-tight text-slate-800 dark:text-slate-200 leading-tight">Week —</div>
                    <div id="weekRange" class="text-xs text-slate-400"></div>
                </div>
                <button onclick="shiftWeek(1)" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">►</button>
                <button onclick="goToday()" id="todayBtn" class="ml-1 text-xs px-2 py-1 rounded-md border border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition hidden">This week</button>
            </div>

            <div class="flex items-center gap-3 text-xs">
                <a href="/notes" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">notes</a>
                <button onclick="toggleTheme()" id="themeToggleBtn" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">light mode</button>
                <button onclick="logout()" class="text-slate-500 hover:text-red-500 transition">logout</button>
            </div>
        </header>

        <!-- Main layout: table + compact notes -->
        <div class="flex flex-col lg:flex-row gap-6 items-start">

            <!-- Week table (main) -->
            <div class="w-full lg:flex-1 overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-800">
                <table class="w-full min-w-[640px] border-collapse text-sm">
                    <thead>
                        <tr id="dayHeaderRow" class="bg-slate-50 dark:bg-slate-800/60"></tr>
                    </thead>
                    <tbody id="weekTableBody"></tbody>
                </table>
            </div>

            <!-- Compact general notes panel -->
            <div class="w-full lg:w-72 shrink-0 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 p-3">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Notes</h2>
                    <button onclick="addGeneralLine()" class="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition">+ add</button>
                </div>
                <div id="generalNotesList" class="space-y-0.5"></div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = "https://notes-backend.tortrix03.workers.dev/api";
        const DAY_LABELS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
        const SLOTS = [
            { key: "am", label: "AM" },
            { key: "pm", label: "PM" },
            { key: "other", label: "Other / Notes" }
        ];

        let trainingCache = {};   // id -> { id, content, updated_at }
        let weekOffset = 0;       // weeks away from the real current week
        let generalLines = [];    // [{ id, text, checked }]
        const saveTimers = {};    // debounce handles per cell id

        // ---------- theme (same pattern as /notes) ----------
        function initTheme() {
            const saved = localStorage.getItem("theme");
            const isDark = saved ? saved === "dark" : true;
            document.documentElement.classList.toggle("dark", isDark);
            document.getElementById("themeToggleBtn").textContent = isDark ? "light mode" : "dark mode";
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").textContent = isDark ? "light mode" : "dark mode";
        }
        initTheme();

        // ---------- auth (shared key with /notes, same domain) ----------
        function getAuthHeader() {
            let key = localStorage.getItem("notes_api_key");
            if (!key) {
                key = prompt("Enter portal password:");
                if (key) localStorage.setItem("notes_api_key", key);
            }
            return { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" };
        }
        function logout() {
            localStorage.removeItem("notes_api_key");
            window.location.reload();
        }

        function uid() { return crypto.randomUUID().slice(0, 8); }
        function escapeHtml(text) {
            return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
        }

        // ---------- ISO week math ----------
        function getMondayOfCurrentWeek(date = new Date()) {
            const d = new Date(date);
            const day = (d.getDay() + 6) % 7; // Mon=0..Sun=6
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() - day);
            return d;
        }
        function addDays(date, n) {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        }
        function getISOWeek(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = (d.getUTCDay() + 6) % 7;
            d.setUTCDate(d.getUTCDate() - dayNum + 3);
            const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
            const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
            firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
            const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
            return { year: d.getUTCFullYear(), week };
        }
        function formatShort(date) {
            return date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
        }

        function currentMonday() {
            return addDays(getMondayOfCurrentWeek(), weekOffset * 7);
        }

        function shiftWeek(n) {
            weekOffset += n;
            renderWeek();
        }
        function goToday() {
            weekOffset = 0;
            renderWeek();
        }

        // ---------- data fetch/save (single generic store) ----------
        async function fetchTraining() {
            try {
                const res = await fetch(`${API_BASE}/training`, { headers: getAuthHeader() });
                if (res.status === 401) { alert("Incorrect password!"); logout(); return; }
                const rows = await res.json();
                trainingCache = {};
                rows.forEach(r => trainingCache[r.id] = r);

                const gn = trainingCache["training_general_notes"];
                if (gn && gn.content) {
                    try { generalLines = JSON.parse(gn.content); } catch (e) { generalLines = []; }
                }
                if (!generalLines || generalLines.length === 0) {
                    generalLines = [{ id: uid(), text: "", checked: null }];
                }

                renderWeek();
                renderGeneralNotes();
            } catch (err) {
                console.error("Network error:", err);
            }
        }

        function saveCell(id, content) {
            trainingCache[id] = { id, content, updated_at: Date.now() };
            clearTimeout(saveTimers[id]);
            saveTimers[id] = setTimeout(async () => {
                const res = await fetch(`${API_BASE}/training`, {
                    method: "POST",
                    headers: getAuthHeader(),
                    body: JSON.stringify({ id, content })
                });
                if (res.status === 401) logout();
            }, 600);
        }

        function saveGeneralNotes() {
            const id = "training_general_notes";
            const content = JSON.stringify(generalLines);
            saveCell(id, content);
        }

        // ---------- week table rendering ----------
        function cellId(year, week, dayIdx, slotKey) {
            return `slot_${year}_${week}_${dayIdx}_${slotKey}`;
        }

        function renderWeek() {
            const monday = currentMonday();
            const { year, week } = getISOWeek(monday);
            const sunday = addDays(monday, 6);

            document.getElementById("weekTitle").textContent = `Week ${week} · ${year}`;
            document.getElementById("weekRange").textContent = `${formatShort(monday)} – ${formatShort(sunday)}`;
            document.getElementById("todayBtn").classList.toggle("hidden", weekOffset === 0);

            // header row: day name + date
            const headerRow = document.getElementById("dayHeaderRow");
            let headerHtml = `<th class="text-left text-xs font-medium text-slate-400 p-2 w-28"></th>`;
            for (let i = 0; i < 7; i++) {
                const d = addDays(monday, i);
                const isToday = new Date().toDateString() === d.toDateString();
                headerHtml += `
                    <th class="p-2 text-center border-l border-slate-200 dark:border-slate-800 ${isToday ? 'bg-slate-200/60 dark:bg-slate-700/40' : ''}">
                        <div class="text-xs font-semibold text-slate-700 dark:text-slate-300">${DAY_LABELS[i]}</div>
                        <div class="text-[10px] text-slate-400">${formatShort(d)}</div>
                    </th>`;
            }
            headerRow.innerHTML = headerHtml;

            // body rows: AM / PM / Other
            const body = document.getElementById("weekTableBody");
            let bodyHtml = "";
            SLOTS.forEach(slot => {
                bodyHtml += `<tr class="border-t border-slate-200 dark:border-slate-800 week-slide-enter">
                    <td class="p-2 text-xs font-medium text-slate-400 align-top w-28">${slot.label}</td>`;
                for (let i = 0; i < 7; i++) {
                    const id = cellId(year, week, i, slot.key);
                    const val = trainingCache[id] ? trainingCache[id].content : "";
                    bodyHtml += `
                        <td class="p-1 border-l border-slate-200 dark:border-slate-800 align-top">
                            <textarea
                                class="cell-input w-full bg-transparent text-xs sm:text-sm p-1.5 rounded focus:outline-none focus:bg-slate-100 dark:focus:bg-slate-800/60 text-slate-700 dark:text-slate-300"
                                data-cell-id="${id}"
                                oninput="onCellInput(this)"
                                placeholder="">${escapeHtml(val)}</textarea>
                        </td>`;
                }
                bodyHtml += `</tr>`;
            });
            body.innerHTML = bodyHtml;

            // autosize all textareas now that they're in the DOM
            body.querySelectorAll("textarea").forEach(el => autoGrow(el));
        }

        function onCellInput(el) {
            autoGrow(el);
            saveCell(el.dataset.cellId, el.value);
        }

        // ---------- compact general notes (mini checklist, *() shorthand) ----------
        function renderGeneralNotes() {
            const wrap = document.getElementById("generalNotesList");
            wrap.innerHTML = generalLines.map(line => {
                if (line.checked === null) {
                    return `
                        <div class="flex items-start gap-1.5">
                            <textarea rows="1"
                                class="gn-line w-full bg-transparent text-xs focus:outline-none py-1 resize-none overflow-hidden leading-snug text-slate-700 dark:text-slate-300"
                                data-line="${line.id}"
                                oninput="handleGNInput('${line.id}', this)"
                                onkeydown="handleGNKeydown(event, '${line.id}')"
                                placeholder="note...">${escapeHtml(line.text)}</textarea>
                        </div>`;
                }
                return `
                    <div class="flex items-start gap-1.5">
                        <input type="checkbox" ${line.checked ? "checked" : ""} onchange="toggleGNCheck('${line.id}', this)"
                            class="h-3 w-3 mt-1.5 rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-900 checked:bg-slate-500 focus:ring-0 shrink-0">
                        <textarea rows="1"
                            class="gn-line w-full bg-transparent text-xs focus:outline-none py-1 resize-none overflow-hidden leading-snug ${line.checked ? "line-through text-slate-400 dark:text-slate-500" : "text-slate-700 dark:text-slate-300"}"
                            data-line="${line.id}"
                            oninput="handleGNInput('${line.id}', this)"
                            onkeydown="handleGNKeydown(event, '${line.id}')"
                            placeholder="task...">${escapeHtml(line.text)}</textarea>
                    </div>`;
            }).join("");
            wrap.querySelectorAll("textarea").forEach(el => autoGrow(el));
        }

        function addGeneralLine() {
            generalLines.push({ id: uid(), text: "", checked: null });
            renderGeneralNotes();
            saveGeneralNotes();
            focusGNLine(generalLines[generalLines.length - 1].id);
        }

        function focusGNLine(lineId, caret) {
            requestAnimationFrame(() => {
                const el = document.querySelector(`textarea[data-line="${lineId}"]`);
                if (el) {
                    el.focus();
                    const pos = caret === undefined ? el.value.length : caret;
                    el.setSelectionRange(pos, pos);
                }
            });
        }

        function handleGNInput(lineId, el) {
            const line = generalLines.find(l => l.id === lineId);
            if (!line) return;
            const value = el.value;

            if (line.checked === null) {
                const match = value.match(/^\*\(\)\s?(.*)$/);
                if (match) {
                    line.checked = false;
                    line.text = match[1];
                    renderGeneralNotes();
                    saveGeneralNotes();
                    focusGNLine(lineId, line.text.length);
                    return;
                }
            }
            autoGrow(el);
            line.text = value;
            saveGeneralNotes();
        }

        function toggleGNCheck(lineId, checkbox) {
            const line = generalLines.find(l => l.id === lineId);
            if (!line) return;
            line.checked = checkbox.checked;
            renderGeneralNotes();
            saveGeneralNotes();
        }

        function handleGNKeydown(e, lineId) {
            const idx = generalLines.findIndex(l => l.id === lineId);
            if (idx === -1) return;
            const line = generalLines[idx];
            const inputEl = e.target;

            if (e.key === "Enter") {
                e.preventDefault();
                const caret = inputEl.selectionStart;
                const before = line.text.slice(0, caret);
                const after = line.text.slice(caret);
                line.text = before;
                const newLine = { id: uid(), text: after, checked: line.checked !== null ? false : null };
                generalLines.splice(idx + 1, 0, newLine);
                renderGeneralNotes();
                saveGeneralNotes();
                focusGNLine(newLine.id, 0);
                return;
            }

            if (e.key === "Backspace") {
                const atStart = inputEl.selectionStart === 0 && inputEl.selectionEnd === 0;
                if (!atStart) return;

                if (line.checked !== null) {
                    e.preventDefault();
                    line.checked = null;
                    renderGeneralNotes();
                    saveGeneralNotes();
                    focusGNLine(lineId, 0);
                    return;
                }

                if (idx > 0) {
                    e.preventDefault();
                    const prev = generalLines[idx - 1];
                    const mergeCaret = prev.text.length;
                    prev.text = prev.text + line.text;
                    generalLines.splice(idx, 1);
                    renderGeneralNotes();
                    saveGeneralNotes();
                    focusGNLine(prev.id, mergeCaret);
                }
            }
        }

        // ---------- init ----------
        fetchTraining();
    </script>
</body>
</html>
