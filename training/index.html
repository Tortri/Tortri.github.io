<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        textarea, button, a, select { touch-action: manipulation; }
        .cell-input { resize: none; overflow: hidden; min-height: 36px; }
        .week-slide-enter { animation: weekSlide 0.15s ease-out; }
        @keyframes weekSlide {
            from { opacity: 0.4; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-scroll::-webkit-scrollbar { height: 4px; }
        .linked-cell { background-color: rgba(16, 185, 129, 0.07); }
        select.cell-program-select { appearance: none; -webkit-appearance: none; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">

    <div class="max-w-6xl mx-auto p-4 sm:p-8">

        <!-- Header -->
        <header class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-300 dark:border-slate-800 pb-3 mb-4">
            <div class="flex items-center gap-3">
                <button onclick="shiftWeek(-1)" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">◄</button>
                <div class="text-center">
                    <div id="weekTitle" class="text-xl font-semibold tracking-tight text-slate-800 dark:text-slate-200 leading-tight">Week —</div>
                    <div id="weekRange" class="text-xs text-slate-400"></div>
                </div>
                <button onclick="shiftWeek(1)" class="w-8 h-8 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">►</button>
                <button onclick="goToday()" id="todayBtn" class="ml-1 text-xs px-2 py-1 rounded-md border border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition hidden">This week</button>
            </div>

            <div class="flex items-center gap-3 text-xs">
                <a href="/notes" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">notes</a>
                <button onclick="toggleTheme()" id="themeToggleBtn" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">light mode</button>
                <button onclick="logout()" class="text-slate-500 hover:text-red-500 transition">logout</button>
            </div>
        </header>

        <!-- Person toggle + PDF export -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex rounded-md overflow-hidden border border-slate-300 dark:border-slate-700 text-xs font-medium">
                <button onclick="setPerson('jacob')" id="personBtnJacob" class="px-4 py-1.5 transition"></button>
                <button onclick="setPerson('zara')" id="personBtnZara" class="px-4 py-1.5 transition border-l border-slate-300 dark:border-slate-700"></button>
            </div>
            <button onclick="exportWeekPDF()" class="text-xs px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition flex items-center gap-1.5">
                <span>⬇</span> Export week PDF
            </button>
        </div>

        <!-- Main layout: table + notes pages -->
        <div class="flex flex-col lg:flex-row gap-6 items-start">

            <!-- Week table (main) -->
            <div class="w-full lg:flex-1 overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-800">
                <table class="w-full min-w-[720px] border-collapse text-sm">
                    <thead>
                        <tr id="dayHeaderRow" class="bg-slate-50 dark:bg-slate-800/60"></tr>
                    </thead>
                    <tbody id="weekTableBody"></tbody>
                </table>
            </div>

            <!-- Notes panel: multiple nameable pages -->
            <div class="w-full lg:w-72 shrink-0 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 p-3">
                <div class="flex items-center justify-between mb-2 gap-2">
                    <div id="pageTabs" class="flex items-center gap-1 overflow-x-auto tab-scroll flex-1"></div>
                    <button onclick="addPage()" title="New page" class="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition shrink-0">+ page</button>
                </div>
                <div class="flex items-center justify-between mb-2">
                    <h2 id="activePageTitle" class="text-xs font-semibold uppercase tracking-wide text-slate-400 truncate"></h2>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="renamePage()" title="Rename page" class="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition">rename</button>
                        <button onclick="deletePage()" title="Delete page" class="text-xs text-slate-400 hover:text-red-500 transition">del</button>
                    </div>
                </div>
                <div id="pageLinesList" class="space-y-0.5"></div>
            </div>

        </div>

        <!-- Below-table: weekly totals, zone settings, program library -->
        <div class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Weekly totals -->
            <div class="rounded-lg border border-slate-200 dark:border-slate-800 p-4">
                <h2 id="totalsHeading" class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-3"></h2>
                <div id="weeklyTotals" class="space-y-1.5 text-sm"></div>
            </div>

            <!-- Zone settings -->
            <div class="rounded-lg border border-slate-200 dark:border-slate-800 p-4">
                <h2 id="zoneHeading" class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-3"></h2>
                <div id="zoneSettingsTable"></div>
            </div>

            <!-- Program library -->
            <div class="rounded-lg border border-slate-200 dark:border-slate-800 p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Programs</h2>
                    <button onclick="openProgramBuilder()" class="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition">+ add program</button>
                </div>
                <div id="programsList" class="space-y-1 text-sm mb-3"></div>
                <div id="programBuilderWrap"></div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = "https://notes-backend.tortrix03.workers.dev/api";
        const DAY_LABELS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
        const SLOTS = [
            { key: "am", label: "AM" },
            { key: "pm", label: "PM" },
            { key: "other", label: "Other / Notes" }
        ];
        const PEOPLE = [
            { key: "jacob", label: "Jacob" },
            { key: "zara", label: "Zara" }
        ];
        const ZONES = [1, 2, 3, 4, 5];

        let trainingCache = {};
        let weekOffset = 0;
        let activePerson = localStorage.getItem("training_active_person") || "jacob";
        let notePages = [];
        let activePageId = null;
        let programs = [];
        let zoneSettings = {};
        let builderProgram = null; // { id, name, segments: [{id,minutes,seconds,zone,repeat}] }
        const saveTimers = {};

        // ---------- theme ----------
        function initTheme() {
            const saved = localStorage.getItem("theme");
            const isDark = saved ? saved === "dark" : true;
            document.documentElement.classList.toggle("dark", isDark);
            document.getElementById("themeToggleBtn").textContent = isDark ? "light mode" : "dark mode";
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").textContent = isDark ? "light mode" : "dark mode";
        }
        initTheme();

        // ---------- auth ----------
        function getAuthHeader() {
            let key = localStorage.getItem("notes_api_key");
            if (!key) {
                key = prompt("Enter portal password:");
                if (key) localStorage.setItem("notes_api_key", key);
            }
            return { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" };
        }
        function logout() {
            localStorage.removeItem("notes_api_key");
            window.location.reload();
        }

        function uid() { return crypto.randomUUID().slice(0, 8); }
        function escapeHtml(text) {
            return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
        }
        function safelyParse(str, fallback) {
            try { return JSON.parse(str); } catch (e) { return fallback; }
        }

        // ---------- ISO week math ----------
        function getMondayOfCurrentWeek(date = new Date()) {
            const d = new Date(date);
            const day = (d.getDay() + 6) % 7;
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() - day);
            return d;
        }
        function addDays(date, n) {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        }
        function getISOWeek(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = (d.getUTCDay() + 6) % 7;
            d.setUTCDate(d.getUTCDate() - dayNum + 3);
            const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
            const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
            firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
            const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
            return { year: d.getUTCFullYear(), week };
        }
        function formatShort(date) {
            return date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
        }
        function currentMonday() {
            return addDays(getMondayOfCurrentWeek(), weekOffset * 7);
        }
        function shiftWeek(n) {
            weekOffset += n;
            renderWeek();
            renderWeeklyTotals();
        }
        function goToday() {
            weekOffset = 0;
            renderWeek();
            renderWeeklyTotals();
        }

        // ---------- person toggle ----------
        function setPerson(p) {
            activePerson = p;
            localStorage.setItem("training_active_person", p);
            renderPersonButtons();
            renderWeek();
            renderZoneSettings();
            renderWeeklyTotals();
        }
        function renderPersonButtons() {
            PEOPLE.forEach(p => {
                const btn = document.getElementById(`personBtn${p.label}`);
                btn.textContent = p.label;
                const active = activePerson === p.key;
                btn.className = `px-4 py-1.5 transition ${p.key === 'zara' ? 'border-l border-slate-300 dark:border-slate-700' : ''} ${
                    active
                        ? 'bg-slate-700 text-white dark:bg-slate-200 dark:text-slate-900'
                        : 'bg-transparent text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800'
                }`;
            });
        }

        // ---------- generic cell store ----------
        async function fetchTraining() {
            try {
                const res = await fetch(`${API_BASE}/training`, { headers: getAuthHeader() });
                if (res.status === 401) { alert("Incorrect password!"); logout(); return; }
                const rows = await res.json();
                trainingCache = {};
                rows.forEach(r => trainingCache[r.id] = r);

                loadNotePages();
                loadProgramsAndZones();
                renderPersonButtons();
                renderWeek();
                renderPageTabs();
                renderPageLines();
                renderZoneSettings();
                renderProgramsList();
                renderWeeklyTotals();
            } catch (err) {
                console.error("Network error:", err);
            }
        }

        function saveKey(id, content) {
            trainingCache[id] = { id, content, updated_at: Date.now() };
            clearTimeout(saveTimers[id]);
            saveTimers[id] = setTimeout(async () => {
                const res = await fetch(`${API_BASE}/training`, {
                    method: "POST",
                    headers: getAuthHeader(),
                    body: JSON.stringify({ id, content })
                });
                if (res.status === 401) logout();
            }, 600);
        }

        // ---------- cell content model: manual string OR {text, programId} ----------
        function parseCell(raw) {
            if (!raw) return { text: "", programId: null };
            const obj = safelyParse(raw, null);
            if (obj && typeof obj === "object" && !Array.isArray(obj) && "programId" in obj) {
                return { text: obj.text || "", programId: obj.programId || null };
            }
            return { text: raw, programId: null };
        }
        function serializeCell(text, programId) {
            if (!programId) return text || "";
            return JSON.stringify({ text: text || "", programId });
        }

        function cellId(person, year, week, dayIdx, slotKey) {
            return `slot_${person}_${year}_${week}_${dayIdx}_${slotKey}`;
        }
        function legacyCellId(year, week, dayIdx, slotKey) {
            return `slot_${year}_${week}_${dayIdx}_${slotKey}`;
        }
        function getCellRaw(person, year, week, dayIdx, slotKey) {
            const id = cellId(person, year, week, dayIdx, slotKey);
            if (trainingCache[id]) return trainingCache[id].content || "";
            if (person === "jacob") {
                const legacy = legacyCellId(year, week, dayIdx, slotKey);
                if (trainingCache[legacy]) return trainingCache[legacy].content || "";
            }
            return "";
        }

        // ---------- week table ----------
        function renderWeek() {
            const monday = currentMonday();
            const { year, week } = getISOWeek(monday);
            const sunday = addDays(monday, 6);

            document.getElementById("weekTitle").textContent = `Week ${week} · ${year}`;
            document.getElementById("weekRange").textContent = `${formatShort(monday)} – ${formatShort(sunday)}`;
            document.getElementById("todayBtn").classList.toggle("hidden", weekOffset === 0);

            const headerRow = document.getElementById("dayHeaderRow");
            let headerHtml = `<th class="text-left text-xs font-medium text-slate-400 p-2 w-24"></th>`;
            for (let i = 0; i < 7; i++) {
                const d = addDays(monday, i);
                const isToday = new Date().toDateString() === d.toDateString();
                headerHtml += `
                    <th class="p-2 text-center border-l border-slate-200 dark:border-slate-800 ${isToday ? 'bg-slate-200/60 dark:bg-slate-700/40' : ''}">
                        <div class="text-xs font-semibold text-slate-700 dark:text-slate-300">${DAY_LABELS[i]}</div>
                        <div class="text-[10px] text-slate-400">${formatShort(d)}</div>
                    </th>`;
            }
            headerRow.innerHTML = headerHtml;

            const body = document.getElementById("weekTableBody");
            let bodyHtml = "";
            SLOTS.forEach(slot => {
                bodyHtml += `<tr class="border-t border-slate-200 dark:border-slate-800 week-slide-enter">
                    <td class="p-2 text-xs font-medium text-slate-400 align-top w-24">${slot.label}</td>`;
                for (let i = 0; i < 7; i++) {
                    const id = cellId(activePerson, year, week, i, slot.key);
                    const parsed = parseCell(getCellRaw(activePerson, year, week, i, slot.key));
                    const programOptions = programs.map(p =>
                        `<option value="${p.id}" ${p.id === parsed.programId ? "selected" : ""}>${escapeHtml(p.name)}</option>`
                    ).join("");
                    bodyHtml += `
                        <td class="p-1 border-l border-slate-200 dark:border-slate-800 align-top ${parsed.programId ? 'linked-cell' : ''}">
                            <select class="cell-program-select w-full text-[10px] bg-transparent border border-slate-200 dark:border-slate-700 rounded mb-1 px-1 py-0.5 text-slate-500 focus:outline-none"
                                data-cell-id="${id}" onchange="onProgramSelect(this)">
                                <option value="">— Manual —</option>
                                ${programOptions}
                            </select>
                            <textarea
                                class="cell-input w-full bg-transparent text-xs sm:text-sm p-1 rounded focus:outline-none focus:bg-slate-100 dark:focus:bg-slate-800/60 text-slate-700 dark:text-slate-300"
                                data-cell-id="${id}"
                                oninput="onCellInput(this)"
                                placeholder="">${escapeHtml(parsed.text)}</textarea>
                        </td>`;
                }
                bodyHtml += `</tr>`;
            });
            body.innerHTML = bodyHtml;
            body.querySelectorAll("textarea").forEach(el => autoGrow(el));
        }

        function onCellInput(el) {
            autoGrow(el);
            const id = el.dataset.cellId;
            const select = document.querySelector(`select[data-cell-id="${id}"]`);
            const programId = select && select.value ? select.value : null;
            saveKey(id, serializeCell(el.value, programId));
        }

        function onProgramSelect(selectEl) {
            const id = selectEl.dataset.cellId;
            const programId = selectEl.value || null;
            const ta = document.querySelector(`textarea[data-cell-id="${id}"]`);
            let text;
            if (programId) {
                const program = programs.find(p => p.id === programId);
                text = program ? `${program.name}: ${formatProgramLabel(program)}` : (ta ? ta.value : "");
            } else {
                text = ta ? ta.value : "";
            }
            if (ta) { ta.value = text; autoGrow(ta); }
            const td = selectEl.closest("td");
            td.classList.toggle("linked-cell", !!programId);
            saveKey(id, serializeCell(text, programId));
            renderWeeklyTotals();
        }

        // ---------- notes: multiple nameable pages ----------
        function loadNotePages() {
            const row = trainingCache["training_notes_pages"];
            if (row && row.content) notePages = safelyParse(row.content, []);

            if (!notePages || notePages.length === 0) {
                const legacy = trainingCache["training_general_notes"];
                if (legacy && legacy.content) {
                    const legacyLines = safelyParse(legacy.content, null);
                    if (Array.isArray(legacyLines) && legacyLines.length > 0) {
                        notePages = [{ id: uid(), title: "General", lines: legacyLines }];
                    }
                }
            }
            if (!notePages || notePages.length === 0) {
                notePages = [{ id: uid(), title: "General", lines: [{ id: uid(), text: "", checked: null }] }];
            }
            activePageId = notePages[0].id;
            saveNotePages();
        }
        function saveNotePages() {
            saveKey("training_notes_pages", JSON.stringify(notePages));
        }
        function activePage() {
            return notePages.find(p => p.id === activePageId) || notePages[0];
        }
        function renderPageTabs() {
            const wrap = document.getElementById("pageTabs");
            wrap.innerHTML = notePages.map(p => `
                <button onclick="switchPage('${p.id}')"
                    class="px-2 py-1 text-[11px] rounded whitespace-nowrap transition ${
                        p.id === activePageId
                            ? 'bg-slate-700 text-white dark:bg-slate-200 dark:text-slate-900'
                            : 'text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700/50'
                    }">${escapeHtml(p.title || "Untitled")}</button>
            `).join("");
            document.getElementById("activePageTitle").textContent = activePage() ? (activePage().title || "Untitled") : "";
        }
        function switchPage(id) {
            activePageId = id;
            renderPageTabs();
            renderPageLines();
        }
        function addPage() {
            const title = prompt("Page title:", "New page");
            if (title === null) return;
            const page = { id: uid(), title: title.trim() || "Untitled", lines: [{ id: uid(), text: "", checked: null }] };
            notePages.push(page);
            activePageId = page.id;
            saveNotePages();
            renderPageTabs();
            renderPageLines();
        }
        function renamePage() {
            const page = activePage();
            if (!page) return;
            const title = prompt("Rename page:", page.title || "");
            if (title === null) return;
            page.title = title.trim() || "Untitled";
            saveNotePages();
            renderPageTabs();
        }
        function deletePage() {
            if (notePages.length <= 1) { alert("You need at least one page."); return; }
            const page = activePage();
            if (!page) return;
            if (!confirm(`Delete page "${page.title || 'Untitled'}"? This can't be undone.`)) return;
            notePages = notePages.filter(p => p.id !== page.id);
            activePageId = notePages[0].id;
            saveNotePages();
            renderPageTabs();
            renderPageLines();
        }

        function focusPageLine(lineId, caret) {
            requestAnimationFrame(() => {
                const el = document.querySelector(`textarea[data-line="${lineId}"]`);
                if (el) {
                    el.focus();
                    const pos = caret === undefined ? el.value.length : caret;
                    el.setSelectionRange(pos, pos);
                }
            });
        }

        function renderPageLines() {
            const page = activePage();
            const wrap = document.getElementById("pageLinesList");
            if (!page) { wrap.innerHTML = ""; return; }

            wrap.innerHTML = page.lines.map(line => {
                if (line.checked === null) {
                    return `
                        <div class="flex items-start gap-1.5">
                            <textarea rows="1"
                                class="pg-line w-full bg-transparent text-xs focus:outline-none py-1 resize-none overflow-hidden leading-snug text-slate-700 dark:text-slate-300"
                                data-line="${line.id}"
                                oninput="handlePageLineInput('${line.id}', this)"
                                onkeydown="handlePageLineKeydown(event, '${line.id}')">${escapeHtml(line.text)}</textarea>
                        </div>`;
                }
                return `
                    <div class="flex items-start gap-1.5">
                        <input type="checkbox" ${line.checked ? "checked" : ""} onchange="togglePageLineCheck('${line.id}', this)"
                            class="h-3 w-3 mt-1.5 rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-900 checked:bg-slate-500 focus:ring-0 shrink-0">
                        <textarea rows="1"
                            class="pg-line w-full bg-transparent text-xs focus:outline-none py-1 resize-none overflow-hidden leading-snug ${line.checked ? "line-through text-slate-400 dark:text-slate-500" : "text-slate-700 dark:text-slate-300"}"
                            data-line="${line.id}"
                            oninput="handlePageLineInput('${line.id}', this)"
                            onkeydown="handlePageLineKeydown(event, '${line.id}')">${escapeHtml(line.text)}</textarea>
                    </div>`;
            }).join("");
            wrap.querySelectorAll("textarea").forEach(el => autoGrow(el));
        }

        function handlePageLineInput(lineId, el) {
            const page = activePage();
            if (!page) return;
            const line = page.lines.find(l => l.id === lineId);
            if (!line) return;
            const value = el.value;

            if (line.checked === null) {
                const match = value.match(/^\*\(\)\s?(.*)$/);
                if (match) {
                    line.checked = false;
                    line.text = match[1];
                    renderPageLines();
                    saveNotePages();
                    focusPageLine(lineId, line.text.length);
                    return;
                }
            }
            autoGrow(el);
            line.text = value;
            saveNotePages();
        }

        function togglePageLineCheck(lineId, checkbox) {
            const page = activePage();
            if (!page) return;
            const line = page.lines.find(l => l.id === lineId);
            if (!line) return;
            line.checked = checkbox.checked;
            renderPageLines();
            saveNotePages();
        }

        function handlePageLineKeydown(e, lineId) {
            const page = activePage();
            if (!page) return;
            const idx = page.lines.findIndex(l => l.id === lineId);
            if (idx === -1) return;
            const line = page.lines[idx];
            const inputEl = e.target;

            if (e.key === "Enter") {
                e.preventDefault();
                const caret = inputEl.selectionStart;
                const before = line.text.slice(0, caret);
                const after = line.text.slice(caret);
                line.text = before;
                const newLine = { id: uid(), text: after, checked: line.checked !== null ? false : null };
                page.lines.splice(idx + 1, 0, newLine);
                renderPageLines();
                saveNotePages();
                focusPageLine(newLine.id, 0);
                return;
            }

            if (e.key === "Backspace") {
                const atStart = inputEl.selectionStart === 0 && inputEl.selectionEnd === 0;
                if (!atStart) return;

                if (line.checked !== null) {
                    e.preventDefault();
                    line.checked = null;
                    renderPageLines();
                    saveNotePages();
                    focusPageLine(lineId, 0);
                    return;
                }

                if (idx > 0) {
                    e.preventDefault();
                    const prev = page.lines[idx - 1];
                    const mergeCaret = prev.text.length;
                    prev.text = prev.text + line.text;
                    page.lines.splice(idx, 1);
                    renderPageLines();
                    saveNotePages();
                    focusPageLine(prev.id, mergeCaret);
                }
            }
        }

        // ---------- running programs & zone math ----------
        function defaultZones() {
            const z = {};
            ZONES.forEach(n => z[n] = { pace: "", hrMin: "", hrMax: "" });
            return z;
        }

        function loadProgramsAndZones() {
            const pRow = trainingCache["training_programs"];
            programs = pRow && pRow.content ? safelyParse(pRow.content, []) : [];
            const zRow = trainingCache["training_zone_settings"];
            zoneSettings = zRow && zRow.content ? safelyParse(zRow.content, {}) : {};
            PEOPLE.forEach(p => { if (!zoneSettings[p.key]) zoneSettings[p.key] = defaultZones(); });
        }
        function savePrograms() { saveKey("training_programs", JSON.stringify(programs)); }
        function saveZoneSettings() { saveKey("training_zone_settings", JSON.stringify(zoneSettings)); }

        function formatDuration(minutes, seconds) {
            const m = Number(minutes) || 0;
            const s = Number(seconds) || 0;
            return `${m}:${String(s).padStart(2, "0")}`;
        }
        function formatProgramLabel(program) {
            return program.segments.map(seg => {
                const rep = (Number(seg.repeat) || 1) > 1 ? `${seg.repeat}x ` : "";
                return `${rep}${formatDuration(seg.minutes, seg.seconds)} Z${seg.zone}`;
            }).join(" + ");
        }
        function segmentMinutes(seg) {
            const secs = (Number(seg.minutes) || 0) * 60 + (Number(seg.seconds) || 0);
            const repeat = Number(seg.repeat) || 1;
            return (secs * repeat) / 60;
        }

        function computeZoneTotals(person, year, week) {
            const totals = {}; ZONES.forEach(z => totals[z] = 0);
            for (let day = 0; day < 7; day++) {
                for (const slot of SLOTS) {
                    const raw = getCellRaw(person, year, week, day, slot.key);
                    const parsed = parseCell(raw);
                    if (!parsed.programId) continue;
                    const program = programs.find(p => p.id === parsed.programId);
                    if (!program) continue;
                    program.segments.forEach(seg => {
                        totals[seg.zone] = (totals[seg.zone] || 0) + segmentMinutes(seg);
                    });
                }
            }
            return totals;
        }

        function renderWeeklyTotals() {
            const monday = currentMonday();
            const { year, week } = getISOWeek(monday);
            const prevMonday = addDays(monday, -7);
            const { year: pYear, week: pWeek } = getISOWeek(prevMonday);

            const totals = computeZoneTotals(activePerson, year, week);
            const prevTotals = computeZoneTotals(activePerson, pYear, pWeek);
            const personLabel = PEOPLE.find(p => p.key === activePerson).label;

            document.getElementById("totalsHeading").textContent = `Weekly totals — ${personLabel} (Wk ${week})`;

            const zones = zoneSettings[activePerson] || defaultZones();
            let totalMin = 0, prevTotalMin = 0;
            let rows = ZONES.map(z => {
                const min = totals[z] || 0;
                const prevMin = prevTotals[z] || 0;
                totalMin += min;
                prevTotalMin += prevMin;
                const diff = min - prevMin;
                const diffStr = diff === 0 ? "±0" : (diff > 0 ? `+${Math.round(diff)}` : `${Math.round(diff)}`);
                const diffClass = diff > 0 ? "text-emerald-500" : diff < 0 ? "text-red-500" : "text-slate-400";
                const ref = zones[z] && (zones[z].pace || zones[z].hrMin || zones[z].hrMax)
                    ? `<span class="text-slate-400"> · ${escapeHtml(zones[z].pace || "")}${zones[z].hrMin || zones[z].hrMax ? ` ${zones[z].hrMin || "?"}-${zones[z].hrMax || "?"}bpm` : ""}</span>`
                    : "";
                return `
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-600 dark:text-slate-300">Zone ${z}${ref}</span>
                        <span class="font-medium">${Math.round(min)} min <span class="${diffClass}">(${diffStr})</span></span>
                    </div>`;
            }).join("");

            const totalDiff = totalMin - prevTotalMin;
            const totalDiffStr = totalDiff === 0 ? "±0" : (totalDiff > 0 ? `+${Math.round(totalDiff)}` : `${Math.round(totalDiff)}`);
            const totalDiffClass = totalDiff > 0 ? "text-emerald-500" : totalDiff < 0 ? "text-red-500" : "text-slate-400";

            rows += `
                <div class="flex items-center justify-between text-xs font-semibold border-t border-slate-200 dark:border-slate-800 pt-1.5 mt-1.5">
                    <span>Total</span>
                    <span>${Math.round(totalMin)} min <span class="${totalDiffClass}">(${totalDiffStr})</span></span>
                </div>`;

            document.getElementById("weeklyTotals").innerHTML = rows;
        }

        // ---------- zone settings UI ----------
        function renderZoneSettings() {
            const personLabel = PEOPLE.find(p => p.key === activePerson).label;
            document.getElementById("zoneHeading").textContent = `Pace & HR zones — ${personLabel}`;
            const zones = zoneSettings[activePerson] || defaultZones();

            const rows = ZONES.map(z => `
                <div class="grid grid-cols-3 gap-2 items-center mb-1.5">
                    <span class="text-xs text-slate-500 w-10">Z${z}</span>
                    <input type="text" placeholder="pace e.g. 5:30/km" value="${escapeHtml(zones[z].pace)}"
                        oninput="updateZoneField(${z}, 'pace', this.value)"
                        class="col-span-1 text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1.5 py-1 focus:outline-none">
                    <div class="flex items-center gap-1">
                        <input type="number" placeholder="min bpm" value="${escapeHtml(String(zones[z].hrMin))}"
                            oninput="updateZoneField(${z}, 'hrMin', this.value)"
                            class="w-full text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1.5 py-1 focus:outline-none">
                        <input type="number" placeholder="max bpm" value="${escapeHtml(String(zones[z].hrMax))}"
                            oninput="updateZoneField(${z}, 'hrMax', this.value)"
                            class="w-full text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1.5 py-1 focus:outline-none">
                    </div>
                </div>`).join("");

            document.getElementById("zoneSettingsTable").innerHTML = rows;
        }
        function updateZoneField(zone, field, value) {
            if (!zoneSettings[activePerson]) zoneSettings[activePerson] = defaultZones();
            zoneSettings[activePerson][zone][field] = value;
            saveZoneSettings();
            renderWeeklyTotals();
        }

        // ---------- programs library ----------
        function renderProgramsList() {
            const wrap = document.getElementById("programsList");
            if (programs.length === 0) {
                wrap.innerHTML = `<p class="text-xs text-slate-400">No programs yet.</p>`;
                return;
            }
            wrap.innerHTML = programs.map(p => `
                <div class="flex items-center justify-between gap-2 text-xs border-b border-slate-100 dark:border-slate-800 pb-1.5 mb-1.5 last:border-0">
                    <div class="min-w-0">
                        <div class="font-medium truncate">${escapeHtml(p.name)}</div>
                        <div class="text-slate-400 truncate">${escapeHtml(formatProgramLabel(p))}</div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="openProgramBuilder('${p.id}')" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition">edit</button>
                        <button onclick="deleteProgram('${p.id}')" class="text-slate-400 hover:text-red-500 transition">del</button>
                    </div>
                </div>`).join("");
        }

        function openProgramBuilder(programId) {
            if (programId) {
                const p = programs.find(x => x.id === programId);
                builderProgram = { id: p.id, name: p.name, segments: p.segments.map(s => ({ ...s })) };
            } else {
                builderProgram = { id: null, name: "", segments: [{ id: uid(), minutes: 30, seconds: 0, zone: 2, repeat: 1 }] };
            }
            renderProgramBuilder();
        }
        function closeProgramBuilder() {
            builderProgram = null;
            renderProgramBuilder();
        }
        function addBuilderSegment() {
            builderProgram.segments.push({ id: uid(), minutes: 4, seconds: 0, zone: 4, repeat: 1 });
            renderProgramBuilder();
        }
        function removeBuilderSegment(segId) {
            builderProgram.segments = builderProgram.segments.filter(s => s.id !== segId);
            renderProgramBuilder();
        }
        function updateBuilderName(value) {
            builderProgram.name = value;
        }
        function updateBuilderSegmentField(segId, field, value) {
            const seg = builderProgram.segments.find(s => s.id === segId);
            if (!seg) return;
            seg[field] = Number(value) || 0;
        }
        function saveBuilderProgram() {
            if (!builderProgram.name.trim()) { alert("Give the program a name."); return; }
            if (builderProgram.segments.length === 0) { alert("Add at least one segment."); return; }
            if (builderProgram.id) {
                const idx = programs.findIndex(p => p.id === builderProgram.id);
                programs[idx] = { id: builderProgram.id, name: builderProgram.name.trim(), segments: builderProgram.segments };
            } else {
                programs.push({ id: uid(), name: builderProgram.name.trim(), segments: builderProgram.segments });
            }
            savePrograms();
            builderProgram = null;
            renderProgramBuilder();
            renderProgramsList();
            renderWeek();
            renderWeeklyTotals();
        }
        function deleteProgram(id) {
            if (!confirm("Delete this program? Cells that used it will keep their text but stop counting toward weekly totals.")) return;
            programs = programs.filter(p => p.id !== id);
            savePrograms();
            renderProgramsList();
            renderWeek();
            renderWeeklyTotals();
        }

        function renderProgramBuilder() {
            const wrap = document.getElementById("programBuilderWrap");
            if (!builderProgram) { wrap.innerHTML = ""; return; }

            const segRows = builderProgram.segments.map(seg => `
                <div class="flex items-center gap-1 mb-1">
                    <input type="number" min="0" value="${seg.minutes}" placeholder="min"
                        oninput="updateBuilderSegmentField('${seg.id}','minutes',this.value)"
                        class="w-12 text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1 py-0.5 focus:outline-none">
                    <span class="text-xs text-slate-400">m</span>
                    <input type="number" min="0" max="59" value="${seg.seconds}" placeholder="sec"
                        oninput="updateBuilderSegmentField('${seg.id}','seconds',this.value)"
                        class="w-12 text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1 py-0.5 focus:outline-none">
                    <span class="text-xs text-slate-400">s</span>
                    <select onchange="updateBuilderSegmentField('${seg.id}','zone',this.value)"
                        class="text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1 py-0.5 focus:outline-none">
                        ${ZONES.map(z => `<option value="${z}" ${z === seg.zone ? "selected" : ""}>Z${z}</option>`).join("")}
                    </select>
                    <input type="number" min="1" value="${seg.repeat}" placeholder="x"
                        oninput="updateBuilderSegmentField('${seg.id}','repeat',this.value)"
                        class="w-10 text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1 py-0.5 focus:outline-none" title="repeat count">
                    <span class="text-xs text-slate-400">x</span>
                    <button onclick="removeBuilderSegment('${seg.id}')" class="text-slate-400 hover:text-red-500 text-xs ml-1">✕</button>
                </div>`).join("");

            wrap.innerHTML = `
                <div class="border-t border-slate-200 dark:border-slate-800 pt-3 mt-2">
                    <input type="text" value="${escapeHtml(builderProgram.name)}" placeholder="Program name (e.g. Norwegian 4x4)"
                        oninput="updateBuilderName(this.value)"
                        class="w-full text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-2 py-1.5 mb-2 focus:outline-none">
                    <div class="text-[10px] text-slate-400 mb-1">Segments (basic run = one row; intervals = several rows, use "x" to repeat a row)</div>
                    ${segRows}
                    <button onclick="addBuilderSegment()" class="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition mt-1">+ segment</button>
                    <div class="flex items-center gap-2 mt-3">
                        <button onclick="saveBuilderProgram()" class="text-xs px-3 py-1 rounded bg-slate-700 text-white dark:bg-slate-200 dark:text-slate-900">Save</button>
                        <button onclick="closeProgramBuilder()" class="text-xs px-3 py-1 rounded border border-slate-300 dark:border-slate-700">Cancel</button>
                    </div>
                </div>`;
        }

        // ---------- PDF export: both Jacob's and Zara's table + totals for the current week ----------
        function exportWeekPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const monday = currentMonday();
            const { year, week } = getISOWeek(monday);
            const sunday = addDays(monday, 6);
            const dayDates = Array.from({ length: 7 }, (_, i) => formatShort(addDays(monday, i)));

            doc.setFontSize(14);
            doc.text(`Training — Week ${week}, ${year}`, 14, 16);
            doc.setFontSize(9);
            doc.setTextColor(120);
            doc.text(`${formatShort(monday)} - ${formatShort(sunday)}`, 14, 22);
            doc.setTextColor(0);

            let startY = 28;

            PEOPLE.forEach(person => {
                doc.setFontSize(11);
                doc.text(person.label, 14, startY);

                const head = [["", ...DAY_LABELS.map((d, i) => `${d} ${dayDates[i]}`)]];
                const body = SLOTS.map(slot => [
                    slot.label,
                    ...Array.from({ length: 7 }, (_, i) => parseCell(getCellRaw(person.key, year, week, i, slot.key)).text || "")
                ]);

                doc.autoTable({
                    startY: startY + 3,
                    head, body,
                    styles: { fontSize: 7, cellPadding: 2, valign: "top", overflow: "linebreak" },
                    headStyles: { fillColor: [71, 85, 105], textColor: 255, fontSize: 7 },
                    columnStyles: { 0: { fontStyle: "bold", cellWidth: 18 } },
                    margin: { left: 14, right: 14 },
                    theme: "grid"
                });
                startY = doc.lastAutoTable.finalY + 4;

                const totals = computeZoneTotals(person.key, year, week);
                const totalsBody = [ZONES.map(z => `Z${z}: ${Math.round(totals[z] || 0)}m`)];
                doc.autoTable({
                    startY,
                    body: totalsBody,
                    styles: { fontSize: 7, cellPadding: 2 },
                    theme: "plain",
                    margin: { left: 14, right: 14 }
                });
                startY = doc.lastAutoTable.finalY + 10;
            });

            doc.save(`training_week_${year}_W${week}.pdf`);
        }

        // ---------- init ----------
        fetchTraining();
    </script>
</body>
