  <style>

    .lx-edit { flex:1 1 50%; min-width:0; display:flex; flex-direction:column; background:#fff; }

    /* ================= Design Studio (editor) ================= */
    #view-editor { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:#e9ecf1; color:#0f172a; }
    #view-editor.hidden { display:none !important; }
    #view-editor button:disabled { opacity:.35; cursor:not-allowed; }
    #view-editor svg.lucide { width:18px; height:18px; }
    .ds-top { height:52px; flex-shrink:0; display:flex; align-items:center; gap:4px; padding:0 10px; background:#fff; border-bottom:1px solid #e2e8f0; }
    .ds-tb { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 9px; border-radius:8px; font-size:13px; font-weight:600; color:#334155; flex-shrink:0; }
    .ds-tb:hover:not(:disabled) { background:#f1f5f9; }
    .ds-name { min-width:60px; width:clamp(90px, 22vw, 260px); height:34px; padding:0 9px; border:1px solid transparent; border-radius:8px; font-size:14px; font-weight:600; color:#0f172a; background:transparent; text-overflow:ellipsis; }
    .ds-name:hover { border-color:#e2e8f0; } .ds-name:focus { outline:none; border-color:#3b82f6; background:#fff; }
    .ds-zoom { align-items:center; border:1px solid #e2e8f0; border-radius:8px; height:34px; overflow:hidden; flex-shrink:0; }
    .ds-zoom button { height:100%; padding:0 9px; font-size:13px; font-weight:600; color:#334155; } .ds-zoom button:hover { background:#f1f5f9; }
    #ds-zoom-label { min-width:52px; border-left:1px solid #e2e8f0; border-right:1px solid #e2e8f0; font-size:12px; }
    .ds-primary { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 14px; border-radius:8px; background:#2563eb; color:#fff; font-size:13px; font-weight:600; flex-shrink:0; }
    .ds-primary:hover { background:#1d4ed8; }
    .ds-body { flex:1; min-height:0; display:flex; position:relative; }
    .ds-rail { width:68px; flex-shrink:0; background:#0f172a; display:flex; flex-direction:column; gap:2px; padding:6px 4px; overflow-y:auto; }
    .ds-rail button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; border-radius:8px; color:#94a3b8; font-size:10px; font-weight:600; }
    .ds-rail button:hover { color:#fff; background:#1e293b; } .ds-rail button.active { color:#fff; background:#1e3a8a; }
    .ds-rail svg.lucide { width:20px !important; height:20px !important; }
    .ds-left { width:296px; flex-shrink:0; background:#fff; border-right:1px solid #e2e8f0; overflow-y:auto; padding:14px; }
    .ds-left.collapsed { display:none; }
    .ds-center { flex:1; min-width:0; position:relative; }
    .ds-center.ds-drop { outline:3px dashed #3b82f6; outline-offset:-8px; background:#dbeafe; }
    .ds-scroll { position:absolute; inset:0; overflow:auto; }
    .ds-pages { display:flex; flex-direction:column; align-items:center; gap:18px; padding:20px 32px 48px; min-width:fit-content; }
    .ds-pageblock { display:flex; flex-direction:column; gap:6px; }
    .ds-pagebar { display:flex; align-items:center; gap:4px; font-size:12px; color:#475569; height:26px; }
    .ds-pagebar button { width:26px; height:26px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; color:#475569; }
    .ds-pagebar button:hover:not(:disabled) { background:#dde3ea; }
    .ds-pagebar svg.lucide { width:15px !important; height:15px !important; }
    .ds-pagewrap { position:relative; flex-shrink:0; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.08), 0 4px 18px rgba(15,23,42,.08); }
    .ds-pagewrap.active { box-shadow:0 0 0 2px #93c5fd, 0 4px 18px rgba(15,23,42,.10); }
    .ds-page { position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; }
    .ds-overlay { position:absolute; inset:0; pointer-events:none; z-index:5; }
    .ds-addpage { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:10px; border:1.5px dashed #94a3b8; color:#475569; font-size:13px; font-weight:600; background:rgba(255,255,255,.5); }
    .ds-addpage:hover { border-color:#2563eb; color:#1d4ed8; background:#fff; }
    .ds-right { width:280px; flex-shrink:0; background:#fff; border-left:1px solid #e2e8f0; overflow-y:auto; }
    /* selection overlay */
    .ds-selbox { position:absolute; box-shadow:0 0 0 1.5px #2563eb; transform-origin:50% 50%; }
    .ds-selbox.thin { box-shadow:0 0 0 1px #60a5fa; }
    .ds-selbox.group { box-shadow:none; outline:1.5px dashed #2563eb; }
    .ds-selbox.editing { box-shadow:0 0 0 1.5px #a855f7; }
    .ds-selbox.cropping { box-shadow:0 0 0 2px #f59e0b; }
    .ds-h { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; background:#fff; border:1.5px solid #2563eb; border-radius:50%; pointer-events:auto; box-shadow:0 1px 2px rgba(0,0,0,.2); touch-action:none; }
    .ds-h[data-h=nw], .ds-h[data-h=se] { cursor:nwse-resize; } .ds-h[data-h=ne], .ds-h[data-h=sw] { cursor:nesw-resize; }
    .ds-h.side { border-radius:4px; } .ds-h.side-n, .ds-h.side-s { width:20px; height:7px; margin:-3.5px 0 0 -10px; cursor:ns-resize; }
    .ds-h.side-e, .ds-h.side-w { width:7px; height:20px; margin:-10px 0 0 -3.5px; cursor:ew-resize; }
    .ds-rot { position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:#fff; color:#334155; display:flex; align-items:center; justify-content:center; pointer-events:auto; cursor:grab; box-shadow:0 1px 4px rgba(0,0,0,.25); touch-action:none; }
    .ds-lockbadge { position:absolute; width:20px; height:20px; border-radius:50%; background:#0f172a; color:#fff; display:flex; align-items:center; justify-content:center; }
    .ds-tip { position:absolute; transform:translateX(-50%); background:#0f172a; color:#fff; font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; white-space:nowrap; }
    .ds-guide { position:absolute; background:#ec4899; }
    .ds-marquee { position:absolute; border:1px solid #2563eb; background:rgba(37,99,235,.08); }
    /* page objects (global: also used for print, thumbnails and PDF text measurement) */
    .ds-obj, .ds-obj.ds-text { position:absolute; box-sizing:border-box; transform-origin:50% 50%; user-select:none; -webkit-user-select:none; }
    .ds-page .ds-obj { cursor:move; }
    .ds-obj svg { overflow:visible; }
    .ds-text { box-sizing:border-box; white-space:pre-wrap; overflow-wrap:break-word; word-break:normal; outline:none; margin:0; padding:0; font-kerning:normal; }
    .ds-text p { margin:0; padding:0; min-height:1px; }
    .ds-text > p + p { margin-top:var(--ps, 0px); }
    .ds-text b, .ds-text strong { font-weight:700; } .ds-text i, .ds-text em { font-style:italic; } .ds-text u { text-decoration:underline; }
    .ds-text[contenteditable=true] { cursor:text; user-select:text; -webkit-user-select:text; }
    .ds-list-bullet > p, .ds-list-number > p { position:relative; padding-left:1.15em; }
    .ds-list-number > p { padding-left:1.6em; }
    .ds-list-bullet > p::before { content:'•'; position:absolute; left:0.15em; top:0; }
    .ds-list-number { counter-reset:dsn; } .ds-list-number > p { counter-increment:dsn; }
    .ds-list-number > p::before { content:counter(dsn) '.'; position:absolute; left:0; top:0; }
    .ds-ph { position:absolute; inset:0; background:#e2e8f0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .ds-pdfbg { pointer-events:none; }
    .ds-pdftext { position:absolute; z-index:4; border:1px dashed #2563eb; background:rgba(37,99,235,.10); cursor:text; border-radius:2px; }
    .ds-pdftext:hover { background:rgba(37,99,235,.24); }
    /* panels */
    .ds-h3 { font-size:14px; font-weight:700; color:#0f172a; margin-bottom:4px; }
    .ds-sub { font-size:12px; color:#64748b; line-height:1.45; }
    .ds-lbl { font-size:11px; font-weight:600; color:#64748b; margin:10px 0 5px; }
    .ds-sec { padding:14px; border-bottom:1px solid #f1f5f9; }
    .ds-sec h4 { font-size:11px; font-weight:700; color:#0f172a; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
    .ds-sec > .ds-lbl:first-of-type { margin-top:0; }
    .ds-tips { list-style:disc; padding-left:16px; font-size:12px; color:#475569; line-height:1.5; } .ds-tips li + li { margin-top:4px; }
    .ds-input { width:100%; height:34px; padding:0 9px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; font-size:13px; color:#0f172a; }
    textarea.ds-input { height:auto; padding:7px 9px; }
    .ds-input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 2px #dbeafe; }
    .ds-btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; height:34px; padding:0 12px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; font-size:13px; font-weight:600; color:#334155; white-space:nowrap; }
    .ds-btn:hover { background:#f8fafc; border-color:#cbd5e1; }
    .ds-ibtn { display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:32px; padding:0 6px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; color:#334155; font-size:14px; flex-shrink:0; }
    .ds-ibtn:hover { background:#f1f5f9; } .ds-ibtn.on { background:#dbeafe; border-color:#93c5fd; color:#1d4ed8; }
    .ds-ibtn.danger { color:#dc2626; } .ds-ibtn.danger:hover { background:#fef2f2; border-color:#fecaca; }
    .ds-ibtn svg.lucide { width:16px !important; height:16px !important; }
    .ds-bigbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:10px 12px; border-radius:10px; background:#2563eb; color:#fff; font-size:13px; font-weight:600; margin:6px 0; }
    .ds-bigbtn:hover { background:#1d4ed8; } .ds-bigbtn.alt { background:#fff; color:#1e293b; border:1px solid #cbd5e1; } .ds-bigbtn.alt:hover { background:#f8fafc; }
    .ds-bigbtn.on { background:#f59e0b; } .ds-bigbtn.on:hover { background:#d97706; }
    .ds-num { display:flex; align-items:center; height:32px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; overflow:hidden; min-width:0; }
    .ds-num input { flex:1; min-width:0; width:100%; height:100%; padding:0 7px; font-size:13px; border:0; background:transparent; }
    .ds-num input:focus { outline:none; } .ds-num:focus-within { border-color:#3b82f6; }
    .ds-num span { padding:0 7px 0 2px; font-size:11px; color:#94a3b8; }
    .ds-range { width:100%; accent-color:#2563eb; }
    .ds-size { width:60px; flex-shrink:0; }
    .ds-colors { display:flex; flex-wrap:wrap; gap:5px; }
    .ds-swatch { width:22px; height:22px; border-radius:6px; border:1px solid rgba(15,23,42,.15); position:relative; flex-shrink:0; cursor:pointer; }
    .ds-swatch.on { box-shadow:0 0 0 2px #fff, 0 0 0 4px #2563eb; }
    .ds-swatch.none { background:#fff linear-gradient(135deg, transparent 45%, #ef4444 45%, #ef4444 55%, transparent 55%); }
    .ds-picker { background:conic-gradient(#ef4444, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444); overflow:hidden; }
    .ds-picker input { position:absolute; inset:-6px; width:40px; height:40px; opacity:0; cursor:pointer; }
    .ds-chip { padding:5px 10px; border:1px solid #e2e8f0; border-radius:999px; font-size:12px; font-weight:600; color:#475569; background:#fff; }
    .ds-chip:hover { border-color:#cbd5e1; } .ds-chip.on { background:#1e293b; border-color:#1e293b; color:#fff; }
    .ds-addtext { display:block; width:100%; text-align:left; padding:10px 12px; border-radius:10px; background:#f1f5f9; color:#0f172a; margin-top:6px; line-height:1.2; }
    .ds-addtext:hover { background:#e2e8f0; } .ds-addtext.sm { font-size:12px; margin-top:0; }
    .ds-combo { display:flex; flex-direction:column; gap:5px; width:100%; text-align:left; padding:10px 12px; border:1px solid #e2e8f0; border-radius:10px; background:#fff; }
    .ds-combo:hover { border-color:#3b82f6; background:#f8fbff; } .ds-combo > span { font-size:11px; color:#64748b; }
    .ds-shapebtn { display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; min-height:44px; border-radius:8px; background:#f8fafc; border:1px solid #f1f5f9; }
    .ds-shapebtn:hover { background:#eff6ff; border-color:#bfdbfe; }
    .ds-iconbtn { display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; padding:7px; border-radius:8px; }
    .ds-iconbtn:hover { background:#eff6ff; }

    // "1-3, 5, 8-", "-2", "odd", "even", "last" -> 0-based indices (keeps the given order, no duplicates)
    function parsePageList(str, total, { sort = false } = {}) {
      const out = [];
      const add = (i) => { if (i >= 0 && i < total && !out.includes(i)) out.push(i); };
      const num = (t) => /^(last|end)$/i.test(t) ? total : parseInt(t, 10);
      const s = String(str || '').trim();
      if (!s || /^all$/i.test(s)) { for (let i = 0; i < total; i++) add(i); return out; }
      for (let part of s.split(/[,;\s]+/)) {
        part = part.trim();
        if (!part) continue;
        if (/^odd$/i.test(part)) { for (let i = 0; i < total; i += 2) add(i); continue; }
        if (/^even$/i.test(part)) { for (let i = 1; i < total; i += 2) add(i); continue; }
        const m = /^(\d+|last|end)?\s*-\s*(\d+|last|end)?$/i.exec(part);
        if (m && (m[1] || m[2])) {
          let a = m[1] ? num(m[1]) : 1, b = m[2] ? num(m[2]) : total;
          if (isNaN(a) || isNaN(b)) continue;
          if (a <= b) for (let i = a; i <= b; i++) add(i - 1); else for (let i = a; i >= b; i--) add(i - 1);
        } else {

    const PAPER = { // points, portrait

    // Image helpers --------------------------------------------------------
    function sniffImage(bytes) {

    // Reads the EXIF orientation of a JPEG (1 = normal). Phones store rotated photos with this flag.

    function loadImageEl(src) {

    // =====================================================================

    const state = {

    // ---- dashboard -------------------------------------------------------
    function renderDashboard() {
      const q = ($('tool-search').value || '').trim().toLowerCase();

    function acceptLabel(tool) {

    function selectTool(toolId, { fromHash = false } = {}) {

    function destroyPdfJs(file) {

    // ---- dropzone / files ------------------------------------------------
    function setupDropzone() {

    async function handleFiles(newFiles) {
      const tool = state.currentTool;
      if (!tool || state.busy) return;
      const validExts = tool.accept.split(',').map(ext => ext.trim().toLowerCase());
      const named = newFiles.map(f => (f.name ? f : new File([f], 'pasted' + (f.type === 'image/png' ? '.png' : '.bin'), { type: f.type })));
      const filtered = tool.accept === '*' ? named : named.filter(file => validExts.includes(extOf(file.name)));
      if (!filtered.length) { showToast(`Unsupported file type for ${tool.name}. ${acceptLabel(tool)}.`, 'error'); return; }
      if (filtered.length < named.length) showToast(`Skipped ${named.length - filtered.length} unsupported file(s).`, 'warn');

      filtered.forEach(f => { f._sid = f._sid || uid(); });
      if (!tool.multiple) {
        for (const f of state.files) destroyPdfJs(f);
        state.files = [filtered[0]];
        state.pages = [];
      } else {
        state.files.push(...filtered);

      clearResults();
      showToast(`Loaded ${tool.multiple ? filtered.length : 1} file(s).`, 'success', 2200);
      await updateStageUI({ added: filtered });

    function clearFiles() {

    function moveFile(index, direction) {

    const _fileInfo = new WeakMap();
    function fileIcon(file) {

      if (['.xlsx', '.xls', '.csv', '.ods', '.fods', '.ots', '.tsv', '.json', '.xlsm', '.xlsb'].includes(e)) return 'file-spreadsheet';
      if (['.mp3', '.wav', '.ogg', '.oga', '.m4a', '.aac', '.flac', '.opus', '.weba'].includes(e)) return 'file-music';
      if (['.mp4', '.webm', '.mov', '.mkv', '.m4v', '.avi'].includes(e)) return 'file-video';
      if (['.zip'].includes(e)) return 'file-archive';
      if (['.heic', '.heif', '.ico', '.tif', '.tiff'].includes(e)) return 'image';

    async function updateStageUI(ctx = {}) {

              <button onclick="moveFile(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Move up" class="p-1 hover:bg-slate-200 rounded text-slate-600 disabled:opacity-30"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
              <button onclick="moveFile(${idx}, 1)" ${idx === state.files.length - 1 ? 'disabled' : ''} title="Move down" class="p-1 hover:bg-slate-200 rounded text-slate-600 disabled:opacity-30"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>` : ''}
            <button onclick="removeFile(${idx})" title="Remove" class="p-1 hover:bg-red-50 rounded text-red-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>`).join('');
      if (ordered) enableRowDrag(fileList);
      if (state.files.length < (tool.minFiles || 1)) fileList.insertAdjacentHTML('beforeend', `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2">Add at least ${tool.minFiles} files to use ${esc(tool.name)}.</p>`);
      lucide.createIcons();
      state.files.forEach(f => fillFileInfo(f));

      if (tool.onFiles) {
        try { await tool.onFiles(ctx); }
        catch (err) { console.error(err); showToast(err.message || 'Could not read the file.', 'error'); }
      }
      lucide.createIcons();
    }

    // Drag & drop reordering of file rows
    function enableRowDrag(list) {
      let from = null;
      list.querySelectorAll('.file-row').forEach(row => {
        row.addEventListener('dragstart', (e) => { from = +row.dataset.idx; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-target'); });
        row.addEventListener('dragleave', () => row.classList.remove('drag-target'));
        row.addEventListener('drop', (e) => {
          e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-target');
          const to = +row.dataset.idx;
          if (from === null || from === to) return;
          const [f] = state.files.splice(from, 1);
          state.files.splice(to, 0, f);
          from = null;
          updateStageUI();
        });
      });
    }

    // Page count + first-page thumbnail for PDFs, preview for images
    async function fillFileInfo(file) {
      const thumbEl = () => document.querySelector(`[data-thumb="${file._sid}"]`);
      const infoEl = () => document.querySelector(`[data-info="${file._sid}"]`);
      let info = _fileInfo.get(file);
      if (!info) {
        info = (async () => {
          const e = extOf(file.name);
          if (e === '.pdf') {
            const doc = await openPdfJs(file);
            const page = await doc.getPage(1);
            const vp = page.getViewport({ scale: 1 });
            const canvas = await renderPage(page, 48 / vp.height);
            return { text: ` · ${doc.numPages} page${doc.numPages === 1 ? '' : 's'}`, thumb: canvas.toDataURL('image/jpeg', 0.8) };
          }
          if (/^image\//.test(file.type) || ['.jpg', '.jpeg', '.jfif', '.png', '.webp', '.gif', '.bmp', '.avif', '.svg', '.ico', '.heic', '.heif', '.tif', '.tiff'].includes(e)) {
            const c = await decodeImageFile(file, 96);
            if (!file._dims) { const u = URL.createObjectURL(file); try { const im = await loadImageEl(u); file._dims = [im.naturalWidth, im.naturalHeight]; } catch (er) { /* e.g. HEIC: size unknown */ } finally { URL.revokeObjectURL(u); } }
            if (file._dims) return { text: ` · ${file._dims[0]} × ${file._dims[1]} px`, thumb: c.toDataURL('image/jpeg', 0.8) };
            return { text: ` · ${c.width >= c.height ? 'landscape' : 'portrait'} image`, thumb: c.toDataURL('image/jpeg', 0.8) };
          }
          return { text: '' };
        })().catch(err => ({ text: ` · ${err.message && /password/.test(err.message) ? 'password-protected' : 'unreadable'}`, error: true }));
        _fileInfo.set(file, info);
      }
      const r = await info;
      const t = thumbEl(), i = infoEl();
      if (t && r.thumb) t.innerHTML = `<img src="${r.thumb}" class="w-full h-full object-contain" alt="">`;
      if (i) { i.textContent = r.text; if (r.error) i.className = 'text-red-500'; }
    }

    // ---- results ---------------------------------------------------------
    function clearResults() {
      state.results = [];
      const p = $('result-panel');
      if (p) { p.classList.add('hidden'); p.innerHTML = ''; }
    }
    function showResults(res) {
      state.results = res.outputs || [];
      const p = $('result-panel');
      const inSize = state.files.reduce((a, f) => a + f.size, 0);
      p.innerHTML = `
        <div class="rounded-xl border border-emerald-200 bg-emerald-50/70 p-4 space-y-3">
          <div class="flex items-center gap-2 text-emerald-800 text-sm font-semibold"><i data-lucide="circle-check" class="w-4 h-4"></i><span>${esc(res.title || 'Done')}</span></div>
          ${res.details ? `<div class="text-xs text-emerald-900/80 leading-relaxed">${res.details}</div>` : ''}
          <div class="space-y-2">
            ${state.results.map((o, i) => `
              <div class="flex items-center justify-between gap-2 bg-white border border-emerald-100 rounded-lg px-3 py-2">
                <div class="min-w-0"><p class="text-xs font-semibold text-slate-800 truncate" title="${esc(o.name)}">${esc(o.name)}</p>
                <p class="text-[11px] text-slate-500">${fmtBytes(o.blob.size)}${res.showRatio && inSize ? ` · ${o.blob.size <= inSize ? '−' + Math.round((1 - o.blob.size / inSize) * 100) + '%' : '+' + Math.round((o.blob.size / inSize - 1) * 100) + '%'} vs original` : ''}</p></div>
                <button onclick="downloadResult(${i})" class="flex-shrink-0 px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg inline-flex items-center gap-1"><i data-lucide="download" class="w-3.5 h-3.5"></i>Download</button>
              </div>`).join('')}
          </div>
        </div>`;
      p.classList.remove('hidden');
      lucide.createIcons();
    }
    function downloadResult(i) { const o = state.results[i]; if (o) triggerDownload(o.blob, o.name); }

    // ---- run -------------------------------------------------------------
    async function executeActiveTool() {
      const tool = state.currentTool;
      if (!tool || state.busy) return;
      if (state.files.length < (tool.minFiles || 1)) { showToast(`${tool.name} needs at least ${tool.minFiles || 1} file(s).`, 'error'); return; }
      state.busy = true;
      $('process-btn').disabled = true;
      progress.show(`Running ${tool.name}...`);
      try {
        await tick();
        const res = await tool.run();
        if (res && res.outputs && res.outputs.length) {
          showResults(res);
          if (res.outputs.length === 1 && res.autoDownload !== false) triggerDownload(res.outputs[0].blob, res.outputs[0].name);
        }
        if (res && res.message) showToast(res.message, res.messageType || 'success');
      } catch (err) {
        console.error(err);
        showToast(err && err.message ? err.message : 'Error processing document.', 'error');
      } finally {
        state.busy = false;
        $('process-btn').disabled = state.files.length < (tool.minFiles || 1);
        progress.hide();
      }
    }

    window.addEventListener('popstate', () => {
      const id = location.hash.slice(1);
      if (id !== 'latex' && LXS.open) lxClose({ fromHash: true });
      if (id === 'latex') { if (!LXS.open) lxOpen({ noHash: true }); return; }
      if (id === 'design') { if (!DS.open) dsOpen({ noHash: true }); return; }
      if (DS.open) dsClose({ fromHash: true });
      if (id && TOOLS.some(t => t.id === id && !t.open)) selectTool(id, { fromHash: true });
      else navigateToDashboard({ fromHash: true });
    });

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-studio-link]').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); dsOpen(); }));
      document.querySelectorAll('[data-latex-link]').forEach(a => {
        a.addEventListener('click', (e) => { e.preventDefault(); lxOpen(); });
        a.addEventListener('pointerover', () => lxPrewarm(), { passive: true });
      });
      $('tool-search').addEventListener('input', renderDashboard);
      // pointing at a LaTeX tile starts the engine download, so it is ready sooner
      const prewarm = (e) => { const t = e.target.closest && e.target.closest('[data-tool="latex"],[data-tool="latex2pdf"]'); if (t) lxPrewarm(); };
      $('view-dashboard').addEventListener('pointerover', prewarm, { passive: true });
      $('view-dashboard').addEventListener('focusin', prewarm);
      setupDropzone();
      const id = location.hash.slice(1);
      renderDashboard();
      if (id === 'design') dsOpen({ noHash: true });
      else if (id === 'latex') lxOpen({ noHash: true });
      else if (id && TOOLS.some(t => t.id === id && !t.open)) selectTool(id, { fromHash: true });
      lucide.createIcons();
    });


    // =====================================================================
    //  PAGE-LEVEL UI: organize grid, interactive page editor, forms
    // =====================================================================

    // ---------------- Organize grid --------------------------------------
    async function organizeOnFiles(ctx) {
      const stage = $('stage-extra');
      if (!state.files.length) { state.pages = []; stage.innerHTML = ''; return; }
      // Add pages of newly added files (or everything if the model is empty)
      const known = new Set(state.pages.map(p => p.file));
      const toAdd = state.files.filter(f => !known.has(f));
      if (toAdd.length) {
        progress.show('Generating page previews...');
        try {
          let done = 0;
          const total = toAdd.length;
          for (const file of toAdd) {
            const doc = await openPdfJs(file);
            for (let i = 1; i <= doc.numPages; i++) {
              const page = await doc.getPage(i);
              const vp = page.getViewport({ scale: 1 });
              const canvas = await renderPage(page, Math.min(0.35, 220 / Math.max(vp.width, vp.height)));
              state.pages.push({ id: uid(), file, pageIndex: i - 1, rotation: 0, thumb: canvas.toDataURL('image/jpeg', 0.75), w: vp.width, h: vp.height });
              progress.set((done + i / doc.numPages) / total, `${file.name}: page ${i} of ${doc.numPages}`);
              if (i % 4 === 0) await tick();
            }
            done++;
          }
        } finally { progress.hide(); }
      }
      renderOrganizeGridUI();
    }

    function organizeRemoveFile(file) { state.pages = state.pages.filter(p => p.file !== file); }

    function renderOrganizeGridUI() {
      const stage = $('stage-extra');
      const letters = new Map(state.files.map((f, i) => [f, String.fromCharCode(65 + (i % 26))]));
      const multi = state.files.length > 1;
      const btn = 'p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 disabled:opacity-30 flex items-center justify-center';
      stage.innerHTML = `
        <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Pages (${state.pages.length}) — drag to reorder</span>
          <div class="flex flex-wrap gap-1.5">
            <button onclick="organizeAll('rotl')" class="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg inline-flex items-center gap-1"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>All</button>
            <button onclick="organizeAll('rotr')" class="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg inline-flex items-center gap-1"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>All</button>
            <button onclick="organizeAll('reverse')" class="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg inline-flex items-center gap-1"><i data-lucide="arrow-down-up" class="w-3.5 h-3.5"></i>Reverse</button>
            <button onclick="organizeAll('reset')" class="px-2.5 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg inline-flex items-center gap-1"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i>Reset</button>
          </div>
        </div>
        <div id="page-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-h-[620px] overflow-y-auto p-2 bg-slate-50 rounded-xl border border-slate-200">
          ${state.pages.map((p, idx) => `
            <div class="page-card bg-white border border-slate-200 rounded-xl p-2 flex flex-col items-center space-y-2 shadow-sm cursor-grab" draggable="true" data-idx="${idx}">
              <div class="text-[10px] font-semibold text-slate-400 self-start px-1 w-full flex justify-between"><span>Page ${idx + 1}</span><span>${p.blank ? 'blank' : `${multi ? letters.get(p.file) + '·' : 'orig '}${p.pageIndex + 1}`}</span></div>
              <div class="w-full flex items-center justify-center overflow-hidden h-36 bg-slate-100 rounded border border-slate-100">
                ${p.blank ? `<div class="bg-white border border-dashed border-slate-300" style="height:85%;aspect-ratio:${p.w}/${p.h};transform:rotate(${p.rotation}deg)"></div>`
                          : `<img src="${p.thumb}" draggable="false" style="transform: rotate(${p.rotation}deg);" class="max-h-full max-w-full object-contain transition-transform duration-200" />`}
              </div>
              <div class="grid grid-cols-4 gap-1 w-full">
                <button onclick="rotatePage(${idx}, -90)" title="Rotate left" class="${btn}"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                <button onclick="rotatePage(${idx}, 90)" title="Rotate right" class="${btn}"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i></button>
                <button onclick="duplicatePage(${idx})" title="Duplicate" class="${btn}"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                <button onclick="insertBlankAfter(${idx})" title="Insert blank page after" class="${btn}"><i data-lucide="file-plus" class="w-3.5 h-3.5"></i></button>
                <button onclick="movePage(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Move left" class="${btn}"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
                <button onclick="movePage(${idx}, 1)" ${idx === state.pages.length - 1 ? 'disabled' : ''} title="Move right" class="${btn}"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
                <button onclick="deletePage(${idx})" title="Delete page" class="${btn} col-span-2 border-red-200 text-red-600 hover:bg-red-50"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>`).join('')}
        </div>`;
      // HTML5 drag & drop reordering
      let from = null;
      stage.querySelectorAll('.page-card').forEach(card => {
        card.addEventListener('dragstart', (e) => { from = +card.dataset.idx; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-target'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-target'));
        card.addEventListener('drop', (e) => {
          e.preventDefault(); card.classList.remove('drag-target');
          const to = +card.dataset.idx;
          if (from === null || from === to) return;
          const [p] = state.pages.splice(from, 1);
          state.pages.splice(to, 0, p);
          from = null;
          renderOrganizeGridUI();
        });
      });
      $('process-btn').disabled = state.pages.length === 0;
      lucide.createIcons();
    }

    function rotatePage(idx, delta = 90) {
      const p = state.pages[idx];
      p.rotation = (((p.rotation + delta) % 360) + 360) % 360;
      renderOrganizeGridUI();
    }
    function movePage(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= state.pages.length) return;
      [state.pages[idx], state.pages[target]] = [state.pages[target], state.pages[idx]];
      renderOrganizeGridUI();
    }
    function deletePage(idx) { state.pages.splice(idx, 1); renderOrganizeGridUI(); }
    function duplicatePage(idx) { state.pages.splice(idx + 1, 0, { ...state.pages[idx], id: uid() }); renderOrganizeGridUI(); }
    function insertBlankAfter(idx) {
      const ref = state.pages[idx];
      const swap = ref.rotation % 180 !== 0;
      state.pages.splice(idx + 1, 0, { id: uid(), blank: true, rotation: 0, w: swap ? ref.h : ref.w, h: swap ? ref.w : ref.h });
      renderOrganizeGridUI();
    }
    function organizeAll(action) {
      if (action === 'rotl' || action === 'rotr') state.pages.forEach(p => { p.rotation = (p.rotation + (action === 'rotl' ? 270 : 90)) % 360; });
      if (action === 'reverse') state.pages.reverse();
      if (action === 'reset') {
        const files = state.files.slice();
        state.pages = [];
        state.files = files;
        organizeOnFiles({});
        return;
      }
      renderOrganizeGridUI();
    }

    // ---------------- Interactive page editor (sign / redact / crop) -------
    // Items are stored in normalised display coordinates (0..1, origin top-left of
    // the page as the reader sees it), so they survive zoom and map to any page size.
    const editor = {
      file: null, doc: null, src: null, pageIndex: 0, items: [], mode: 'stamp', opts: {},
      dims: [], // per-page display size in points [{W,H}]

      async open(file, opts = {}) {
        this.file = file; this.opts = opts; this.mode = opts.mode || 'stamp';
        this.items = []; this.pageIndex = 0;
        this.dims = [];
        if (extOf(file.name) === '.pdf') {
          const doc = this.doc = await openPdfJs(file);
          this.src = {
            numPages: doc.numPages,
            size: async (i) => { const vp = (await doc.getPage(i + 1)).getViewport({ scale: 1 }); return { W: vp.width, H: vp.height }; },
            render: async (i, scale) => renderPage(await doc.getPage(i + 1), scale)
          };
        } else { // an image: one "page", measured in pixels
          this.doc = null;
          const full = await decodeImageFile(file);
          this.image = full;
          this.src = {
            numPages: 1,
            size: async () => ({ W: full.width, H: full.height }),
            render: async (i, scale) => {
              const c = document.createElement('canvas');
              c.width = Math.max(1, Math.round(full.width * scale)); c.height = Math.max(1, Math.round(full.height * scale));
              const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(full, 0, 0, c.width, c.height);
              return c;
            }
          };
        }
        $('stage-extra').innerHTML = `
          <div class="space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 text-sm">
                <button id="ed-prev" class="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 disabled:opacity-30"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span class="text-slate-600">Page <input id="ed-page" type="number" min="1" value="1" class="w-14 px-2 py-1 border border-slate-200 rounded-lg text-center text-sm"> of <span id="ed-count">${this.src.numPages}</span></span>
                <button id="ed-next" class="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 disabled:opacity-30"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>
              <div id="ed-actions" class="flex flex-wrap gap-1.5">${opts.actions || ''}</div>
            </div>
            <p id="ed-help" class="text-xs text-slate-500">${opts.help || ''}</p>
            <div id="ed-scroll" class="bg-slate-100 rounded-xl p-3 flex justify-center overflow-auto">
              <div class="ed-wrap" id="ed-wrap"><canvas id="ed-canvas"></canvas><div id="ed-layer" style="position:absolute;inset:0;"></div></div>
            </div>
          </div>`;
        $('ed-prev').onclick = () => this.go(this.pageIndex - 1);
        $('ed-next').onclick = () => this.go(this.pageIndex + 1);
        $('ed-page').onchange = () => this.go((parseInt($('ed-page').value, 10) || 1) - 1);
        this.bindPointer();
        lucide.createIcons();
        await this.go(0);
      },

      close() { this.file = null; this.doc = null; this.src = null; this.image = null; this.items = []; },

      async go(i) {
        if (!this.src) return;
        i = clamp(i, 0, this.src.numPages - 1);
        this.pageIndex = i;
        $('ed-page').value = i + 1;
        $('ed-prev').disabled = i === 0;
        $('ed-next').disabled = i === this.src.numPages - 1;
        const d = this.dims[i] = await this.src.size(i);
        const vp1 = { width: d.W, height: d.H };
        const avail = Math.max(260, ($('ed-scroll').clientWidth || 700) - 24);
        const maxH = Math.max(440, window.innerHeight - 170); // whole page visible without scrolling
        const cssW = Math.max(Math.min(260, avail), Math.min(avail, 900, maxH * vp1.width / vp1.height));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const scale = (cssW / vp1.width) * dpr;
        const src = await this.src.render(i, scale);
        const canvas = $('ed-canvas');
        canvas.width = src.width; canvas.height = src.height;
        canvas.getContext('2d').drawImage(src, 0, 0);
        canvas.style.width = cssW + 'px';
        if (this.opts.onPage) this.opts.onPage(i);
        this.renderItems();
      },

      pageDims(i) { return this.dims[i]; },
      async ensureDims() {
        for (let i = 0; i < this.src.numPages; i++) if (!this.dims[i]) this.dims[i] = await this.src.size(i);
      },

      renderItems() {
        const layer = $('ed-layer');
        if (!layer) return;
        layer.innerHTML = this.items.filter(it => it.page === this.pageIndex).map(it => `
          <div class="ed-item ${it.type}" data-id="${it.id}" style="left:${it.nx * 100}%;top:${it.ny * 100}%;width:${it.nw * 100}%;height:${it.nh * 100}%;">
            ${it.type === 'stamp' ? `<img src="${it.src}" alt="">` : ''}
            ${it.type !== 'crop' ? `<div class="ed-del" data-act="del">×</div>` : ''}
            ${it.type === 'crop' ? `<div class="ed-handle" data-act="tl" style="left:-7px;top:-7px;right:auto;bottom:auto;cursor:nwse-resize"></div>` : ''}
            <div class="ed-handle" data-act="br"></div>
          </div>`).join('');
        if (this.opts.onChange) this.opts.onChange();
      },

      // Keeps a crop box at opts.aspect (display width / height), anchored at the opposite corner.
      lockAspect(it, anchor) {
        const d = this.dims[this.pageIndex]; if (!d) return;
        const r = this.opts.aspect * d.H / d.W; // normalised width / height
        const right = it.nx + it.nw, bottom = it.ny + it.nh;
        let nw = it.nw, nh = nw / r;
        const maxH = anchor === 'br' ? 1 - it.ny : bottom, maxW = anchor === 'br' ? 1 - it.nx : right;
        if (nh > maxH) { nh = maxH; nw = nh * r; }
        if (nw > maxW) { nw = maxW; nh = nw / r; }
        if (anchor === 'br') { it.nw = nw; it.nh = nh; } else { it.nx = right - nw; it.ny = bottom - nh; it.nw = nw; it.nh = nh; }
      },
      setAspect(aspect) {
        this.opts.aspect = aspect || null;
        const it = this.items.find(x => x.type === 'crop');
        if (it && aspect) {
          const d = this.dims[this.pageIndex], r = aspect * d.H / d.W;
          let nw = 0.9, nh = nw / r; if (nh > 0.9) { nh = 0.9; nw = nh * r; }
          Object.assign(it, { nx: (1 - nw) / 2, ny: (1 - nh) / 2, nw, nh });
        }
        this.renderItems();
      },

      addItem(it) { it.id = it.id || uid(); this.items.push(it); this.renderItems(); return it; },
      clearPage() { this.items = this.items.filter(it => it.page !== this.pageIndex || it.type === 'crop'); this.renderItems(); },
      clearAll(type) { this.items = this.items.filter(it => type && it.type !== type); this.renderItems(); },

      bindPointer() {
        const layer = $('ed-layer');
        let drag = null;
        const pt = (e) => { const r = layer.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp((e.clientY - r.top) / r.height, 0, 1), r }; };
        layer.addEventListener('pointerdown', (e) => {
          const p = pt(e);
          const itemEl = e.target.closest('.ed-item');
          const act = e.target.dataset && e.target.dataset.act;
          if (itemEl) {
            const it = this.items.find(x => x.id === itemEl.dataset.id);
            if (!it) return;
            if (act === 'del') { this.items = this.items.filter(x => x !== it); this.renderItems(); e.preventDefault(); return; }
            drag = { it, mode: act === 'br' ? 'br' : act === 'tl' ? 'tl' : 'move', start: p, orig: { ...it } };
          } else if (this.mode === 'stamp') {
            const st = this.opts.makeStamp && this.opts.makeStamp();
            if (!st) { showToast('Create your signature or stamp in the panel on the right first.', 'warn'); return; }
            const dims = this.dims[this.pageIndex];
            const nw = clamp(st.widthPt / dims.W, 0.03, 0.9);
            const nh = nw * dims.W / st.aspect / dims.H;
            this.addItem({ type: 'stamp', page: this.pageIndex, src: st.src, aspect: st.aspect, nx: clamp(p.x - nw / 2, 0, 1 - nw), ny: clamp(p.y - nh / 2, 0, 1 - nh), nw, nh });
            return;
          } else if (this.mode === 'redact') {
            const it = this.addItem({ type: 'redact', page: this.pageIndex, nx: p.x, ny: p.y, nw: 0.001, nh: 0.001 });
            drag = { it, mode: 'draw', start: p, orig: { ...it } };
          } else return;
          layer.setPointerCapture(e.pointerId);
          e.preventDefault();
        });
        layer.addEventListener('pointermove', (e) => {
          if (!drag) return;
          const p = pt(e), { it, orig, start } = drag;
          const dx = p.x - start.x, dy = p.y - start.y;
          if (drag.mode === 'move') {
            it.nx = clamp(orig.nx + dx, 0, 1 - it.nw); it.ny = clamp(orig.ny + dy, 0, 1 - it.nh);
          } else if (drag.mode === 'draw') {
            it.nx = Math.min(start.x, p.x); it.ny = Math.min(start.y, p.y);
            it.nw = Math.abs(p.x - start.x); it.nh = Math.abs(p.y - start.y);
          } else if (drag.mode === 'br') {
            if (it.type === 'stamp') {
              const dims = this.dims[this.pageIndex];
              it.nw = clamp(orig.nw + dx, 0.02, 1 - it.nx);
              it.nh = it.nw * dims.W / it.aspect / dims.H;
              if (it.ny + it.nh > 1) { it.nh = 1 - it.ny; it.nw = it.nh * dims.H * it.aspect / dims.W; }
            } else {
              it.nw = clamp(orig.nw + dx, 0.01, 1 - it.nx); it.nh = clamp(orig.nh + dy, 0.01, 1 - it.ny);
            }
          } else if (drag.mode === 'tl') {
            const right = orig.nx + orig.nw, bottom = orig.ny + orig.nh;
            it.nx = clamp(orig.nx + dx, 0, right - 0.02); it.ny = clamp(orig.ny + dy, 0, bottom - 0.02);
            it.nw = right - it.nx; it.nh = bottom - it.ny;
          }
          if (it.type === 'crop' && this.opts.aspect && (drag.mode === 'br' || drag.mode === 'tl')) this.lockAspect(it, drag.mode);
          const el = layer.querySelector(`[data-id="${it.id}"]`);
          if (el) Object.assign(el.style, { left: it.nx * 100 + '%', top: it.ny * 100 + '%', width: it.nw * 100 + '%', height: it.nh * 100 + '%' });
        });
        const end = () => {
          if (!drag) return;
          if (drag.mode === 'draw' && (drag.it.nw < 0.005 || drag.it.nh < 0.005)) this.items = this.items.filter(x => x !== drag.it);
          drag = null;
          this.renderItems();
        };
        layer.addEventListener('pointerup', end);
        layer.addEventListener('pointercancel', end);
      }
    };

    // Normalised item -> display rectangle in points (origin bottom-left)
    function itemToDisplayRect(it, W, H) {
      return { u: it.nx * W, v: (1 - it.ny - it.nh) * H, w: it.nw * W, h: it.nh * H };

    // =====================================================================
    //  PDF TOOLS
    // =====================================================================
    const PDFN = (n) => PDFLib.PDFName.of(n);

    // Adds a flat bookmark outline (one entry per item) to a pdf-lib document.
    function addOutline(doc, entries) {
      if (!entries.length) return;
      const ctx = doc.context;
      const pages = doc.getPages();
      const rootRef = ctx.nextRef();
      const refs = entries.map(() => ctx.nextRef());
      entries.forEach((e, i) => {
        const dict = ctx.obj({ Title: PDFLib.PDFHexString.fromText(e.title), Parent: rootRef, Dest: [pages[e.pageIndex].ref, 'XYZ', null, null, null] });
        if (i > 0) dict.set(PDFN('Prev'), refs[i - 1]);
        if (i < refs.length - 1) dict.set(PDFN('Next'), refs[i + 1]);
        ctx.assign(refs[i], dict);
      });
      ctx.assign(rootRef, ctx.obj({ Type: 'Outlines', First: refs[0], Last: refs[refs.length - 1], Count: refs.length }));
      doc.catalog.set(PDFN('Outlines'), rootRef);
      doc.catalog.set(PDFN('PageMode'), PDFN('UseOutlines'));
    }

    // Draw an embedded page (honouring its /Rotate) fitted & centred inside rect {x,y,w,h}.
    function drawPageFitted(target, emb, R, rect, { allowUpscale = true } = {}) {
      const sw0 = emb.width, sh0 = emb.height;
      const dispW = R % 180 ? sh0 : sw0, dispH = R % 180 ? sw0 : sh0;
      let s = Math.min(rect.w / dispW, rect.h / dispH);
      if (!allowUpscale) s = Math.min(s, 1);
      const sw = sw0 * s, sh = sh0 * s, w = dispW * s, h = dispH * s;
      const x = rect.x + (rect.w - w) / 2, y = rect.y + (rect.h - h) / 2;
      const t = -R * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t);
      const pts = [[0, 0], [sw, 0], [0, sh], [sw, sh]].map(([px, py]) => [px * c - py * sn, px * sn + py * c]);
      const minX = Math.min(...pts.map(p => p[0])), minY = Math.min(...pts.map(p => p[1]));
      target.drawPage(emb, { x: x - minX, y: y - minY, width: sw, height: sh, rotate: PDFLib.degrees(-R) });
      return { x, y, w, h };
    }
    async function embedWithCrop(target, page) {
      const b = page.getCropBox();
      return target.embedPage(page, { left: b.x, bottom: b.y, right: b.x + b.width, top: b.y + b.height });
    }

    // ----------------------------------------------------------- Interleave
    const toolInterleave = {

    // ----------------------------------------------------------------- N-up
    const toolNup = {

      options: () => ui.select('opt-nup-n', 'Pages per sheet', [['2', '2'], ['4', '4'], ['6', '6'], ['9', '9'], ['16', '16']], '4') +
        ui.row(ui.select('opt-nup-size', 'Sheet size', PAPER_OPTIONS, 'a4'), ui.select('opt-nup-orient', 'Orientation', [['auto', 'Auto'], ['portrait', 'Portrait'], ['landscape', 'Landscape']], 'auto')) +

        const first = pageGeom(src.getPage(0));

        let best = null;

    // ---------------------------------------------------------------- Forms

    // --------------------------------------------------------------- Redact
    const REDACT_PATTERNS = {
      email: /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,
      phone: /(?:\+?\d{1,3}[\s.-]?)?(?:\(\d{1,4}\)[\s.-]?)?\d{2,4}(?:[\s.-]?\d{2,4}){2,4}/g,
      iban: /\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}(?:\s?[A-Z0-9]{1,4})?\b/g
    };
    async function findTextBoxes(doc, terms, presets, caseSensitive) {
      const found = [];
      const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regexes = terms.map(t => new RegExp(escRe(t), caseSensitive ? 'g' : 'gi')).concat(presets.map(k => REDACT_PATTERNS[k]));
      const mctx = document.createElement('canvas').getContext('2d');
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const vp = page.getViewport({ scale: 1 });
        const tc = await page.getTextContent();
        for (const it of tc.items) {
          if (!it.str || !it.str.trim()) continue;
          // measure sub-strings with the PDF font's family so boxes line up with narrow/wide glyphs
          mctx.font = `100px ${(tc.styles[it.fontName] || {}).fontFamily || 'sans-serif'}`;
          const fullW = mctx.measureText(it.str).width || 1;
          const frac = (i) => mctx.measureText(it.str.slice(0, i)).width / fullW;
          for (const re of regexes) {
            re.lastIndex = 0;
            let m;
            while ((m = re.exec(it.str))) {
              if (!m[0].length) { re.lastIndex++; continue; }
              if (re === REDACT_PATTERNS.phone && m[0].replace(/\D/g, '').length < 7) continue;
              const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
              const fh = Math.hypot(tx[2], tx[3]) || 10;
              const len = Math.hypot(tx[0], tx[1]) || 1;
              const dir = [tx[0] / len, tx[1] / len], up = [-dir[1], dir[0]]; // up on screen = (-dy?, …)
              const total = it.width * vp.scale, padA = fh * 0.18;
              const a = Math.max(0, total * frac(m.index) - padA), b = Math.min(total + padA, total * frac(m.index + m[0].length) + padA);
              const pts = [];
              for (const along of [a, b]) for (const h of [-0.28 * fh, 1.0 * fh]) pts.push([tx[4] + dir[0] * along - up[0] * h, tx[5] + dir[1] * along - up[1] * h]);
              const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
              const pad = 1.5;
              found.push({ page: p - 1, nx: (Math.min(...xs) - pad) / vp.width, ny: (Math.min(...ys) - pad) / vp.height, nw: (Math.max(...xs) - Math.min(...xs) + 2 * pad) / vp.width, nh: (Math.max(...ys) - Math.min(...ys) + 2 * pad) / vp.height });
            }
          }
        }
      }
      return found;
    }
    const toolRedact = {

         <div class="flex gap-2"><button type="button" id="rd-find" class="flex-1 py-2 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-xl inline-flex items-center justify-center gap-1.5"><i data-lucide="search" class="w-3.5 h-3.5"></i>Find &amp; mark</button>

    // ------------------------------------------------------ Protect / Unlock
    const toolProtect = {

    // Walks a pdfmake content tree: makes images fit the page, fills missing table widths, pads ragged rows.
    function fitPdfmakeContent(node, maxW, maxH) {
      if (Array.isArray(node)) { node.forEach(n => fitPdfmakeContent(n, maxW, maxH)); return; }
      if (!node || typeof node !== 'object') return;
      if (node.image) {
        if (typeof node.width === 'number' && node.width > maxW) { if (typeof node.height === 'number') node.height *= maxW / node.width; node.width = maxW; }
        if (typeof node.height === 'number' && node.height > maxH) { if (typeof node.width === 'number') node.width *= maxH / node.height; node.height = maxH; }
        if (node.width == null && node.height == null) node.fit = [maxW, maxH];
      }
      if (node.table && Array.isArray(node.table.body)) {
        const body = node.table.body;
        const cols = Math.max(1, ...body.map(r => Array.isArray(r) ? r.length : 0));
        body.forEach((r, i) => { if (!Array.isArray(r)) body[i] = r = []; while (r.length < cols) r.push({ text: '' }); if (r.length > cols) r.length = cols; });
        if (!Array.isArray(node.table.widths) || node.table.widths.length !== cols) node.table.widths = Array(cols).fill('*');
        if (!node.layout) node.layout = 'odfGrid';
        const cellMax = maxW / cols;
        body.forEach(r => r.forEach(c => fitPdfmakeContent(c, Math.max(cellMax, 40), maxH)));

    function sheetMatrix(ws) {

      for (let r = range.s.r; r <= range.e.r; r++) {
        const row = [];
        for (let c = range.s.c; c <= range.e.c; c++) {

      if (lastR < 0) return null;

      if (opts.sheets === 'first') names = names.slice(0, 1);
      const sheets = names.map(n => ({ name: n, m: sheetMatrix(wb.Sheets[n]) })).filter(s => s.m);
      if (!sheets.length) throw new Error(`"${file.name}" has no data to convert.`);

      if (opts.engine === 'snapshot') {
        const html = sheets.map((s, i) => `${i ? '<div class="pdf-pagebreak-before"></div>' : ''}${sheets.length > 1 ? `<h3>${esc(s.name)}</h3>` : ''}${XLSX.utils.sheet_to_html(wb.Sheets[s.name], { header: '', footer: '' }).replace(/^[\s\S]*?<table/i, '<table').replace(/<\/table>[\s\S]*$/i, '</table>')}`).join('');
        return htmlToSnapshotPdf(html, { pageSize: opts.pageSize, orientation: 'landscape', margins: [28, 28, 28, 28] });
      }

      await ensureLib('pdfmake', 'pdfmakeFonts');
      const margins = [28, 30, 28, 34];
      const content = [];
      let firstOrientation = 'portrait';
      sheets.forEach((s, si) => {
        const { rows, merges, cols } = s.m;
        const maxChars = Array(cols).fill(3);
        rows.forEach(r => r.forEach((c, ci) => { const longest = Math.max(...String(c.text).split('\n').map(x => x.length)); maxChars[ci] = Math.max(maxChars[ci], Math.min(longest, 45)); }));
        merges.forEach(m => { if (m.cs > 1) maxChars[m.c] = Math.min(maxChars[m.c], 12); });
        const sumChars = maxChars.reduce((a, b) => a + b, 0);
        // pdfmake adds 4pt padding left/right + 0.5pt rule per column on top of the column widths
        const contentAvail = (W) => W - margins[0] - margins[2] - cols * 8.5 - 1;
        const fit = (W) => Math.min(10, contentAvail(W) / (0.56 * sumChars));
        const [pw, ph] = paperSize(opts.pageSize || 'a4', 'portrait');
        let orientation = opts.orientation && opts.orientation !== 'auto' ? opts.orientation : (fit(pw) >= 8 || fit(ph) <= fit(pw) ? 'portrait' : 'landscape');
        const W = orientation === 'landscape' ? ph : pw;
        const fontSize = clamp(Math.floor(fit(W) * 2) / 2, 4.5, 10);
        const avail = contentAvail(W);
        const widths = maxChars.map(n => Math.max(10, n * 0.56 * fontSize));
        const scale = Math.min(1, avail / widths.reduce((a, b) => a + b, 0));
        const body = rows.map((r, ri) => r.map((c) => ({ text: c.text, alignment: c.num ? 'right' : 'left', bold: !!(opts.header && ri === 0), fillColor: opts.header && ri === 0 ? '#eef2ff' : undefined })));
        merges.forEach(m => {
          const cell = body[m.r][m.c];
          if (m.cs > 1) cell.colSpan = Math.min(m.cs, cols - m.c);
          if (m.rs > 1) cell.rowSpan = Math.min(m.rs, rows.length - m.r);
          for (let r = m.r; r < m.r + (cell.rowSpan || 1); r++) for (let c = m.c; c < m.c + (cell.colSpan || 1); c++) if (r !== m.r || c !== m.c) body[r][c] = {};
        });
        const block = { stack: [], pageOrientation: orientation };
        if (si > 0) block.pageBreak = 'before';
        if (si === 0) firstOrientation = orientation;
        if (sheets.length > 1 || opts.titles) block.stack.push({ text: s.name, bold: true, fontSize: 12, margin: [0, 0, 0, 6] });
        block.stack.push({
          table: { headerRows: opts.header && rows.length > 1 && !merges.some(m => m.r === 0 && m.rs > 1) ? 1 : 0, widths: widths.map(w => w * scale), body, dontBreakRows: true },
          layout: opts.gridlines === false ? 'noBorders' : 'odfGrid', fontSize
        });
        content.push(block);
      });
      const [w, h] = paperSize(opts.pageSize || 'a4', firstOrientation);
      return pdfmakeBuffer({
        pageSize: { width: Math.min(w, h), height: Math.max(w, h) }, pageOrientation: firstOrientation, pageMargins: margins, content,
        defaultStyle: { fontSize: 9, lineHeight: 1.1 }, info: { title: baseName(file.name), producer: 'PDF Studio' },
        footer: (cur, total) => ({ text: `${baseName(file.name)} — ${cur} / ${total}`, alignment: 'center', fontSize: 7, color: '#64748b', margin: [0, 12, 0, 0] })
      });
    }

    // =====================================================================
    //  OPENDOCUMENT / LIBREOFFICE (ODT, ODS, ODP, ODG + flat XML variants)
    // =====================================================================
    const ODF_URI = {
      office: 'urn:oasis:names:tc:opendocument:xmlns:office:1.0', style: 'urn:oasis:names:tc:opendocument:xmlns:style:1.0',
      text: 'urn:oasis:names:tc:opendocument:xmlns:text:1.0', table: 'urn:oasis:names:tc:opendocument:xmlns:table:1.0',
      draw: 'urn:oasis:names:tc:opendocument:xmlns:drawing:1.0', fo: 'urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0',
      xlink: 'http://www.w3.org/1999/xlink', svg: 'urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0',
      presentation: 'urn:oasis:names:tc:opendocument:xmlns:presentation:1.0', number: 'urn:oasis:names:tc:opendocument:xmlns:datastyle:1.0',
      loext: 'urn:org:documentfoundation:names:experimental:office:xmlns:loext:1.0', drawooo: 'http://openoffice.org/2010/draw',
      chart: 'urn:oasis:names:tc:opendocument:xmlns:chart:1.0', meta: 'urn:oasis:names:tc:opendocument:xmlns:meta:1.0', dc: 'http://purl.org/dc/elements/1.1/'
    };
    const ODF_PREFIX = Object.fromEntries(Object.entries(ODF_URI).map(([p, u]) => [u, p]));
    const qn = (el) => (ODF_PREFIX[el.namespaceURI] || '?') + ':' + el.localName;
    function oattr(el, name) {
      if (!el) return null;
      const i = name.indexOf(':');
      const v = el.getAttributeNS(ODF_URI[name.slice(0, i)], name.slice(i + 1));
      return v === '' && !el.hasAttributeNS(ODF_URI[name.slice(0, i)], name.slice(i + 1)) ? null : v;
    }
    const kids = (el) => el ? Array.from(el.children) : [];
    const childQ = (el, q) => kids(el).filter(c => qn(c) === q);
    const firstQ = (el, q) => kids(el).find(c => qn(c) === q) || null;
    const descQ = (root, q) => { const [p, l] = q.split(':'); return root ? Array.from(root.getElementsByTagNameNS(ODF_URI[p], l)) : []; };
    const round2 = (n) => Math.round(n * 100) / 100;

    function toPt(v, rel) {
      if (v == null || v === '') return null;
      const m = /^(-?[\d.]+(?:e-?\d+)?)\s*(pt|cm|mm|in|pc|px|%)?$/i.exec(String(v).trim());
      if (!m) return null;
      const n = parseFloat(m[1]);
      switch ((m[2] || 'pt').toLowerCase()) {
        case 'cm': return n * 28.3465; case 'mm': return n * 2.83465; case 'in': return n * 72;
        case 'pc': return n * 12; case 'px': return n * 0.75; case '%': return rel != null ? rel * n / 100 : null;
        default: return n;
      }
    }

    async function readOdf(file) {
      const bytes = await fileBytes(file);
      const parse = (txt, name) => {
        const d = new DOMParser().parseFromString(txt, 'application/xml');
        if (d.getElementsByTagName('parsererror').length) throw new Error(`"${file.name}" is damaged (${name} is not valid XML).`);
        return d;
      };
      if (bytes[0] === 0x50 && bytes[1] === 0x4B) {
        let zip;
        try { zip = await JSZip.loadAsync(bytes); } catch (e) { throw new Error(`"${file.name}" is not a valid OpenDocument file.`); }
        const cf = zip.file('content.xml');
        if (!cf) {
          if (zip.file('EncryptionInfo') || zip.file('META-INF/manifest.xml') && /encryption-data/.test(await zip.file('META-INF/manifest.xml').async('string'))) throw new Error(`"${file.name}" is password-protected in LibreOffice. Save it without a password first.`);
          throw new Error(`"${file.name}" is not an OpenDocument file (content.xml missing).`);
        }
        const manifest = zip.file('META-INF/manifest.xml');
        if (manifest && /manifest:encryption-data/.test(await manifest.async('string'))) throw new Error(`"${file.name}" is password-protected in LibreOffice. Save a copy without a password first.`);
        const content = parse(await cf.async('string'), 'content.xml');
        const sf = zip.file('styles.xml');
        const styles = sf ? parse(await sf.async('string'), 'styles.xml') : null;
        let title = '';
        const mf = zip.file('meta.xml');
        if (mf) { const t = descQ(parse(await mf.async('string'), 'meta.xml'), 'dc:title')[0]; if (t) title = t.textContent.trim(); }
        return { zip, content, styles, flat: false, title, name: file.name };
      }
      const doc = parse(new TextDecoder().decode(bytes), file.name);
      if (!doc.documentElement || doc.documentElement.namespaceURI !== ODF_URI.office) throw new Error(`"${file.name}" is not an OpenDocument file.`);
      const t = descQ(doc, 'dc:title')[0];
      return { zip: null, content: doc, styles: doc, flat: true, title: t ? t.textContent.trim() : '', name: file.name };
    }

    // Embedded pictures: zip entry (Pictures/...) or inline <office:binary-data> (flat XML)
    async function odfImageBlob(odf, imageEl, cache) {
      const href = oattr(imageEl, 'xlink:href');
      const key = href || imageEl;
      if (cache && cache.has(key)) return cache.get(key);
      let blob = null;
      try {
        if (href && odf.zip && !/^[a-z]+:/i.test(href)) {
          const f = odf.zip.file(href.replace(/^\.\//, ''));
          if (f) {
            const data = await f.async('uint8array');
            const mime = oattr(imageEl, 'draw:mime-type') || (/\.svg$/i.test(href) ? 'image/svg+xml' : '');
            blob = new Blob([data], mime ? { type: mime } : {});
          }
        } else if (href && /^data:/i.test(href)) {
          blob = await (await fetch(href)).blob();
        } else {
          const bin = firstQ(imageEl, 'office:binary-data');
          if (bin) { const raw = atob(bin.textContent.replace(/\s+/g, '')); const u = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i); blob = new Blob([u]); }
        }
      } catch (e) { blob = null; }
      if (cache) cache.set(key, blob);
      return blob;
    }
    // PNG/JPEG data URL for a picture, or null if the browser can't decode it (EMF/WMF/SVM...)
    async function blobToPdfDataUrl(blob, maxSide = 2400) {
      if (!blob) return null;
      const head = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
      const kind = sniffImage(head);
      if ((kind === 'png' || kind === 'jpg') && blob.size < 12e6) {
        return await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).replace(/^data:[^;]*;/, `data:image/${kind === 'png' ? 'png' : 'jpeg'};`)); r.onerror = () => res(null); r.readAsDataURL(blob); });
      }
      try { const c = await imageToCanvas(blob, maxSide); return c.toDataURL(canvasHasAlpha(c) ? 'image/png' : 'image/jpeg', 0.92); }
      catch (e) { return null; }
    }

    // ------------------------------------------------------------- Styles
    class OdfStyles {
      constructor(odf) {
        this.odf = odf;
        this.common = new Map(); this.autoContent = new Map(); this.autoStyles = new Map();
        this.defaults = new Map(); this.masters = new Map(); this.layouts = new Map();
        this.lists = { common: new Map(), autoContent: new Map(), autoStyles: new Map() };
        this.fonts = new Map(); this.gradients = new Map(); this.fillImages = new Map(); this.cache = new Map();
        const sRoot = odf.styles && odf.styles.documentElement, cRoot = odf.content.documentElement;
        for (const root of [sRoot, cRoot]) for (const ff of childQ(firstQ(root, 'office:font-face-decls'), 'style:font-face')) this.fonts.set(oattr(ff, 'style:name'), (oattr(ff, 'svg:font-family') || '').replace(/['"]/g, ''));
        this.collect(firstQ(sRoot, 'office:styles'), this.common, this.lists.common);
        this.collect(firstQ(sRoot, 'office:automatic-styles'), this.autoStyles, this.lists.autoStyles);
        if (odf.flat) { this.autoContent = this.autoStyles; this.lists.autoContent = this.lists.autoStyles; }
        else this.collect(firstQ(cRoot, 'office:automatic-styles'), this.autoContent, this.lists.autoContent);
        const ms = firstQ(sRoot, 'office:master-styles');
        for (const mp of childQ(ms, 'style:master-page')) this.masters.set(oattr(mp, 'style:name'), mp);
        this.firstMaster = childQ(ms, 'style:master-page')[0] || null;
      }
      collect(root, map, listMap) {
        for (const el of kids(root)) {
          const q = qn(el);
          if (q === 'style:style') map.set(`${oattr(el, 'style:family')}|${oattr(el, 'style:name')}`, this.parseStyle(el));
          else if (q === 'style:default-style') this.defaults.set(oattr(el, 'style:family'), this.parseStyle(el));
          else if (q === 'text:list-style') listMap.set(oattr(el, 'style:name'), el);
          else if (q === 'style:page-layout') this.layouts.set(oattr(el, 'style:name'), el);
          else if (q === 'draw:gradient') this.gradients.set(oattr(el, 'draw:name'), el);
          else if (q === 'draw:fill-image') this.fillImages.set(oattr(el, 'draw:name'), el);
        }
      }
      parseStyle(el) {
        const props = {};
        for (const c of kids(el)) {
          const q = qn(c);
          if (!q.endsWith('-properties')) continue;
          const bucket = q.slice(q.indexOf(':') + 1, -'-properties'.length);
          const o = props[bucket] || (props[bucket] = {});
          for (const a of Array.from(c.attributes)) o[(ODF_PREFIX[a.namespaceURI] || '?') + ':' + a.localName] = a.value;
          const ls = firstQ(c, 'text:list-style');
          if (ls) props._listStyleEl = ls;
        }
        return { name: oattr(el, 'style:name'), family: oattr(el, 'style:family'), parent: oattr(el, 'style:parent-style-name'), listStyleName: oattr(el, 'style:list-style-name'), masterPageName: oattr(el, 'style:master-page-name'), props };
      }
      get(name, family, scope = 'content') {
        if (!name) return null;
        const key = `${family}|${name}`;
        return (scope === 'styles' ? this.autoStyles : this.autoContent).get(key) || this.common.get(key) || null;
      }
      // default-style -> parent chain -> style. Relative (%) font sizes become absolute.
      resolve(name, family, scope = 'content', withDefault = true) {
        const ck = `${scope}|${family}|${name}|${withDefault}`;
        if (this.cache.has(ck)) return this.cache.get(ck);

    async function readAnySheet(file) {
      await ensureLib('xlsx');
      const e = extOf(file.name);
      if (e === '.json') {
        let data;
        try { data = JSON.parse(await file.text()); } catch (err) { throw new Error(`"${file.name}" is not valid JSON.`); }
        const wb = XLSX.utils.book_new();
        // nested objects become dotted columns (address.city); arrays of plain values are joined
        const flat = (obj, pre = '', out = {}) => {
          for (const [k, v] of Object.entries(obj)) {
            const key = pre ? `${pre}.${k}` : k;
            if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, key, out);
            else if (Array.isArray(v)) out[key] = v.every(x => x === null || typeof x !== 'object') ? v.join(', ') : JSON.stringify(v);
            else out[key] = v;
          }
          return out;
        };
        const add = (rows, name) => {
          if (!Array.isArray(rows)) rows = [rows];
          const ws = rows.length && Array.isArray(rows[0]) ? XLSX.utils.aoa_to_sheet(rows) : XLSX.utils.json_to_sheet(rows.map(r => (r && typeof r === 'object') ? flat(r) : { value: r }));
          XLSX.utils.book_append_sheet(wb, ws, String(name).replace(/[\\/?*:\[\]]/g, '_').slice(0, 31) || 'Sheet1');
        };
        if (!Array.isArray(data) && data && typeof data === 'object' && Object.values(data).every(Array.isArray)) Object.entries(data).forEach(([k, v]) => add(v, k));
        else add(data, 'Sheet1');
        return wb;
      }
      if (e === '.csv' || e === '.tsv') return XLSX.read(await file.text(), { type: 'string', raw: false, FS: e === '.tsv' ? '\t' : undefined });
      return XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });

    async function writeSheetOutputs(wb, file, fmt, opts = {}) {
      const base = baseName(file.name);
      if (['xlsx', 'xls', 'ods'].includes(fmt)) {
        const out = XLSX.write(wb, { bookType: fmt === 'xls' ? 'biff8' : fmt, type: 'array', compression: true });
        return [{ blob: new Blob([out], { type: 'application/octet-stream' }), name: base + SHEET_OUT[fmt][1] }];
      }
      let names = wb.SheetNames;
      if (opts.sheets === 'first') names = names.slice(0, 1);
      if (fmt === 'json' && names.length > 1) { // one JSON file: { "Sheet name": [rows...], ... }
        const all = Object.fromEntries(names.map(n => [n, XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '', raw: true })]));
        return [{ blob: new Blob([JSON.stringify(all, null, 2)], { type: 'application/json;charset=utf-8' }), name: base + '.json' }];
      }
      return names.map(n => {
        const ws = wb.Sheets[n];

      $('ds-home-btn').onclick = () => dsClose();

    }

    // ------------------------------------------------------------ open / close
    async function dsOpen(opts = {}) {

    function dsClose({ fromHash = false } = {}) {
      if (DS.editing) dsStopEditing();

    function dsLoadDoc(doc) {

    }

    // ------------------------------------------------------------ zoom
    function dsFitZoom() {

    function dsSetZoom(z) { DS.fitZoom = false; DS.zoom = clamp(z, 0.08, 5); dsRenderPages(); }

    // ------------------------------------------------------------ rendering
    function dsRenderAll() { dsRenderPages(); dsRenderLeft(); dsRenderProps(); dsUpdateTop(); }
    function dsUpdateTop() {

      $('ds-zoom-label').textContent = Math.round(DS.zoom * 100) + '%';
      if ($('ds-name').value !== DS.doc.name && document.activeElement !== $('ds-name')) $('ds-name').value = DS.doc.name;
      dsUpdateUndoButtons();
    }
    function dsRenderPages() {
      const host = $('ds-pages');

      const z = DS.zoom;
      host.innerHTML = DS.doc.pages.map((p, i) => `
        <div class="ds-pageblock" data-page="${i}">
          <div class="ds-pagebar" style="width:${p.w * z}px">
            <span class="font-semibold">Page ${i + 1}</span><span class="text-slate-400">${DS.doc.pages.length > 1 ? `of ${DS.doc.pages.length}` : ''}</span>
            <span class="flex-1"></span>
            <button data-pact="up" ${i === 0 ? 'disabled' : ''} title="Move page up"><i data-lucide="chevron-up"></i></button>
            <button data-pact="down" ${i === DS.doc.pages.length - 1 ? 'disabled' : ''} title="Move page down"><i data-lucide="chevron-down"></i></button>
            <button data-pact="dup" title="Duplicate page"><i data-lucide="copy"></i></button>
            <button data-pact="add" title="Add a blank page after"><i data-lucide="file-plus"></i></button>
            <button data-pact="del" ${DS.doc.pages.length === 1 ? 'disabled' : ''} title="Delete page"><i data-lucide="trash"></i></button>
          </div>
          <div class="ds-pagewrap ${i === DS.page ? 'active' : ''}" data-page="${i}" style="width:${p.w * z}px;height:${p.h * z}px">
            <div class="ds-page" style="width:${p.w}px;height:${p.h}px;transform:scale(${z})"></div>
            <div class="ds-overlay"></div>
          </div>
        </div>`).join('') + `<button id="ds-addpage" class="ds-addpage"><i data-lucide="plus"></i>Add page</button>`;
      DS.doc.pages.forEach((_, i) => dsRenderPage(i));
      host.querySelectorAll('[data-pact]').forEach(b => b.onclick = (e) => { e.stopPropagation(); dsPageAction(+b.closest('.ds-pageblock').dataset.page, b.dataset.pact); });
      $('ds-addpage').onclick = () => dsPageAction(DS.doc.pages.length - 1, 'add');

      dsRenderOverlay();
      dsUpdateTop();
    }
    function dsPageEl(i) { return document.querySelector(`.ds-pagewrap[data-page="${i}"] .ds-page`); }
    function dsRenderPage(i) {
      const p = DS.doc.pages[i], el = dsPageEl(i);

      el.innerHTML = '';
      if (p.pdfBg) {
        const c = document.createElement('canvas'); c.className = 'ds-pdfbg';
        c.style.cssText = `position:absolute;left:0;top:0;width:${p.w}px;height:${p.h}px`;
        el.appendChild(c);
        dsDrawPdfBg(p, c);
      }
      if (p.bgAsset && DS.assets.get(p.bgAsset)) {
        const a = DS.assets.get(p.bgAsset);
        const im = document.createElement('img'); im.src = a.url; im.draggable = false;

    }
    const _dsPdfRenders = new WeakMap();
    async function dsDrawPdfBg(p, canvas) {

      const scale = Math.min(4, DS.zoom * dpr);
      try {
        const doc = await dsPdfDocFor(a);
        const page = await doc.getPage(p.pdfBg.index + 1);
        const vp1 = page.getViewport({ scale: 1 });
        const src = await renderPage(page, scale * p.w / vp1.width);

    }
    function dsImageLayout(o, a) {
      const iw = a ? a.w || 1 : 1, ih = a ? a.h || 1 : 1;
      if (o.fit === 'contain') { const s = Math.min(o.w / iw, o.h / ih); return { x: (o.w - iw * s) / 2, y: (o.h - ih * s) / 2, w: iw * s, h: ih * s }; }
      const s = Math.max(o.w / iw, o.h / ih) * Math.max(1, o.zoom || 1), dw = iw * s, dh = ih * s;
      return { x: clamp(o.w / 2 - (o.cx ?? 0.5) * dw, o.w - dw, 0), y: clamp(o.h / 2 - (o.cy ?? 0.5) * dh, o.h - dh, 0), w: dw, h: dh };
    }
    const dsMaskRadius = (o) => o.mask === 'circle' ? '50%' : o.mask === 'rounded' ? `${Math.min(o.radius || 0, o.w / 2, o.h / 2)}px` : '0';
    const dsDashArray = (dash, sw) => dash === 'dashed' ? `${sw * 3} ${sw * 2}` : dash === 'dotted' ? `0.01 ${sw * 2}` : '';
    function dsIconSvg(o, { size } = {}) {
      const ic = DS_ICONS[o.icon] || DS_ICONS.star;
      const bg = o.bg === 'circle' ? `<circle cx="12" cy="12" r="12" fill="${o.bgColor}"/>` : o.bg === 'square' ? `<rect width="24" height="24" rx="5" fill="${o.bgColor}"/>` : '';
      const paths = ic.p.map(d => d[0] === 'F' ? `<path d="${d.slice(1)}" fill="${o.color}" stroke="none"/>` : `<path d="${d}"/>`).join('');
      const inner = o.bg === 'none' ? paths : `<g transform="translate(12 12) scale(0.58) translate(-12 -12)">${paths}</g>`;
      return `<svg viewBox="0 0 24 24" width="${size || '100%'}" height="${size || '100%'}" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible">${bg}<g fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;

    function dsLineSvg(o) {

      const x1 = o.arrowStart ? a * 1.2 : 0, x2 = o.arrowEnd ? o.w - a * 1.2 : o.w;
      const head = (x, dir) => `<path d="M${x} ${y}L${x - dir * a * 1.6} ${y - a}L${x - dir * a * 1.6} ${y + a}Z" fill="${o.stroke}"/>`;
      return `<svg width="${o.w}" height="${o.h}" style="display:block;overflow:visible"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${o.stroke}" stroke-width="${sw}" stroke-linecap="${o.dash === 'dotted' ? 'round' : 'butt'}" stroke-dasharray="${dsDashArray(o.dash, sw)}"/>${o.arrowEnd ? head(o.w, 1) : ''}${o.arrowStart ? head(0, -1) : ''}</svg>`;
    }
    function dsTextStyle(o) {
      return `font-family:${dsFontCss(o.font)};font-size:${o.size}px;color:${o.color};font-weight:${o.bold ? 700 : 400};font-style:${o.italic ? 'italic' : 'normal'};text-decoration:${o.underline ? 'underline' : 'none'};text-align:${o.align};line-height:${o.lineHeight};letter-spacing:${o.letterSpacing || 0}px;text-transform:${o.upper ? 'uppercase' : 'none'};--ps:${o.paraSpace || 0}px;width:${o.w}px`;
    }
    function dsBuildObj(o, { forExport = false } = {}) {
      const el = document.createElement('div');
      el.className = 'ds-obj ds-' + o.type;
      el.dataset.id = o.id;
      dsApplyBox(el, o);
      if (o.type === 'text') {
        el.innerHTML = `<div class="ds-text ${o.list !== 'none' ? 'ds-list-' + o.list : ''}" style="${dsTextStyle(o)}">${o.html}</div>`;
      } else if (o.type === 'shape') {
        const sh = DS_SHAPES[o.shape] || DS_SHAPES.rect;
        el.innerHTML = `<svg width="${o.w}" height="${o.h}" style="display:block;overflow:visible"><path d="${sh.path(o.w, o.h, o)}" fill="${o.fill === 'none' ? 'none' : o.fill}" ${sh.evenOdd ? 'fill-rule="evenodd"' : ''} stroke="${o.strokeWidth > 0 ? o.stroke : 'none'}" stroke-width="${o.strokeWidth}" stroke-dasharray="${dsDashArray(o.dash, o.strokeWidth)}" stroke-linejoin="round" stroke-linecap="${o.dash === 'dotted' ? 'round' : 'butt'}"/></svg>`;
      } else if (o.type === 'line') {
        el.innerHTML = dsLineSvg(o);
      } else if (o.type === 'icon') {
        el.innerHTML = dsIconSvg(o);
      } else if (o.type === 'image') {
        const a = o.asset && DS.assets.get(o.asset), rad = dsMaskRadius(o);
        if (a) {
          const L = dsImageLayout(o, a);
          el.innerHTML = `<div style="position:absolute;inset:0;overflow:hidden;border-radius:${rad}"><img src="${a.url}" draggable="false" style="position:absolute;left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px;max-width:none;${o.gray ? 'filter:grayscale(1);' : ''}${o.flipX ? 'transform:scaleX(-1);' : ''}"></div>`;
        } else {
          el.innerHTML = `<div class="ds-ph" style="border-radius:${rad}">${forExport ? '' : `<svg viewBox="0 0 24 24" width="${Math.min(o.w, o.h) * 0.32}" height="${Math.min(o.w, o.h) * 0.32}" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`}</div>`;

    }
    function dsApplyBox(el, o) {

    }
    function dsObjEl(id) { return document.querySelector(`.ds-obj[data-id="${id}"]`); }
    function dsRefreshObj(o) {
      const old = dsObjEl(o.id);
      if (!old) return;
      if (DS.editing === o.id) { const t = old.querySelector('.ds-text'); t.setAttribute('style', dsTextStyle(o)); t.className = `ds-text ${o.list !== 'none' ? 'ds-list-' + o.list : ''}`; dsApplyBox(old, o); dsSyncTextHeight(o); return; }
      const nu = dsBuildObj(o);
      old.replaceWith(nu);

    }
    function dsSyncTextHeight(o) {
      const el = dsObjEl(o.id);

      const h = el.offsetHeight;
      if (h && Math.abs(h - o.h) > 0.1) o.h = h;
    }
    function dsSyncTextHeights(pi) {
      const p = DS.doc.pages[pi];
      // fonts may still be loading: re-measure when they arrive
      p.objects.forEach(o => dsSyncTextHeight(o));

    }

    // ------------------------------------------------------------ overlay
    function dsRenderOverlay(guides = []) {
      document.querySelectorAll('.ds-overlay').forEach(ov => ov.innerHTML = '');
      document.querySelectorAll('.ds-pagewrap').forEach(w => w.classList.toggle('active', +w.dataset.page === DS.page));
      if (!DS.doc) return;
      const ov = document.querySelector(`.ds-pagewrap[data-page="${DS.page}"] .ds-overlay`);
      if (!ov) return;
      const z = DS.zoom;
      let html = '';
      const objs = dsSelObjs().filter(o => !o.hidden);
      if (objs.length === 1) {
        const o = objs[0];
        const w = o.w * z, h = o.h * z;
        let handles = '';
        if (DS.editing !== o.id && !o.locked && !DS.cropping) {
          const pos = { nw: [0, 0], n: [w / 2, 0], ne: [w, 0], e: [w, h / 2], se: [w, h], s: [w / 2, h], sw: [0, h], w: [0, h / 2] };

          if (o.type === 'line') list = ['w', 'e'];

        }

        html += `<div class="ds-selbox ${DS.editing === o.id ? 'editing' : ''} ${DS.cropping === o.id ? 'cropping' : ''}" style="left:${o.x * z}px;top:${o.y * z}px;width:${w}px;height:${h}px;transform:${o.rot ? `rotate(${o.rot}deg)` : 'none'}">${handles}${lock}</div>`;
        if (DS._sizeTip) html += `<div class="ds-tip" style="left:${(o.x + o.w / 2) * z}px;top:${(o.y + o.h) * z + 14}px">${DS._sizeTip}</div>`;
      } else if (objs.length > 1) {
        for (const o of objs) html += `<div class="ds-selbox thin" style="left:${o.x * z}px;top:${o.y * z}px;width:${o.w * z}px;height:${o.h * z}px;transform:${o.rot ? `rotate(${o.rot}deg)` : 'none'}"></div>`;
