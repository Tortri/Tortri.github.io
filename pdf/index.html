<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excel to PDF Converter (Pure Static)</title>
  
  <!-- SheetJS: For reading Excel files -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2pdf.js: For converting DOM elements to downloadable PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    #preview-container { margin-top: 20px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Excel (.xlsx / .csv) to PDF Converter</h2>
  <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" />
  <div id="controls" style="display: none;">
    <button onclick="downloadPDF()">Download as PDF</button>
  </div>

  <div id="preview-container"></div>

  <script>
    let activeElementToExport = null;

    document.getElementById('excel-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const buffer = await file.arrayBuffer();
      // Read Excel Workbook
      const workbook = XLSX.read(buffer, { type: 'array' });
      
      // Grab the first sheet
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // Convert sheet data into HTML Table format
      const htmlTable = XLSX.utils.sheet_to_html(worksheet);

      const previewDiv = document.getElementById('preview-container');
      previewDiv.innerHTML = htmlTable;
      
      activeElementToExport = previewDiv;
      document.getElementById('controls').style.display = 'block';
    });

    function downloadPDF() {
      if (!activeElementToExport) return;

      const options = {
        margin:       10,
        filename:     'converted-excel.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      // Generate and trigger download entirely in browser
      html2pdf().set(options).from(activeElementToExport).save();
    }
  </script>

</body>
</html>
