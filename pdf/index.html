    }

    // ------------------------------------------------------------ selection helpers
    function dsGroupIds(o) { return o.group ? dsCurPage().objects.filter(x => x.group === o.group).map(x => x.id) : [o.id]; }

    // ------------------------------------------------------------ gestures

        if (dir === 'forward') for (let k = idxs.length - 1; k >= 0; k--) { const i = idxs[k]; if (i < arr.length - 1 && !DS.sel.has(arr[i + 1].id)) [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]]; }
        else for (const i of idxs) if (i > 0 && !DS.sel.has(arr[i - 1].id)) [arr[i], arr[i - 1]] = [arr[i - 1], arr[i]];

    function dsAlign(how) {
      const objs = dsSelObjs().filter(o => !o.locked); if (!objs.length) return;
      const p = dsCurPage();
      const ref = objs.length === 1 ? { x: 0, y: 0, w: p.w, h: p.h } : dsUnion(objs.map(dsObjAABB));
      if (how === 'dist-h' || how === 'dist-v') {
        if (objs.length < 3) return;
        const key = how === 'dist-h' ? 'x' : 'y', size = how === 'dist-h' ? 'w' : 'h';
        const bs = objs.map(o => ({ o, b: dsObjAABB(o) })).sort((a, b) => a.b[key] - b.b[key]);
        const total = bs.reduce((a, x) => a + x.b[size], 0), span = ref[size] - total, gap = span / (bs.length - 1);
        let cur = ref[key];
        for (const x of bs) { x.o[key] += cur - x.b[key]; cur += x.b[size] + gap; }
      } else for (const o of objs) {
        const b = dsObjAABB(o);
        if (how === 'left') o.x += ref.x - b.x;
        if (how === 'center') o.x += ref.x + ref.w / 2 - (b.x + b.w / 2);
        if (how === 'right') o.x += ref.x + ref.w - (b.x + b.w);
        if (how === 'top') o.y += ref.y - b.y;
        if (how === 'middle') o.y += ref.y + ref.h / 2 - (b.y + b.h / 2);
        if (how === 'bottom') o.y += ref.y + ref.h - (b.y + b.h);

      if (act === 'down' && i < pages.length - 1) { [pages[i + 1], pages[i]] = [pages[i], pages[i + 1]]; DS.page = i + 1; }
      if (act === 'dup') { const c = JSON.parse(JSON.stringify(pages[i])); c.id = uid(); c.objects.forEach(o => o.id = uid()); pages.splice(i + 1, 0, c); DS.page = i + 1; }

      if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); dsUndoRedo(1); return; }
      if (typing) return;
      if (mod && e.key.toLowerCase() === 'c') { dsCopySel(false); return; }
      if (mod && e.key.toLowerCase() === 'x') { dsCopySel(true); return; }
      if (mod && e.key.toLowerCase() === 'v') { if (DS.clipboard) { e.preventDefault(); dsPaste(); } return; }
      if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); dsDuplicateSel(); return; }
      if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); dsSelect(dsCurPage().objects.filter(o => !o.locked && !o.hidden).map(o => o.id)); return; }
      if (mod && e.key.toLowerCase() === 'g') { e.preventDefault(); dsGroupSel(e.shiftKey); return; }

    function dsParseVal(input) {
      if (input.type === 'checkbox') return input.checked;
      if (input.type === 'number' || input.type === 'range') {
        let v = parseFloat(input.value);
        if (isNaN(v)) return null;
        if (input.dataset.len) v *= DS_UNITS[DS.doc.unit];
        if (input.dataset.prop === 'opacity') v = clamp(v / 100, 0, 1);
        return v;
      }
      return input.value;
    }
    function dsBindProps(el) {
      el.querySelectorAll('[data-prop]').forEach(inp => {
        const prop = inp.dataset.prop;
        const apply = (live) => {
          const v = dsParseVal(inp);
          if (v === null) return;
          if (prop === 'color' && DS.editing && dsInline('foreColor', v)) { if (!live) dsCommit(); return; }
          if ((prop === 'w' || prop === 'h') && v <= 0) return;
          dsSetProp(prop, v, { live });
          if (prop === 'bg') return;
        };
        if (inp.type === 'color') inp.addEventListener('pointerdown', dsSaveRange);
        inp.addEventListener('input', () => apply(true));
        inp.addEventListener('change', () => { apply(false); if (inp.type !== 'number' || DS._propsStale) { DS._propsStale = false; setTimeout(dsRenderProps, 0); } });
        if (inp.type === 'number') inp.addEventListener('blur', () => { if (DS._propsStale) { DS._propsStale = false; setTimeout(dsRenderProps, 0); } });
      });
      el.querySelectorAll('[data-set]').forEach(b => {
        b.addEventListener('mousedown', (e) => { e.preventDefault(); dsSaveRange(); });
        b.addEventListener('click', () => {
          const prop = b.dataset.set, v = b.dataset.val;
          if (prop === 'color' && DS.editing && dsInline('foreColor', v)) { dsCommit(); return; }
          dsSetProp(prop, v);
          dsRenderProps();
        });
      });
      el.querySelectorAll('[data-toggle]').forEach(b => {
        b.addEventListener('mousedown', (e) => { e.preventDefault(); dsSaveRange(); });
        b.addEventListener('click', () => {
          const k = b.dataset.toggle, cmd = { bold: 'bold', italic: 'italic', underline: 'underline' }[k];
          if (cmd && DS.editing && dsInline(cmd)) { dsCommit(); return; }
          const objs = dsSelObjs();
          const v = !objs.every(o => o[k]);
          dsSetProp(k, v); dsRenderProps();
        });
      });
      el.querySelectorAll('[data-act]').forEach(b => {
        b.addEventListener('mousedown', (e) => { if (b.dataset.act.startsWith('size')) e.preventDefault(); });
        b.addEventListener('click', () => dsPropAction(b.dataset.act));
      });
    }
    function dsPropAction(act) {
      const objs = dsSelObjs(), o = objs[0];
      if (act.startsWith('align-')) return dsAlign(act.slice(6));
      switch (act) {
        case 'front': case 'back': case 'forward': case 'backward': return dsOrder(act);
        case 'dup': return dsDuplicateSel();
        case 'delete': return dsDeleteSel();
        case 'lock': { const v = !objs.some(x => x.locked); objs.forEach(x => x.locked = v); dsCommit(); dsRenderOverlay(); dsRenderProps(); if (DS.tab === 'layers') dsRenderLeft(); return; }
        case 'group': return dsGroupSel(false);
        case 'ungroup': return dsGroupSel(true);
        case 'size-up': case 'size-down': { objs.filter(x => x.type === 'text').forEach(x => { const steps = [6, 7, 8, 9, 10, 11, 12, 14, 16, 18, 20, 24, 28, 32, 36, 42, 48, 56, 64, 72, 96, 120, 144]; x.size = act === 'size-up' ? (steps.find(s => s > x.size) || Math.round(x.size * 1.2)) : ([...steps].reverse().find(s => s < x.size) || Math.max(1, Math.round(x.size / 1.2))); dsRefreshObj(x); }); dsCommit(); dsRenderOverlay(); dsRenderProps(); return; }
        case 'edit-text': return dsStartEditing(o.id);
        case 'icon-change': DS.tab = 'icons'; $('ds-left').classList.remove('collapsed'); dsRenderLeft(); return;
        case 'img-replace': DS._replaceTarget = o.id; $('ds-file-img').click(); return;
        case 'img-crop': return dsStartCrop(o.id);
        case 'crop-done': return dsStopCrop();
        case 'img-bg': { const p = dsCurPage(); p.bgAsset = o.asset; p.objects = p.objects.filter(x => x.id !== o.id); DS.sel = new Set(); dsRenderPage(DS.page); dsCommit(); dsRenderOverlay(); dsRenderProps(); return; }

    async function dsAddImages(files, { place = true } = {}) {
      const added = [];
      progress.show('Adding photos...');
      try {
        for (const f of files) { try { const a = await dsAssetFromImageFile(f); a.uploaded = true; added.push(a); } catch (e) { showToast(e.message, 'error'); } }
      } finally { progress.hide(); }
      if (!added.length) return added;
      if (DS._bgTarget != null) { const p = DS.doc.pages[DS._bgTarget]; DS._bgTarget = null; p.bgAsset = added[0].id; dsRenderPage(DS.doc.pages.indexOf(p)); dsCommit(); dsRenderProps(); return added; }
      if (DS._replaceTarget) { const id = DS._replaceTarget; DS._replaceTarget = null; dsPlaceAsset(added[0], DS.page, null, id); return added; }
      if (place) added.forEach((a, k) => dsPlaceAsset(a, DS.page, null, null, k));

    function dsPlaceAsset(a, pi, pt, targetId, k = 0) {
      if (!a) return;
      if (pi < 0) pi = DS.page;
      const t = targetId && dsFind(targetId);
      if (t && t.o.type === 'image') {
        t.o.asset = a.id; t.o.zoom = 1; t.o.cx = 0.5; t.o.cy = 0.5;
        dsRefreshObj(t.o); dsCommit(); DS.sel = new Set([t.o.id]); DS.page = t.page; dsRenderOverlay(); dsRenderProps();
        return;
      }
      const p = DS.doc.pages[pi];
      const maxW = p.w * 0.5, maxH = p.h * 0.5, s = Math.min(maxW / a.w, maxH / a.h, 1);
      const w = Math.max(20, a.w * s), h = Math.max(20, a.h * s);
      const o = dsNewObj('image', { asset: a.id, w, h, x: pt ? pt.x - w / 2 : 0, y: pt ? pt.y - h / 2 : 0 });
      if (!pt && k) { o.x = p.w / 2 - w / 2 + k * 16; o.y = p.h / 2 - h / 2 + k * 16; }

    }

    LIBS.jspdf = { label: 'PDF writer', test: () => window.jspdf && window.jspdf.jsPDF, urls: ['https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js'] };

    // ------------------------------------------------------------ text measurement
    // Text is laid out by the browser (exactly as in the editor), then every word's position
    // is read back with Range rects. The PDF places the same words at the same spots with the
    // same font files, so the PDF matches the screen and its text stays selectable.
    const DS_MEASURE = { host: null, ratio: new Map() };
    function dsMeasureHost() {
      if (!DS_MEASURE.host || !DS_MEASURE.host.isConnected) {
        const h = document.createElement('div');
        h.style.cssText = 'position:fixed;left:-30000px;top:0;visibility:hidden;pointer-events:none;contain:layout';
        document.body.appendChild(h);
        DS_MEASURE.host = h;
      }
      return DS_MEASURE.host;
    }
    function dsKeyFromCss(cs) {
      const fam = cs.fontFamily.split(',')[0].trim().replace(/["']/g, '').toLowerCase();
      const f = DS_FONT_BY_FAMILY[fam] || DS_FONT_BY_ID.inter;
      const weight = parseInt(cs.fontWeight, 10) >= 600 && f.bold ? 700 : 400;
      const style = /italic|oblique/.test(cs.fontStyle) && f.italic ? 'italic' : 'normal';
      return { id: f.id, family: f.family, weight, style, key: `${f.id}|${weight}|${style}` };
    }
    function dsBaselineRatio(k) {
      if (DS_MEASURE.ratio.has(k.key)) return DS_MEASURE.ratio.get(k.key);
      const host = dsMeasureHost();
      const d = document.createElement('div');
      d.style.cssText = `position:absolute;left:0;top:0;white-space:nowrap;line-height:normal;font-family:'${k.family}';font-size:100px;font-weight:${k.weight};font-style:${k.style}`;
      d.innerHTML = 'Hg<span style="display:inline-block;width:1px;height:0;vertical-align:baseline"></span>';
      host.appendChild(d);
      const rg = document.createRange(); rg.setStart(d.firstChild, 0); rg.setEnd(d.firstChild, 1);
      const top = rg.getBoundingClientRect().top, base = d.lastChild.getBoundingClientRect().bottom;
      d.remove();
      const r = (base - top) / 100 || 0.8;
      DS_MEASURE.ratio.set(k.key, r);
      return r;
    }
    async function dsLoadFontsFor(objs) {
      const want = new Set();
      for (const o of objs) {
        if (o.type !== 'text') continue;
        const f = DS_FONT_BY_ID[o.font] || DS_FONT_BY_ID.inter;
        for (const w of f.bold ? [400, 700] : [400]) for (const s of f.italic ? ['normal', 'italic'] : ['normal']) want.add(`${s} ${w} 16px '${f.family}'`);
      }
      await Promise.all([...want].map(fnt => document.fonts.load(fnt, 'AaÅøñ').catch(() => null)));
    }
    function dsCssColor(c) {
      const m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+%?))?/.exec(c || '');
      if (!m) return { hex: '#000000', a: 1 };
      const a = m[4] == null ? 1 : /%$/.test(m[4]) ? parseFloat(m[4]) / 100 : parseFloat(m[4]);
      return { hex: '#' + [m[1], m[2], m[3]].map(v => Math.round(+v).toString(16).padStart(2, '0')).join(''), a };
    }
    function dsMeasureText(o) {
      const host = dsMeasureHost();
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0';
      wrap.innerHTML = `<div class="ds-text ${o.list !== 'none' ? 'ds-list-' + o.list : ''}" style="${dsTextStyle(o)}">${o.html}</div>`;
      host.appendChild(wrap);
      const el = wrap.firstChild, base = el.getBoundingClientRect();
      const cells = [], styles = new Map(), rg = document.createRange();
      const styleOf = (parent) => {
        if (styles.has(parent)) return styles.get(parent);
        const cs = getComputedStyle(parent);
        let underline = false, strike = false;
        for (let n = parent; n && n !== wrap; n = n.parentElement) { const d = getComputedStyle(n).textDecorationLine || ''; if (/underline/.test(d)) underline = true; if (/line-through/.test(d)) strike = true; }
        const st = { k: dsKeyFromCss(cs), size: parseFloat(cs.fontSize), color: dsCssColor(cs.color), ls: parseFloat(cs.letterSpacing) || 0, upper: cs.textTransform === 'uppercase', underline, strike, p: parent.closest('p') };
        st.sig = `${st.k.key}|${st.size}|${st.color.hex}|${st.color.a}|${st.ls}|${st.upper}`;
        styles.set(parent, st);
        return st;
      };
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const st = styleOf(node.parentElement), t = node.data;
        for (let i = 0; i < t.length;) {
          const cp = t.codePointAt(i), len = cp > 0xFFFF ? 2 : 1, ch = t.slice(i, i + len);
          rg.setStart(node, i); rg.setEnd(node, i + len);
          const rects = rg.getClientRects();
          i += len;
          if (!rects.length) continue;
          let r = rects[rects.length - 1];
          for (const q of rects) if (q.width > 0) { r = q; break; }
          if (r.width === 0 && /\s/.test(ch)) continue;
          cells.push({ ch, x: r.left - base.left, r: r.right - base.left, top: r.top - base.top, st, space: /\s/.test(ch) });
        }
      }
      // words
      const runs = [], decos = [];
      let cur = null;
      const flush = () => { if (cur && cur.text.trim()) runs.push(cur); cur = null; };

    async function dsImportFiles(files, mode = 'append') {
      if (!files.length) return;
      progress.show('Opening file...');
      try {
        const newPages = [];
        for (const f of files) {
          const e = extOf(f.name);
          if (RASTER_EXTS.includes(e) && mode !== 'new') { progress.hide(); await dsAddImages([f]); progress.show('Opening file...'); continue; }
          if (RASTER_EXTS.includes(e)) {
            const a = await dsAssetFromImageFile(f); a.uploaded = true;
            const s = Math.min(1, 1600 / Math.max(a.w, a.h)) * 0.75;
            const pg = dsNewPage(a.w * s, a.h * s);
            pg.objects.push(dsNewObj('image', { asset: a.id, x: 0, y: 0, w: pg.w, h: pg.h }));
            newPages.push(pg); continue;
          }
          progress.set(0.2, `Reading ${f.name}`);
          let bytes = e === '.pdf' ? await fileBytes(f) : await anyFileToPdfBytes(f, { engine: 'text' });
          // decrypt owner-restricted PDFs once so every later step works
          try { await PDFLib.PDFDocument.load(bytes, { updateMetadata: false }); } catch (err) { bytes = await (await loadPdfDoc(bytes, f.name)).save(); }
          const a = dsAddAsset({ kind: 'pdf', bytes, name: f.name, mime: 'application/pdf' });
          const pdf = await dsPdfDocFor(a);
          for (let i = 1; i <= pdf.numPages; i++) {
            const vp = (await pdf.getPage(i)).getViewport({ scale: 1 });
            newPages.push(dsNewPage(vp.width, vp.height, { pdfBg: { asset: a.id, index: i - 1 } }));
          }
        }
        if (!newPages.length) return;
        if (mode === 'new' || !DS.doc) {
          const doc = dsNewDoc(newPages[0].w, newPages[0].h, 'mm', baseName(files[0].name));
          doc.pages = newPages;
          const keep = DS.assets; DS.assets = keep; // assets were added above
          dsLoadDoc(doc);

        } else {
          const at = DS.page + 1;

          DS.page = at; DS.sel = new Set();

          showToast(`Added ${newPages.length} page(s).`, 'success');

    // ------------------------------------------------------------ open / close
    function lxEnsureEngine() {
      if (!LXS.engine) {
        LXS.engine = new LxEngine();
        LXS.engine.onStatus = (t) => { if (LXS.compiling) lxSetStatus('busy', t); };
        LXS.engine.onProgress = (f, label) => { if (LXS.open) lxEngineProgress(f, label); };
      }
      return LXS.engine;
    }
    function lxPrewarm() {
      if (LXS._prewarmed) return;
      LXS._prewarmed = true;
      lxEnsureEngine().loadAssets().catch(() => { LXS._prewarmed = false; });
      lxLoadCodeMirror().catch(() => {});
    }
    async function lxOpen(opts = {}) {
      lxEnsureDom();
      if (opts.pickImport) $('lx-open-input').click();   // while the click still counts as a user gesture
      if (typeof DS !== 'undefined' && DS.open) dsClose({ fromHash: true });
      state.currentTool = null;
      LXS.open = true;
      $('view-latex').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (!opts.noHash && location.hash !== '#latex') history.pushState(null, '', '#latex');
      lxEnsureEngine();
      // start downloading the engine right away; the editor loads meanwhile
      LXS.engine.start().then(() => { if (!LXS.pdf && !LXS.compiling) lxCompileNow(); }).catch(e => lxEngineFailed(e));
      await lxInitEditor();
      if (opts.importFiles && opts.importFiles.length) {
        const f = opts.importFiles[0];
        await lxOpenFileAsProject(f);
      } else if (!LXS.project) {
        const last = lxPref.get('last', null);
        let p = null;
        if (last) { try { p = await lxDbGet(last); } catch (e) { p = null; } }
        if (!p) { try { const all = await lxDbAll(); p = all.sort((a, b) => b.updated - a.updated)[0] || null; } catch (e) { p = null; } }
        if (p) lxLoadProject(p);
        else await lxNewFromTemplate('article', { silent: true });
      } else {
        lxRefreshEditor();
        lxRelayoutSoon();
      }
      if (opts.template) await lxNewFromTemplate(opts.template);
      lxCompileNow();
    }
    function lxClose({ fromHash = false } = {}) {
      if (!LXS.open) return;
      lxSaveNow().catch(() => {});
      LXS.open = false;
      lxHideModal();
      $('lx-menu').classList.add('hidden');
      $('view-latex').classList.add('hidden');
      document.body.style.overflow = '';
      if (!fromHash) navigateToDashboard();
    }

    // ------------------------------------------------------------ editor
    let lxCMPromise = null;
    function lxLoadCodeMirror() {
      if (!lxCMPromise) lxCMPromise = lxLoadCodeMirrorOnce().then(ok => { if (!ok) lxCMPromise = null; return ok; });
      return lxCMPromise;
    }
    async function lxLoadCodeMirrorOnce() {
      if (window.CodeMirror && CodeMirror.modes && CodeMirror.modes.stex) return true;
      const files = ['lib/codemirror', 'mode/stex/stex', 'addon/edit/matchbrackets', 'addon/edit/closebrackets', 'addon/selection/active-line', 'addon/search/searchcursor', 'addon/search/search', 'addon/dialog/dialog'];
      const ok = () => window.CodeMirror && CodeMirror.modes && CodeMirror.modes.stex;
      try { await injectScript('https://cdn.jsdelivr.net/combine/' + files.map(f => `npm/codemirror@5.65.18/${f}.min.js`).join(',')); if (ok()) return true; } catch (e) { /* try the next CDN */ }
      try {
        for (const f of files) await injectScript(`https://unpkg.com/codemirror@5.65.18/${f}.js`);
        if (ok()) return true;
      } catch (e) { /* fall back to a plain text area */ }
      return false;
    }
    async function lxInitEditor() {
      if (LXS.ed) return;
      const host = $('lx-editor-host');
      const hasCM = await lxLoadCodeMirror();
      if (LXS.ed) return;
      if (hasCM) {
        const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Cmd' : 'Ctrl';
        const keys = {
          Tab: (cm) => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('  ', 'end'),
          'Shift-Tab': (cm) => cm.indentSelection('subtract'),
        };
        keys[mod + '-B'] = () => lxInsert('bold');
        keys[mod + '-I'] = () => lxInsert('italic');
        keys[mod + '-/'] = () => lxInsert('comment');
        const cm = CodeMirror(host, {
          value: '', mode: 'stex', lineNumbers: true, lineWrapping: true, matchBrackets: true,
          autoCloseBrackets: { pairs: '()[]{}$$', explode: '[]{}' }, styleActiveLine: true,
          indentUnit: 2, tabSize: 2, indentWithTabs: false, gutters: ['lx-gutter-mark', 'CodeMirror-linenumbers'],
          extraKeys: keys, viewportMargin: 30, spellcheck: !!LXS.spell, inputStyle: 'contenteditable',
        });
        LXS.cm = cm;
        cm.on('changes', () => lxOnEdit());
        LXS.ed = {
          kind: 'cm',
          setFile(path, text) {
            let d = LXS.docs.get(path);
            if (!d) { d = CodeMirror.Doc(text, 'stex'); LXS.docs.set(path, d); }
            else if (d.getValue() !== text) d.setValue(text);
            LXS._swapping = true; cm.swapDoc(d); LXS._swapping = false;
            cm.getWrapperElement().style.display = '';
          },
          hide() { cm.getWrapperElement().style.display = 'none'; },
          getValue: () => cm.getValue(),
          focus: () => cm.focus(),
          refresh: () => cm.refresh(),
          goto(line, ch = 0, flash = true) {
            const l = Math.max(0, Math.min(cm.lineCount() - 1, line - 1));
            cm.setCursor({ line: l, ch });
            cm.scrollIntoView({ line: l, ch }, Math.round(cm.getScrollInfo().clientHeight / 3));
            if (flash) { const h = cm.addLineClass(l, 'background', 'lx-line-flash'); setTimeout(() => cm.removeLineClass(h, 'background', 'lx-line-flash'), 1200); }
            cm.focus();
          },
          wrap(before, after, placeholder) {
            const sel = cm.getSelection();
            const inner = sel || placeholder || '';
            cm.replaceSelection(before + inner + after, 'around');
            const from = cm.getCursor('from');
            const start = cm.indexFromPos(from) + before.length;
            cm.setSelection(cm.posFromIndex(start), cm.posFromIndex(start + inner.length));
            cm.focus();
          },
          insertBlock(text, selectText) {
            const cur = cm.getCursor();
            const lineText = cm.getLine(cur.line);
            let prefix = lineText.trim() ? '\n' : '', suffix = '\n';
            if (/^\s*\\end\{document\}/.test(lineText)) { cm.setCursor({ line: cur.line, ch: 0 }); prefix = ''; }   // never after \end{document}
            else if (lineText.trim() && cur.ch < lineText.length) cm.setCursor({ line: cur.line, ch: lineText.length });
            const at = cm.indexFromPos(cm.getCursor()) + prefix.length;
            cm.replaceSelection(prefix + text + suffix, 'end');
            if (selectText) {
              const i = text.indexOf(selectText);
              if (i >= 0) cm.setSelection(cm.posFromIndex(at + i), cm.posFromIndex(at + i + selectText.length));
            }
            cm.focus();
          },
          toggleComment() {
            const from = cm.getCursor('from').line, to = cm.getCursor('to').line;
            const lines = []; for (let l = from; l <= to; l++) lines.push(cm.getLine(l));
            const all = lines.filter(t => t.trim()).every(t => /^\s*%/.test(t));
            cm.operation(() => {
              for (let l = from; l <= to; l++) {
                const t = cm.getLine(l);
                if (all) { const m = /^(\s*)% ?/.exec(t); if (m) cm.replaceRange(m[1], { line: l, ch: 0 }, { line: l, ch: m[0].length }); }
                else if (t.trim()) cm.replaceRange('% ', { line: l, ch: (/^\s*/.exec(t) || [''])[0].length });
              }
            });
            cm.focus();
          },
          find() { cm.focus(); cm.execCommand('find'); },
          marks(list) {
            for (const m of LXS.marks) { try { cm.removeLineClass(m, 'background'); } catch (e) { /* stale */ } }
            LXS.marks = [];
            cm.clearGutter('lx-gutter-mark');
            for (const p of list) {
              const l = p.line - 1;
              if (l < 0 || l >= cm.lineCount()) continue;
              LXS.marks.push(cm.addLineClass(l, 'background', p.sev === 'err' ? 'lx-line-err' : 'lx-line-warn'));
              const dot = document.createElement('span'); dot.className = 'lx-gm ' + (p.sev === 'err' ? 'err' : 'warn'); dot.title = p.msg;
              cm.setGutterMarker(l, 'lx-gutter-mark', dot);
            }
          },
          wordAt() { const c = cm.getCursor(); return { line: c.line + 1, ch: c.ch }; },
        };
      } else {
        const ta = document.createElement('textarea');
        ta.className = 'lx-plain'; ta.spellcheck = false;
        host.appendChild(ta);
        ta.addEventListener('input', () => lxOnEdit());
        ta.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); lxOnEdit(); }
        });
        const lineStart = (line) => { const parts = ta.value.split('\n'); let i = 0; for (let k = 0; k < Math.min(line - 1, parts.length); k++) i += parts[k].length + 1; return i; };
        LXS.ed = {
          kind: 'plain',
          setFile(path, text) { if (ta.value !== text) ta.value = text; ta.style.display = ''; },
          hide() { ta.style.display = 'none'; },
          getValue: () => ta.value, focus: () => ta.focus(), refresh() {},
          goto(line, ch = 0) { const i = lineStart(line) + ch; ta.focus(); ta.setSelectionRange(i, i); const lh = 21; ta.scrollTop = Math.max(0, (line - 4) * lh); },
          wrap(before, after, placeholder) { const s = ta.selectionStart, e = ta.selectionEnd; const inner = ta.value.slice(s, e) || placeholder || ''; ta.setRangeText(before + inner + after, s, e, 'end'); ta.setSelectionRange(s + before.length, s + before.length + inner.length); ta.focus(); lxOnEdit(); },
          insertBlock(text) {
            let s = ta.selectionEnd;
            const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
            if (/^\s*\\end\{document\}/.test(ta.value.slice(ls, ta.value.indexOf('\n', ls) < 0 ? undefined : ta.value.indexOf('\n', ls)))) s = ls;
            const pre = s > 0 && ta.value[s - 1] !== '\n' ? '\n' : '';
            ta.setRangeText(pre + text + '\n', s, s, 'end'); ta.focus(); lxOnEdit();
          },
          toggleComment() { const s = ta.selectionStart; const ls = ta.value.lastIndexOf('\n', s - 1) + 1; if (ta.value.slice(ls, ls + 2) === '% ') ta.setRangeText('', ls, ls + 2, 'preserve'); else ta.setRangeText('% ', ls, ls, 'preserve'); lxOnEdit(); },
          find() { showToast('Use your browser\'s find (Ctrl+F).', 'info'); },
          marks() {}, wordAt() { return { line: ta.value.slice(0, ta.selectionStart).split('\n').length, ch: 0 }; },
        };
      }
    }
    function lxCurrentFile() { return LXS.project && LXS.project.files.find(f => f.path === LXS.current); }
    function lxOnEdit() {
      if (LXS._swapping || !LXS.project) return;
      const f = lxCurrentFile();
      if (!f || f.bytes) return;
      const v = LXS.ed.getValue();
      if (v === f.text) return;
      f.text = v; lxBump(f);
      lxSaveSoon();
      if (LXS.auto) lxScheduleCompile();
    }
    function lxRefreshEditor() {
      if (!LXS.ed || !LXS.project) return;
      const f = lxCurrentFile();
      const host = $('lx-editor-host');
      const bin = host.querySelector('.lx-binary');
      if (bin) bin.remove();
      if (!f) { LXS.ed.hide(); return; }
      if (f.bytes) {
        LXS.ed.hide();
        const box = document.createElement('div');
        box.className = 'lx-binary';
        const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(f.path);
        box.innerHTML = `${isImg ? '<img alt="">' : '<i data-lucide="file"></i>'}
          <div><b>${esc(f.path)}</b> · ${fmtBytes(f.bytes.length)}</div>
          ${/\.(png|jpe?g|pdf)$/i.test(f.path) ? `<button class="lx-ghost" data-act="insert"><i data-lucide="image"></i>Insert into ${esc(LXS.project.main)}</button>` : ''}
          ${/\.(eps|gif|svg|webp)$/i.test(f.path) ? '<div class="text-amber-700 text-xs">pdfLaTeX can only include PNG, JPG and PDF images.</div>' : ''}`;
        host.appendChild(box);
        if (isImg) { const url = URL.createObjectURL(new Blob([f.bytes], { type: f.path.endsWith('.svg') ? 'image/svg+xml' : '' })); const img = box.querySelector('img'); img.onload = () => URL.revokeObjectURL(url); img.src = url; }
        const ib = box.querySelector('[data-act="insert"]');
        if (ib) ib.addEventListener('click', () => { const p = f.path; lxSelectFile(LXS.project.main); lxInsertFigure(p); });
        lucide.createIcons();
        return;
      }
      LXS.ed.setFile(f.path, f.text || '');
      lxApplyMarks();
      requestAnimationFrame(() => LXS.ed.refresh());
    }
    function lxSelectFile(path) {
      if (!LXS.project) return;
      LXS.current = path;
      lxRefreshEditor();
      lxRenderFiles();
    }

    // ------------------------------------------------------------ insert toolbar
    function lxEnsurePackage(pkg, opts = '') {
      const main = LXS.project && LXS.project.files.find(f => f.path === LXS.project.main);
      if (!main || main.bytes) return;
      const re = new RegExp('\\\\(usepackage|RequirePackage)(\\[[^\\]]*\\])?\\{[^}]*\\b' + pkg + '\\b[^}]*\\}');
      if (re.test(main.text) || /\\documentclass(\[[^\]]*\])?\{beamer\}/.test(main.text) && /^(graphicx|hyperref|amsmath|xcolor)$/.test(pkg)) return;
      const line = `\\usepackage${opts ? '[' + opts + ']' : ''}{${pkg}}\n`;
      const at = main.text.search(/\\begin\{document\}/);
      if (at < 0) return;
      // put it after the last \usepackage line, or right before \begin{document}
      const before = main.text.slice(0, at);
      const lastUse = before.lastIndexOf('\\usepackage');
      let pos = at;
      if (lastUse >= 0) { const nl = main.text.indexOf('\n', lastUse); if (nl >= 0 && nl < at) pos = nl + 1; }
      main.text = main.text.slice(0, pos) + line + main.text.slice(pos);
      lxBump(main);
      if (LXS.current === main.path) {
        if (LXS.cm) { const p = LXS.cm.posFromIndex(pos); LXS.cm.replaceRange(line, p); }
        else LXS.ed.setFile(main.path, main.text);
      }
      showToast(`Added \\usepackage{${pkg}} to the preamble.`, 'info', 2600);
    }
    function lxInsert(kind) {
      if (!LXS.ed || !LXS.project) return;
      const f = lxCurrentFile();
      if (!f || f.bytes) { lxSelectFile(LXS.project.main); }
      const ed = LXS.ed;
      switch (kind) {
        case 'bold': ed.wrap('\\textbf{', '}', 'bold text'); break;
        case 'italic': ed.wrap('\\emph{', '}', 'emphasis'); break;
        case 'section': ed.insertBlock('\\section{Section title}\n', 'Section title'); break;
        case 'itemize': ed.insertBlock('\\begin{itemize}\n  \\item First point\n  \\item Second point\n\\end{itemize}', 'First point'); break;
        case 'enumerate': ed.insertBlock('\\begin{enumerate}\n  \\item First step\n  \\item Second step\n\\end{enumerate}', 'First step'); break;
        case 'math': ed.wrap('$', '$', 'x^2'); break;
        case 'equation': lxEnsurePackage('amsmath'); ed.insertBlock('\\begin{equation}\n  E = mc^2 \\label{eq:name}\n\\end{equation}', 'E = mc^2'); break;
        case 'table': ed.insertBlock('\\begin{table}[ht]\n  \\centering\n  \\begin{tabular}{|l|c|r|}\n    \\hline\n    Left & Centre & Right \\\\\n    \\hline\n    a & b & c \\\\\n    d & e & f \\\\\n    \\hline\n  \\end{tabular}\n  \\caption{Table caption}\n  \\label{tab:name}\n\\end{table}', 'Left'); break;
        case 'figure': {
          const imgs = LXS.project.files.filter(x => /\.(png|jpe?g|pdf)$/i.test(x.path));
          if (imgs.length) {
            lxMenu($('lx-insert').querySelector('[data-ins="figure"]'), [
              ...imgs.slice(0, 12).map(x => ({ icon: 'image', label: x.path, run: () => lxInsertFigure(x.path) })),
              { sep: true },
              { icon: 'upload', label: 'Upload a new image…', run: () => { LXS._insertAfterUpload = true; $('lx-upload-input').accept = 'image/png,image/jpeg,application/pdf'; $('lx-upload-input').click(); setTimeout(() => { $('lx-upload-input').accept = ''; }, 1000); } },
            ]);
          } else { LXS._insertAfterUpload = true; $('lx-upload-input').accept = 'image/png,image/jpeg,application/pdf'; $('lx-upload-input').click(); setTimeout(() => { $('lx-upload-input').accept = ''; }, 1000); }
          break;
        }
        case 'link': lxEnsurePackage('hyperref'); ed.wrap('\\href{https://example.com}{', '}', 'link text'); break;
        case 'comment': ed.toggleComment(); break;
        case 'find': ed.find(); break;
      }
    }
    function lxInsertFigure(path) {
      lxEnsurePackage('graphicx');
      const label = baseName(path.split('/').pop()).replace(/[^A-Za-z0-9]+/g, '-').toLowerCase() || 'figure';
      LXS.ed.insertBlock(`\\begin{figure}[ht]\n  \\centering\n  \\includegraphics[width=0.7\\linewidth]{${path}}\n  \\caption{Caption}\n  \\label{fig:${label}}\n\\end{figure}`, 'Caption');
    }

    // ------------------------------------------------------------ files panel
    function lxRenderFiles() {
      const list = $('lx-files-list');
      if (!list || !LXS.project) return;
      const files = LXS.project.files.slice().sort((a, b) => (a.path === LXS.project.main ? -1 : b.path === LXS.project.main ? 1 : a.path.localeCompare(b.path)));
      list.innerHTML = files.map(f => {
        const icon = f.bytes ? (/\.(png|jpe?g|gif|webp|svg|pdf|eps)$/i.test(f.path) ? 'file-image' : 'file') : (/\.tex$/i.test(f.path) ? 'file-text' : 'file-code');
        const isMain = f.path === LXS.project.main;
        return `<div class="lx-file${f.path === LXS.current ? ' active' : ''}" data-path="${esc(f.path)}" title="${esc(f.path)}">
          <i data-lucide="${icon}"></i><span class="nm">${esc(f.path)}</span>${isMain ? '<span class="main-badge" title="Main file: this is the file that gets compiled">MAIN</span>' : ''}
          <span class="acts">
            ${!isMain && /\.tex$/i.test(f.path) ? '<button data-act="main" title="Compile this file (make it the main file)"><i data-lucide="star"></i></button>' : ''}
            <button data-act="rename" title="Rename"><i data-lucide="pencil"></i></button>
            ${!isMain ? '<button data-act="delete" class="danger" title="Delete"><i data-lucide="trash"></i></button>' : ''}
          </span></div>`;
      }).join('') + (LXS.project.files.length < 3 ? '<div class="lx-drop-hint">Add images with the upload button, then insert them with the picture button above the code.</div>' : '');
      list.querySelectorAll('.lx-file').forEach(row => {
        row.addEventListener('click', (e) => {
          const path = row.dataset.path;
          const act = e.target.closest('button') && e.target.closest('button').dataset.act;
          if (act === 'main') { LXS.project.main = path; lxSaveSoon(); lxRenderFiles(); lxCompileNow(); return; }
          if (act === 'rename') { lxRenameFilePrompt(row, path); return; }
          if (act === 'delete') { lxConfirmDelete(row, path); return; }
          if (act === 'yes') { lxDeleteFile(path); return; }
          if (act === 'no') { lxRenderFiles(); return; }
          if (!e.target.closest('input')) lxSelectFile(path);
          if (window.innerWidth <= 860) $('lx-files').classList.add('collapsed');
        });
      });
      lucide.createIcons();
    }
    function lxConfirmDelete(row, path) {
      row.classList.add('confirm');
      row.querySelector('.acts').innerHTML = '<button data-act="yes" class="danger" title="Delete"><i data-lucide="check"></i></button><button data-act="no" title="Keep"><i data-lucide="x"></i></button>';
      row.querySelector('.nm').textContent = 'Delete ' + path + '?';
      lucide.createIcons();
    }
    function lxDeleteFile(path) {
      const p = LXS.project;
      p.files = p.files.filter(f => f.path !== path);
      LXS.docs.delete(path);
      if (LXS.current === path) LXS.current = p.main;
      lxSaveSoon(); lxRenderFiles(); lxRefreshEditor(); lxScheduleCompile(50);
    }
    function lxCleanPath(name) {
      return String(name || '').replace(/\\/g, '/').replace(/^\/+/, '').split('/').filter(s => s && s !== '.' && s !== '..').join('/').replace(/[^\w.\-/ +]/g, '_').trim();
    }
    function lxUniquePath(path) {
      const p = LXS.project;
      if (!p.files.some(f => f.path === path)) return path;
      const dot = path.lastIndexOf('.'), stem = dot > 0 ? path.slice(0, dot) : path, ext = dot > 0 ? path.slice(dot) : '';
      for (let i = 2; ; i++) { const c = `${stem}-${i}${ext}`; if (!p.files.some(f => f.path === c)) return c; }
    }
    function lxInlineInput(row, value, onDone) {
      const nm = row.querySelector('.nm');
      const inp = document.createElement('input');
      inp.value = value;
      nm.replaceWith(inp);
      inp.focus();
      const dot = value.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : value.length);
      let done = false;
      const finish = (ok) => { if (done) return; done = true; const v = inp.value.trim(); if (ok && v && v !== value) onDone(v); else lxRenderFiles(); };
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); e.stopPropagation(); });
      inp.addEventListener('blur', () => finish(true));
    }
    function lxRenameFilePrompt(row, path) {
      lxInlineInput(row, path, (v) => {
        const np = lxCleanPath(v);
        if (!np || LXS.project.files.some(f => f.path === np)) { showToast('That name is already used.', 'error'); lxRenderFiles(); return; }
        const f = LXS.project.files.find(x => x.path === path);
        f.path = np; lxBump(f);
        const d = LXS.docs.get(path); if (d) { LXS.docs.delete(path); LXS.docs.set(np, d); }
        if (LXS.project.main === path) LXS.project.main = np;
        if (LXS.current === path) LXS.current = np;
        lxSaveSoon(); lxRenderFiles(); lxScheduleCompile(50);
      });
    }
    function lxNewFilePrompt() {
      if (!LXS.project) return;
      $('lx-files').classList.remove('collapsed');
      const path = lxUniquePath('chapter.tex');
      LXS.project.files.push(lxBump({ path, text: '% Include this file from the main file with \\input{file name without .tex}\n\n' }));
      lxSaveSoon();
      lxSelectFile(path);
      const row = $('lx-files-list').querySelector(`[data-path="${CSS.escape(path)}"]`);
      if (row) lxRenameFilePrompt(row, path);
    }
    async function lxAddFiles(files, { insert = false } = {}) {
      if (!LXS.project || !files.length) return;
      if (files.length === 1 && /\.zip$/i.test(files[0].name)) { await lxOpenFileAsProject(files[0]); return; }
      let lastImage = null, added = 0;
      for (const file of files) {
        let name = lxCleanPath(file.name);
        if (!name) continue;
        let bytes = new Uint8Array(await file.arrayBuffer());
        let path = name;
        if (/\.(webp|gif|bmp|heic|heif|tiff?|avif|svg)$/i.test(name)) {
          // pdfLaTeX only reads PNG/JPG/PDF: convert on the way in
          try {
            const c = await decodeImageFile(file);
            const blob = await new Promise(r => c.toBlob(r, 'image/png'));
            bytes = new Uint8Array(await blob.arrayBuffer());
            path = name.replace(/\.[^.]+$/, '.png');
          } catch (e) { /* keep the original */ }
        }
        const existing = LXS.project.files.find(f => f.path === path);
        const isText = lxIsText(path);
        if (existing) {
          if (isText) { existing.text = new TextDecoder().decode(bytes); delete existing.bytes; LXS.docs.delete(path); }
          else { existing.bytes = bytes; delete existing.text; }
          lxBump(existing);
        } else {
          LXS.project.files.push(lxBump(isText ? { path, text: new TextDecoder().decode(bytes) } : { path, bytes }));
        }
        added++;
        if (/\.(png|jpe?g|pdf)$/i.test(path)) lastImage = path;
      }
      if (!added) return;
      lxSaveSoon(); lxRenderFiles();
      if (insert && lastImage) { lxSelectFile(LXS.project.main); lxInsertFigure(lastImage); }
      else if (!insert) showToast(added === 1 ? 'File added to the project.' : `${added} files added to the project.`, 'success', 2200);
      lxScheduleCompile(100);
    }

    // ------------------------------------------------------------ drag & drop, divider, panes
    function lxSetupDrop() {
      const root = $('view-latex');
      let depth = 0;
      root.addEventListener('dragenter', (e) => { if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return; depth++; root.classList.add('dragover'); e.preventDefault(); });
      root.addEventListener('dragover', (e) => { if (Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files')) e.preventDefault(); });
      root.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) root.classList.remove('dragover'); });
      root.addEventListener('drop', async (e) => {
        depth = 0; root.classList.remove('dragover');
        const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
        if (!files.length) return;
        e.preventDefault(); e.stopPropagation();
        const overEditor = !!e.target.closest('#lx-editor-host');
        await lxAddFiles(files, { insert: overEditor && files.some(f => /\.(png|jpe?g|pdf|webp|gif)$/i.test(f.name)) });
      });
    }
    function lxApplySplit(r) {
      r = clamp(r, 0.2, 0.8);
      $('lx-edit').style.flex = `${r} 1 0`;
      $('lx-preview').style.flex = `${1 - r} 1 0`;
    }
    function lxSetupDivider() {
      const div = $('lx-divider');
      div.addEventListener('pointerdown', (e) => {
        e.preventDefault(); div.setPointerCapture(e.pointerId); div.classList.add('drag');
        const body = $('lx-body').getBoundingClientRect();
        const filesW = $('lx-files').classList.contains('collapsed') ? 0 : $('lx-files').getBoundingClientRect().width;
        const move = (ev) => { const r = (ev.clientX - body.left - filesW) / (body.width - filesW); LXS._split = clamp(r, 0.2, 0.8); lxApplySplit(LXS._split); };
        const up = () => { div.classList.remove('drag'); div.removeEventListener('pointermove', move); div.removeEventListener('pointerup', up); if (LXS._split) lxPref.set('split', LXS._split); if (LXS.cm) LXS.cm.refresh(); lxRelayoutSoon(); };
        div.addEventListener('pointermove', move); div.addEventListener('pointerup', up);
      });
      div.addEventListener('dblclick', () => { lxApplySplit(0.5); lxPref.set('split', 0.5); lxRelayoutSoon(); });
    }
    function lxSetPane(p) {
      LXS.pane = p;
      $('view-latex').dataset.pane = p;
      const b = $('lx-pane-btn');
      if (b) { b.innerHTML = `<i data-lucide="${p === 'code' ? 'eye' : 'square-pen'}"></i>`; lucide.createIcons(); }
      if (p === 'preview') lxRelayoutSoon(); else if (LXS.cm) setTimeout(() => LXS.cm.refresh(), 0);
    }
    function lxKeydown(e) {
      if (!LXS.open) return;
      const mod = e.ctrlKey || e.metaKey;
      if (e.key === 'Escape') { $('lx-menu').classList.add('hidden'); if (!$('lx-modal').classList.contains('hidden') && LXS.project) lxHideModal(); return; }
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); lxSaveNow(); lxCompileNow(); }
      else if (k === 'enter') { e.preventDefault(); lxCompileNow(); }
    }

    // ------------------------------------------------------------ menus & modals
    function lxMenu(anchor, items) {
      const m = $('lx-menu');
      m.innerHTML = items.map((it, i) => it.sep ? '<hr>' : `<button data-i="${i}"><i data-lucide="${it.icon || 'dot'}"></i><span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</button>`).join('');
      m.classList.remove('hidden');
      lucide.createIcons();
      const r = anchor.getBoundingClientRect();
      const w = m.offsetWidth, h = m.offsetHeight;
      let left = Math.min(r.right - w, window.innerWidth - w - 8); if (left < 8) left = Math.min(r.left, window.innerWidth - w - 8);
      let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
      m.style.left = Math.max(8, left) + 'px'; m.style.top = top + 'px';
      m.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => { m.classList.add('hidden'); items[+b.dataset.i].run(); }));
    }
    function lxHideModal() { $('lx-modal').classList.add('hidden'); }
    function lxShowShortcuts() {
      const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
      $('lx-modal-card').innerHTML = `<div class="flex items-center"><h3 class="flex-1">Keyboard shortcuts</h3><button class="lx-tb" data-close><i data-lucide="x"></i></button></div>
        <table class="mt-3 text-sm w-full"><tbody>
        ${[['Compile now', mod + ' + Enter'], ['Save and compile', mod + ' + S'], ['Bold / italic', mod + ' + B / ' + mod + ' + I'], ['Comment lines', mod + ' + /'], ['Find / replace', mod + ' + F / ' + mod + ' + Shift + F'], ['Indent / outdent', 'Tab / Shift + Tab'], ['Jump from the PDF to the code', 'Double-click in the preview'], ['Zoom the preview', mod + ' + mouse wheel']].map(([a, b]) => `<tr class="border-b border-slate-100"><td class="py-2">${a}</td><td class="py-2 text-right font-mono text-slate-600">${esc(b)}</td></tr>`).join('')}
        </tbody></table>`;
      $('lx-modal').classList.remove('hidden');
      lucide.createIcons();
      $('lx-modal-card').querySelector('[data-close]').addEventListener('click', lxHideModal);
    }

    // ------------------------------------------------------------ compile
    function lxScheduleCompile(delay = 500) {
      clearTimeout(LXS.timer);
      LXS.timer = setTimeout(() => lxCompileNow(), delay);
    }
    function lxEngineFiles() {
      return LXS.project.files.map(f => ({ path: f.path, data: f.bytes ? f.bytes : (f.text || ''), ver: String(f.ver || 0) }));
    }
    async function lxCompileNow() {
      clearTimeout(LXS.timer);
      if (!LXS.project || !LXS.engine) return;
      if (LXS.compiling) { LXS.queued = true; return; }
      const mainFile = LXS.project.files.find(f => f.path === LXS.project.main);
      if (!mainFile) { lxSetStatus('err', 'No main .tex file'); return; }
      LXS.compiling = true; LXS.stopRequested = false;
      lxSetCompileButton(true);
      $('lx-pbar').classList.add('on');
      lxSetStatus('busy', LXS.engine.readyPromise && LXS.engine.worker ? 'Compiling…' : 'Starting the engine…');
      let reruns = 0;
      try {
        for (;;) {
          LXS.queued = false;
          const projectId = LXS.project.id, main = LXS.project.main;
          const t0 = performance.now();
          let res;
          try {
            if (LXS.engine.projectId !== projectId) {
              // another project ran before: start from an empty work folder
              if (LXS.engine.worker) await LXS.engine.resetWork();
              LXS.engine.projectId = projectId;
            }
            res = await LXS.engine.compile(lxEngineFiles(), main, { timeoutMs: 180000 });
          } catch (e) {
            if (LXS.stopRequested) { lxSetStatus('', 'Stopped'); break; }
            console.warn(e);
            lxEngineFailed(e, !!LXS.engine.assets);
            break;
          }
          if (!LXS.project || LXS.project.id !== projectId) break;
          LXS.engineError = null;
          const ms = performance.now() - t0;
          LXS.lastLog = res.log || '';
          LXS.problems = lxParseLog(res.log || '', LXS.project.files.map(f => f.path), main);
          if (res.bibRan) LXS.bibProblems = lxParseBlg(res.blg || '');
          if (LXS.bibProblems && LXS.bibProblems.length) LXS.problems.push(...LXS.bibProblems);
          if (res.pdf) {
            LXS.pdf = new Uint8Array(res.pdf);
            LXS.lastFailed = false;
            lxShowPdf(LXS.pdf);
          } else {
            LXS.lastFailed = true;
            if (!LXS.problems.some(p => p.sev === 'err')) LXS.problems.unshift({ sev: 'err', msg: res.status === 0 ? 'No PDF was produced (is the document empty?).' : 'Compilation failed. See the log for details.', file: null, line: 0 });
          }
          // an error while reading last run's .aux/.toc (e.g. a package was
          // removed): delete those files and run once more
          const firstErr = LXS.problems.find(p => p.sev === 'err');
          if (!res.pdf && res.hadAux && !LXS._auxRetried && firstErr && /\.(aux|toc|lof|lot|out|nav|snm)$/i.test(firstErr.inFile || '')) {
            LXS._auxRetried = true;
            try { await LXS.engine.cleanAux(); } catch (e) { /* engine restarts anyway */ }
            continue;
          }
          LXS._auxRetried = false;
          lxRenderProblems();
          lxUpdatePreviewState();
          const errs = LXS.problems.filter(p => p.sev === 'err').length;
          if (res.pdf) lxSetStatus('ok', `Compiled in ${(ms / 1000).toFixed(ms < 10000 ? 2 : 1)} s`);
          else lxSetStatus('err', errs === 1 ? '1 error' : `${errs} errors`);
          const needRerun = !!res.pdf && (!res.hadAux || res.listsChanged || res.bblChanged || /Rerun to get|Rerun LaTeX|has changed\.? *Rerun|Please rerun|Please \(re\)run/i.test(res.log || ''));
          if (LXS.queued) continue;
          if (needRerun && reruns < 3) { reruns++; lxSetStatus('busy', 'Updating references…'); continue; }
          break;
        }
      } finally {
        LXS.compiling = false;
        lxSetCompileButton(false);
        $('lx-pbar').classList.remove('on');
        if (LXS.queued) { LXS.queued = false; lxScheduleCompile(10); }
      }
    }
    function lxStop() {
      LXS.stopRequested = true;
      if (LXS.engine) LXS.engine._fail(new Error('Stopped'));
    }
    function lxRestartEngine() {
      if (!LXS.engine) return;
      LXS.engine.kill();
      showToast('The TeX engine was restarted.', 'info', 2000);
      lxCompileNow();
    }
    function lxSetCompileButton(busy) {
      const b = $('lx-compile');
      b.innerHTML = busy ? '<i data-lucide="loader-circle" class="animate-spin"></i><span class="lx-desk-only">Stop</span>' : '<i data-lucide="play"></i><span class="lx-desk-only">Compile</span>';
      b.title = busy ? 'Stop compiling' : 'Compile now (Ctrl+Enter)';
      lucide.createIcons();
    }
    function lxSetStatus(kind, text) {
      const s = $('lx-status');
      if (!s) return;
      s.className = 'lx-status' + (kind ? ' ' + kind : '');
      const icon = kind === 'ok' ? 'circle-check' : kind === 'err' ? 'circle-x' : kind === 'busy' ? 'loader-circle' : 'circle-dashed';
      s.innerHTML = `<i data-lucide="${icon}"${kind === 'busy' ? ' class="animate-spin"' : ''}></i><span>${esc(text)}</span>`;
      s.title = text;
      lucide.createIcons();
    }
    function lxEngineProgress(f, label) {
      if (LXS.pdf) return;
      const card = $('lx-card');
      $('lx-empty').classList.remove('hidden');
      card.innerHTML = `<div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3"><i data-lucide="loader-circle" class="animate-spin"></i></div>
        <h4>${esc(label || 'Preparing the TeX engine…')}</h4>
        <p>pdfTeX runs right here in your browser. The engine (about 12&nbsp;MB) is downloaded once and then comes from the browser cache.</p>
        <div class="bar"><div style="width:${Math.round(f * 100)}%"></div></div>`;
      lucide.createIcons();
      lxSetStatus('busy', f >= 1 ? 'Starting the engine…' : `Loading engine ${Math.round(f * 100)}%`);
    }
    function lxEngineFailed(e, duringCompile) {
      const msg = (e && e.message) || String(e);
      LXS.engineError = duringCompile ? null : e;
      lxSetStatus('err', duringCompile ? 'Engine error' : 'Engine not loaded');
      if (!LXS.pdf) {
        $('lx-empty').classList.remove('hidden');
        $('lx-card').innerHTML = `<div class="w-11 h-11 rounded-xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3"><i data-lucide="circle-x"></i></div>
          <h4>${duringCompile ? 'The TeX engine stopped' : 'The TeX engine could not be loaded'}</h4>
          <p>${esc(msg)}</p>
          <button class="lx-primary mt-4" id="lx-retry"><i data-lucide="rotate-ccw"></i>Try again</button>`;
        lucide.createIcons();
        $('lx-retry').addEventListener('click', () => { LXS.engineError = null; LXS.engine.kill(); LXS.engine.start().then(() => lxCompileNow()).catch(err => lxEngineFailed(err)); lxEngineProgress(0); });
      } else showToast(msg, 'error', 6000);
    }
    function lxUpdatePreviewState() {
      const errs = LXS.problems.filter(p => p.sev === 'err');
      const banner = $('lx-banner');
      $('lx-pages').classList.toggle('dim', LXS.lastFailed && !!LXS.pdf);
      if (LXS.lastFailed && LXS.pdf) {
        const e = errs[0];
        $('lx-banner-text').textContent = e ? `${e.file && e.line ? (e.file === LXS.project.main ? 'Line ' + e.line : e.file + ':' + e.line) + ': ' : ''}${e.msg} — showing the last good version` : 'Showing the last good version';
        banner.classList.remove('hidden');
      } else banner.classList.add('hidden');
      if (LXS.pdf) { $('lx-empty').classList.add('hidden'); return; }
      if (LXS.lastFailed) {
        $('lx-empty').classList.remove('hidden');
        const e = errs[0];
        $('lx-card').innerHTML = `<div class="w-11 h-11 rounded-xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3"><i data-lucide="circle-x"></i></div>
          <h4>The document has an error</h4>
          <p>${e ? esc(e.msg) : 'See the problems list below the code.'}</p>
          ${e && e.hint ? `<p>${esc(e.hint)}</p>` : ''}
          ${e && e.line ? `<button class="lx-primary mt-4" id="lx-goto-err"><i data-lucide="text-cursor-input"></i>Go to line ${e.line}</button>` : ''}`;
        lucide.createIcons();
        const g = $('lx-goto-err'); if (g) g.addEventListener('click', () => lxGotoProblem(e));
      }
    }

    // ------------------------------------------------------------ log parsing
    const LX_HINTS = [
      [/^Undefined control sequence/, 'Unknown command: check the spelling, or load the package that defines it.'],
      [/^LaTeX Error: File `([^']+)' not found/, 'The file is not in the project and not in TeX Live 2020. Check the name, or upload the file.'],
      [/^Missing \$ inserted/, 'A maths symbol (like ^, _ or \\alpha) is used outside maths. Wrap it in $…$.'],
      [/^LaTeX Error: Environment (\S+) undefined/, 'Unknown environment: check the spelling or load the package that provides it.'],
      [/^LaTeX Error: \\begin\{(\S+)\} on input line (\d+) ended by \\end\{(\S+)\}/, 'An environment was closed with a different name than it was opened with.'],
      [/^Misplaced alignment tab character &/, 'An & outside a table. Write \\& for an ampersand in text.'],
      [/^LaTeX Error: There's no line here to end/, '\\\\ (line break) used where there is no line, e.g. right after a blank line.'],
      [/^File ended while scanning use of/, 'A { is never closed. Look for a missing }.'],
      [/^Extra \}, or forgotten/, 'There is a } without a matching {, or an environment is closed too early.'],
      [/^Missing \} inserted/, 'A { is never closed, or maths mode was left too early.'],
      [/^Paragraph ended before (\S+) was complete/, 'A command argument contains a blank line, or a } is missing.'],
      [/^LaTeX Error: Missing \\begin\{document\}/, 'Text was found before \\begin{document}, or the preamble has a typo.'],
      [/^LaTeX Error: Can be used only in preamble/, 'Move this command above \\begin{document}.'],
      [/^Emergency stop/, 'TeX stopped. The first error above is usually the cause.'],
      [/^Double subscript|^Double superscript/, 'Use braces: x_{ab} or x^{2n}.'],
      [/^Package inputenc Error: Unicode character (.) \(U\+([0-9A-F]+)\)/, 'This character has no definition in pdfLaTeX. Replace it or use a LaTeX command for it.'],
    ];
    function lxParseLog(log, projectPaths, main) {
      const out = [];
      if (!log) return out;
      const raw = log.replace(/\r/g, '').split('\n');
      // undo TeX's 79-column line wrapping
      const lines = [];
      for (let i = 0; i < raw.length; i++) {
        let l = raw[i];
        while (l.length >= 79 && (l.length % 79 === 0) && i + 1 < raw.length && !/^(!|l\.\d+ |\s*$)/.test(raw[i + 1]) && !/^(LaTeX|Package|Class|Overfull|Underfull)\b/.test(raw[i + 1])) l += raw[++i];
        lines.push(l);
      }
      const proj = new Set(projectPaths);
      const stack = [];
      const fileOf = () => {
        for (let k = stack.length - 1; k >= 0; k--) if (stack[k]) return stack[k];
        return null;
      };
      const projFile = () => { const f = fileOf(); return f && proj.has(f) ? f : (f ? null : main); };
      const fileRe = /^\(((?:\.\/)?[^\s(){}<>"']+?\.(?:tex|sty|cls|cfg|def|clo|fd|ldf|aux|toc|lof|lot|out|bbl|ltx|dict|mkii|nav|snm|vrb|ind|code\.tex|lbx|cbx|bbx))(?=[\s)]|$)/;
      const scanParens = (l) => {
        for (let i = 0; i < l.length; i++) {
          const ch = l[i];
          if (ch === '(') {
            const m = fileRe.exec(l.slice(i));
            if (m) { stack.push(m[1].replace(/^\.\//, '')); i += m[0].length - 1; }
            else stack.push(null);
          } else if (ch === ')') stack.pop();
        }

      const seen = new Set();
      const add = (p) => { const key = p.sev + '|' + p.msg + '|' + p.file + '|' + p.line; if (seen.has(key)) return; seen.add(key); out.push(p); };
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (l.startsWith('! ')) {
          let msg = l.slice(2).trim();
          const ctx = [];
          let line = 0;
          for (let j = i + 1; j < Math.min(lines.length, i + 30); j++) {
            const t = lines[j];
            const m = /^l\.(\d+) (.*)$/.exec(t);
            if (m) { line = +m[1]; ctx.push(m[2] + (lines[j + 1] ? '⏎' + lines[j + 1].trim() : '')); break; }
            if (j === i + 1 && /^\(\w+\)\s{2,}/.test(t)) msg += ' ' + t.replace(/^\(\w+\)\s+/, '').trim();
            if (/^<(argument|inserted text|to be read again|recently read|template|output|write|everypar|\*)>/.test(t)) ctx.push(t.trim());
          }
          if (/^==> Fatal error occurred/.test(msg)) continue;

            const cs = /(\\[A-Za-z@]+|\\.)\s*⏎/.exec(ctx[ctx.length - 1]) || /(\\[A-Za-z@]+)\s*$/.exec(ctx[ctx.length - 1].split('⏎')[0]);
            if (cs) msg = 'Undefined control sequence ' + cs[1];
          }
          let hint = '';
          for (const [re, h] of LX_HINTS) if (re.test(msg)) { hint = h; break; }
          add({ sev: 'err', msg, file: line ? projFile() : null, line, ctx: ctx.join('\n'), hint, inFile: fileOf() || '' });
          continue;
        }
        let m = /^(?:(LaTeX|Package (\S+)|Class (\S+)) (Font )?Warning: )(.*)$/.exec(l);
        if (m) {
          let msg = m[5];
          for (let j = i + 1; j < Math.min(lines.length, i + 6); j++) {
            const t = lines[j];
            if (/^\((\S+)\)\s+/.test(t) && !fileRe.test(t)) msg += ' ' + t.replace(/^\(\S+\)\s+/, '').trim(); else break;
          }
          const lm = /on input line (\d+)\.?/.exec(msg);
          const font = !!m[4] || /^Font shape/.test(msg);
          const sev = font || /^Unused global option|^Size substitutions|^You have requested package|^There were undefined references|^Label\(s\) may have changed|^There were multiply-defined labels/.test(msg) ? 'info' : 'warn';
          const pkg = m[2] || m[3] || '';
          if (/^Rerun to get|^Label\(s\) may have changed|^There were undefined references|Please rerun/i.test(msg)) { scanParens(l); continue; }
          add({ sev, msg: (pkg ? pkg + ': ' : '') + msg.replace(/\s*on input line \d+\.?/, '').trim(), file: lm ? projFile() : null, line: lm ? +lm[1] : 0, ctx: '' });
          scanParens(l);
          continue;
        }
        m = /^(Overfull|Underfull) \\([hv])box \(([^)]*)\).*?(?:at lines? (\d+)(?:--(\d+))?)?$/.exec(l);
        if (m) {
          add({ sev: 'info', msg: `${m[1]} \\${m[2]}box (${m[3]})`, file: m[4] ? projFile() : null, line: m[4] ? +m[4] : 0, ctx: '' });
          scanParens(l.replace(/\([^)]*\)/, ''));
          continue;
        }
        scanParens(l);
      }
      const order = { err: 0, warn: 1, info: 2 };
      out.sort((a, b) => order[a.sev] - order[b.sev]);
      return out;
    }
    // BibTeX's own log: missing entries, unreadable .bib files, syntax errors
    function lxParseBlg(blg) {
      const out = [];
      const lines = blg.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        let m = /^Warning--(.*)$/.exec(l);

    }
    function lxRenderProblems() {

      if (errs) parts.push(`<span class="cnt err"><i data-lucide="circle-x"></i>${errs} error${errs > 1 ? 's' : ''}</span>`);
      if (warns) parts.push(`<span class="cnt warn"><i data-lucide="triangle-alert"></i>${warns} warning${warns > 1 ? 's' : ''}</span>`);
      if (infos) parts.push(`<span class="cnt info"><i data-lucide="info"></i>${infos} note${infos > 1 ? 's' : ''}</span>`);
      $('lx-problems-sum').innerHTML = parts.length ? parts.join('') : '<span class="cnt" style="color:#047857"><i data-lucide="circle-check"></i>No problems</span>';
      const list = $('lx-problems-list');
      list.innerHTML = LXS.problems.slice(0, 200).map((p, i) => `<div class="lx-prob ${p.sev}" data-i="${i}">
          <i class="ic" data-lucide="${p.sev === 'err' ? 'circle-x' : p.sev === 'warn' ? 'triangle-alert' : 'info'}"></i>
          <div class="msg">${esc(p.msg)}${p.hint ? `<small style="font-family:inherit">${esc(p.hint)}</small>` : ''}${p.ctx ? `<small>${esc(p.ctx)}</small>` : ''}</div>
          ${p.line ? `<span class="loc">${esc(p.file && p.file !== LXS.project.main ? p.file + ':' : 'line ')}${p.line}</span>` : ''}</div>`).join('');
      list.querySelectorAll('.lx-prob').forEach(r => r.addEventListener('click', () => lxGotoProblem(LXS.problems[+r.dataset.i])));
      if (errs) { if ($('lx-problems').classList.contains('collapsed')) LXS._autoOpened = true; lxToggleProblems(true); }
      else if (LXS._autoOpened) { LXS._autoOpened = false; lxToggleProblems(false); }

      lucide.createIcons();
    }
    function lxApplyMarks() {

    }
    function lxToggleProblems(force) {

      if (LXS.cm) setTimeout(() => LXS.cm.refresh(), 0);
    }
    function lxShowRawLog(force) {

      if (pre && force !== true) { pre.remove(); return; }
      if (pre) { pre.textContent = LXS.lastLog || 'No log yet.'; return; }

    }
    function lxGotoProblem(p) {

    // ------------------------------------------------------------ preview
    async function lxShowPdf(bytes) {
      const gen = ++LXP.gen;
      let doc;
      try { doc = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise; }
      catch (e) { console.warn('Preview failed', e); return; }
      if (gen !== LXP.gen) { doc.destroy(); return; }
      const sizes = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const pg = await doc.getPage(i);
        const vp = pg.getViewport({ scale: 1 });
        sizes.push({ w: vp.width, h: vp.height });
      }
      if (gen !== LXP.gen) { doc.destroy(); return; }
      const old = LXP.doc;
      LXP.doc = doc; LXP.sizes = sizes; LXP.textCache = new Map();
      $('lx-empty').classList.add('hidden');
      lxLayoutPages();
      await lxRenderVisible();
      if (old) setTimeout(() => { try { old.destroy(); } catch (e) { /* gone */ } }, 2000);
    }
    function lxComputeScale() {
      if (!LXP.sizes.length) return 1;
      if (typeof LXS.zoom === 'number') return LXS.zoom;
      const el = $('lx-pages');
      const maxW = Math.max(...LXP.sizes.map(s => s.w)), maxH = Math.max(...LXP.sizes.map(s => s.h));
      const availW = Math.max(120, el.clientWidth - 34), availH = Math.max(120, el.clientHeight - 32);
      return clamp(LXS.zoom === 'page' ? Math.min(availW / maxW, availH / maxH) : availW / maxW, 0.15, 4);
    }
    function lxLayoutPages() {
      const inner = $('lx-pages-inner');
      const scale = lxComputeScale();
      const changed = Math.abs(scale - LXP.scale) > 1e-6;
      LXP.scale = scale;
      while (LXP.holders.length < LXP.sizes.length) {
        const d = document.createElement('div'); d.className = 'lx-page stale'; d.dataset.page = String(LXP.holders.length + 1);
        inner.appendChild(d); LXP.holders.push(d);
      }
      while (LXP.holders.length > LXP.sizes.length) LXP.holders.pop().remove();
      LXP.sizes.forEach((s, i) => {
        const d = LXP.holders[i];
        d.style.width = Math.round(s.w * scale) + 'px'; d.style.height = Math.round(s.h * scale) + 'px';
        d.dataset.key = '';
        if (changed) d.classList.add('stale');
      });
      $('lx-zoom-label').textContent = LXS.zoom === 'fit' ? 'Fit' : LXS.zoom === 'page' ? 'Page' : Math.round(scale * 100) + '%';
      lxUpdatePageInfo();
    }
    function lxVisiblePages() {
      const el = $('lx-pages');
      const top = el.scrollTop, bottom = top + el.clientHeight;
      const vis = [];
      LXP.holders.forEach((d, i) => {
        const a = d.offsetTop, b = a + d.offsetHeight;
        if (b >= top - el.clientHeight * 0.5 && a <= bottom + el.clientHeight * 0.5) vis.push({ i, dist: Math.abs((a + b) / 2 - (top + bottom) / 2) });
      });
      return vis.sort((x, y) => x.dist - y.dist).map(v => v.i);
    }
    async function lxRenderVisible() {
      const doc = LXP.doc, gen = LXP.gen;
      if (!doc) return;
      for (const i of lxVisiblePages()) {
        if (gen !== LXP.gen) return;
        await lxRenderPage(i, doc, gen);
      }
    }
    async function lxRenderPage(i, doc, gen) {
      const holder = LXP.holders[i];
      if (!holder) return;
      const scale = LXP.scale;
      const key = `${gen}:${scale.toFixed(4)}`;
      if (holder.dataset.key === key || LXP.busy.has(i + '|' + key)) return;
      LXP.busy.add(i + '|' + key);
      try {
        const pg = await doc.getPage(i + 1);
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        const base = pg.getViewport({ scale });
        if (base.width * base.height * dpr * dpr > 14e6) dpr = Math.max(0.5, Math.sqrt(14e6 / (base.width * base.height)));
        const vp = pg.getViewport({ scale: scale * dpr });
        const c = document.createElement('canvas');
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        await pg.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp }).promise;
        if (gen !== LXP.gen || scale !== LXP.scale) return;
        const old = holder.querySelector('canvas');
        if (old) old.replaceWith(c); else holder.appendChild(c);
        holder.dataset.key = key;
        holder.classList.remove('stale');
      } catch (e) {
        if (!/cancel|destroy/i.test(String(e && e.message))) console.warn('Page render failed', e);
      } finally { LXP.busy.delete(i + '|' + key); }
    }
    function lxOnPreviewScroll() {
      if (LXP.raf) return;
      LXP.raf = requestAnimationFrame(() => { LXP.raf = 0; lxUpdatePageInfo(); lxRenderVisible(); });
    }
    function lxUpdatePageInfo() {
      const el = $('lx-pages');
      const n = LXP.holders.length;
      if (!n) { $('lx-pinfo').textContent = '—'; return; }
      const mid = el.scrollTop + el.clientHeight / 3;
      let cur = 1;
      LXP.holders.forEach((d, i) => { if (d.offsetTop <= mid) cur = i + 1; });
      $('lx-pinfo').textContent = `Page ${cur} / ${n}`;
    }
    function lxRelayoutSoon() {
      clearTimeout(LXP.relayoutTimer);
      LXP.relayoutTimer = setTimeout(() => {
        if (!LXS.open || !LXP.doc) return;
        const el = $('lx-pages');
        const ratio = el.scrollHeight ? el.scrollTop / el.scrollHeight : 0;
        lxLayoutPages();
        el.scrollTop = ratio * el.scrollHeight;
        lxRenderVisible();
      }, 120);
    }
    const LX_ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
    function lxSetZoom(z) {
      LXS.zoom = z;
      lxPref.set('zoom', z);
      const el = $('lx-pages');
      const ratio = el.scrollHeight ? el.scrollTop / el.scrollHeight : 0;
      lxLayoutPages();
      el.scrollTop = ratio * el.scrollHeight;
      lxRenderVisible();
    }
    function lxZoomStep(dir) {
      const cur = LXP.scale || 1;
      let next = dir > 0 ? LX_ZOOMS.find(z => z > cur + 0.01) : [...LX_ZOOMS].reverse().find(z => z < cur - 0.01);
      if (!next) next = dir > 0 ? LX_ZOOMS[LX_ZOOMS.length - 1] : LX_ZOOMS[0];

    }
    async function lxPageText(i) {
      if (!LXP.doc) return null;
      if (!LXP.textCache.has(i)) LXP.textCache.set(i, LXP.doc.getPage(i + 1).then(pg => pg.getTextContent().then(tc => ({ tc, vp: pg.getViewport({ scale: 1 }) }))));
      return LXP.textCache.get(i);
    }
    // double-click in the PDF: find the clicked words in the source
    async function lxPreviewDblClick(e) {
      const holder = e.target.closest('.lx-page');
      if (!holder || !LXS.project) return;
      const i = LXP.holders.indexOf(holder);
      const r = holder.getBoundingClientRect();
      const x = (e.clientX - r.left) / LXP.scale, y = (e.clientY - r.top) / LXP.scale;
      const data = await lxPageText(i);
      if (!data) return;
      let best = null, bestD = Infinity;
      for (const it of data.tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const [vx, vy] = data.vp.convertToViewportPoint(it.transform[4], it.transform[5]);
        const fs = Math.hypot(it.transform[2], it.transform[3]) || 10;
        const w = it.width || fs * it.str.length * 0.5;
        const dx = x < vx ? vx - x : x > vx + w ? x - (vx + w) : 0;
        const dy = y < vy - fs ? vy - fs - y : y > vy + fs * 0.3 ? y - (vy + fs * 0.3) : 0;
        const d = dx + dy * 2;
        if (d < bestD) { bestD = d; best = { it, vx, w }; }
      }
      if (!best || bestD > 30) return;
      const str = best.it.str;
      const pos = clamp(Math.round((x - best.vx) / best.w * str.length), 0, str.length);
      const words = str.split(/\s+/).filter(Boolean);
      let acc = 0, wi = 0;
      for (let k = 0; k < words.length; k++) { const at = str.indexOf(words[k], acc); if (at <= pos) wi = k; acc = at + words[k].length; }
      const clean = (w) => w.replace(/[^\p{L}\p{N}]+/gu, '');
      const target = clean(words[wi] || '');
      const neighbours = words.slice(Math.max(0, wi - 3), wi + 4).map(clean).filter(w => w.length > 2);
      let hit = null, hitScore = 0;
      for (const f of LXS.project.files) {
        if (f.bytes || !/\.tex$/i.test(f.path)) continue;
        const lines = (f.text || '').split('\n');
        lines.forEach((ln, li) => {
          if (/^\s*%/.test(ln)) return;
          let score = 0;
          if (target.length > 1 && ln.includes(target)) score += 3;
          for (const w of neighbours) if (ln.includes(w)) score += 1;
          if (score > hitScore) { hitScore = score; hit = { path: f.path, line: li + 1, ch: Math.max(0, ln.indexOf(target)) }; }
        });
      }
      if (!hit || hitScore < 2) { showToast('Could not find that text in the source.', 'info', 1800); return; }
      if (LXS.current !== hit.path) lxSelectFile(hit.path);
      if (window.innerWidth <= 860) lxSetPane('code');
      LXS.ed.goto(hit.line, hit.ch);
    }

    // ------------------------------------------------------------ downloads
    function lxFileName(ext) { return (LXS.project && LXS.project.name || 'document').replace(/[\\/:*?"<>|]+/g, '_').trim() + ext; }
    function lxDownloadPdf() {

      if (LXS.lastFailed) showToast('The latest changes have an error: this is the last version that compiled.', 'info', 4000);

    }
    function lxDownloadTex() {

      if (!f) return;

    async function lxDownloadZip() {

    // ------------------------------------------------------------ projects (IndexedDB)
    const LX_DB = { name: 'pdfstudio-latex', store: 'projects' };
    function lxDb() {
      return new Promise((res, rej) => {
        let req;
        try { req = indexedDB.open(LX_DB.name, 1); } catch (e) { rej(e); return; }
        req.onupgradeneeded = () => req.result.createObjectStore(LX_DB.store, { keyPath: 'id' });
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function lxDbOp(mode, fn) {
      const db = await lxDb();
      return new Promise((res, rej) => {
        const tx = db.transaction(LX_DB.store, mode), st = tx.objectStore(LX_DB.store);
        const r = fn(st);
        tx.oncomplete = () => { res(r && 'result' in r ? r.result : undefined); db.close(); };
        tx.onerror = () => { rej(tx.error); db.close(); };
      });
    }
    const lxDbGet = (id) => lxDbOp('readonly', st => st.get(id));
    const lxDbAll = () => lxDbOp('readonly', st => st.getAll());
    const lxDbPut = (p) => lxDbOp('readwrite', st => st.put(p));
    const lxDbDelete = (id) => lxDbOp('readwrite', st => st.delete(id));
    function lxSaveSoon() {
      LXS.dirty = true;
      $('lx-saved').textContent = 'Saving…';
      clearTimeout(LXS.saveTimer);
      LXS.saveTimer = setTimeout(() => lxSaveNow().catch(e => console.warn('Autosave failed', e)), 700);
    }
    async function lxSaveNow() {
      clearTimeout(LXS.saveTimer);
      const p = LXS.project;
      if (!p) return;
      p.updated = Date.now();
      const rec = { id: p.id, name: p.name, main: p.main, created: p.created, updated: p.updated, files: p.files.map(f => f.bytes ? { path: f.path, bytes: f.bytes } : { path: f.path, text: f.text || '' }) };
      try {
        await lxDbPut(rec);
        LXS.dirty = false;
        lxPref.set('last', p.id);
        const el = $('lx-saved'); if (el) el.textContent = 'Saved';
      } catch (e) {
        const el = $('lx-saved'); if (el) el.textContent = 'Not saved';
        throw e;
      }
    }
    function lxLoadProject(rec) {

    async function latexFileToPdfBytes(file) {
      const eng = lxEnsureEngine();
      const before = eng.onProgress;
      eng.onProgress = (f, label) => { try { progress.set(f * 0.8, label); } catch (e) { /* no modal */ } if (before) before(f, label); };
      try {
        const text = await file.text();
        if (eng.worker) await eng.resetWork();
        eng.projectId = '__batch:' + file.name;
        const files = [{ path: 'main.tex', data: text, ver: 'batch:' + (++LX_VER) }];
        let res = null;
        for (let run = 0; run < 4; run++) {
          res = await eng.compile(files, 'main.tex', { timeoutMs: 180000 });
          if (!res.pdf || !(!res.hadAux || res.listsChanged || res.bblChanged || /Rerun to get|Rerun LaTeX|Please rerun/i.test(res.log || ''))) break;
        }
        if (!res.pdf) {
          const p = lxParseLog(res.log || '', ['main.tex'], 'main.tex').find(x => x.sev === 'err');
          throw new Error(`${file.name}: ${p ? p.msg + (p.line ? ` (line ${p.line})` : '') : 'LaTeX compilation failed'}`);

        return new Uint8Array(res.pdf);
      } finally { eng.onProgress = before; }

\section*{Problem 1}
Show that $\displaystyle\sum_{k=1}^{n} k = \frac{n(n+1)}{2}$ for every $n \in \N$.

\begin{solution}
By induction on $n$. For $n = 1$ both sides equal $1$. Assume the formula
holds for $n$. Then
\begin{align*}
  \sum_{k=1}^{n+1} k &= \frac{n(n+1)}{2} + (n+1) \\
                     &= \frac{(n+1)(n+2)}{2},
\end{align*}
which is the formula for $n+1$.
\end{solution}

\section*{Problem 2}
Let $f\colon \R \to \R$, $f(x) = x^3 - 3x$.
\begin{enumerate}[label=(\alph*)]
  \item Find the critical points of $f$.
  \item Decide which of them are local maxima or minima.
\end{enumerate}

\begin{solution}
\begin{enumerate}[label=(\alph*)]
  \item $f'(x) = 3x^2 - 3 = 0 \iff x = \pm 1$.
  \item $f''(x) = 6x$, so $x = -1$ is a local maximum and $x = 1$ a local minimum.
\end{enumerate}
\end{solution}
