<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Break Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .no-select { -webkit-user-select: none; user-select: none; }
        .grid-compact { grid-template-columns: 85px repeat(12, minmax(0, 1fr)); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col no-select">

    <!-- Header App Bar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/50 sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-lg font-bold tracking-wide text-slate-200">BreakPlanner <span class="text-xs text-slate-400 font-normal">v3.1</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="userBadge" class="bg-slate-700/60 border border-slate-600/50 px-3 py-1 rounded-full text-xs font-semibold text-emerald-400 shadow-inner">
                Connecting...
            </div>
        </div>
    </header>

    <!-- Main Dynamic Workspace -->
    <main class="flex-1 p-3 max-w-7xl w-full mx-auto space-y-4">
        
        <!-- Useful Links Bar Dashboard Panel -->
        <div class="bg-slate-800/40 border border-slate-700/30 rounded-2xl p-3 shadow-xl">
            <div class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2 px-1 flex items-center gap-1.5">
                🔗 Useful Links Menu
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                <a href="https://kronos8.nac.sitel-world.net/wfc/logon" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between shadow-sm group">
                    <span>Kronos</span>
                    <span class="text-slate-500 group-hover:text-slate-400 text-[10px]">↗</span>
                </a>
                <a href="https://www.foundever.es/mifoundever/Account/Login" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between shadow-sm group">
                    <span>My Foundever ES</span>
                    <span class="text-slate-500 group-hover:text-slate-400 text-[10px]">↗</span>
                </a>
                <a href="https://agentmail.emea.foundever.com/carbonio" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between shadow-sm group">
                    <span>EMEA Mail</span>
                    <span class="text-slate-500 group-hover:text-slate-400 text-[10px]">↗</span>
                </a>
                <a href="https://www.foundever.es/mifoundever/Schedule" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between shadow-sm group">
                    <span>Horarios</span>
                    <span class="text-slate-500 group-hover:text-slate-400 text-[10px]">↗</span>
                </a>
                <a href="https://www.50plus.de/spiele.html" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between shadow-sm group">
                    <span>50plus</span>
                    <span class="text-slate-500 group-hover:text-slate-400 text-[10px]">↗</span>
                </a>
                <!-- Copy Network Path helper for local shared folders inside browser containers -->
                <button onclick="copyNetworkPath()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition flex items-center justify-between text-left shadow-sm group relative">
                    <span id="cuposText">Cupos Holidays</span>
                    <span id="cuposIcon" class="text-slate-500 group-hover:text-slate-400 text-[10px]">📋</span>
                </button>
            </div>
        </div>
        
        <!-- Quick Status Control Panel -->
        <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-4 shadow-xl flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2">
                <button id="btnBreak" onclick="toggleActiveStatus('__active_break__', '☕ Break', 'bg-amber-500/20 text-amber-400 border-amber-500/30')" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/60 text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95">
                    <span id="breakDot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                    <span id="breakText">Start Break</span>
                </button>
                <button onclick="toggleQuickStatus('__wc__', '🚽 WC', 'bg-blue-500/20 text-blue-400 border-blue-500/30')" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/60 text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95">
                    <span>🚽</span> Toilet Quick
                </button>
                <button onclick="toggleQuickStatus('__water__', '💧 Water', 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30')" class="px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/60 text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95">
                    <span>💧</span> Water Quick
                </button>
            </div>
            
            <!-- Live Active Feed Grid -->
            <div id="liveStatusContainer" class="flex flex-wrap gap-2 text-xs">
                <!-- Status blocks pop up here instantly -->
            </div>
        </div>

        <!-- Master Matrix Timeline Scheduler -->
        <div class="bg-slate-800/40 border border-slate-700/30 rounded-2xl p-3 shadow-xl overflow-hidden">
            <!-- Timeline Header Column Matrix Titles -->
            <div class="grid grid-compact gap-1 pb-2 border-b border-slate-700/40 text-[10px] font-bold tracking-wider text-slate-400 uppercase text-center items-center">
                <div class="text-left pl-2">Timeline</div>
                <div>00</div><div>05</div><div>10</div><div>15</div><div>20</div><div>25</div><div>30</div><div>35</div><div>40</div><div>45</div><div>50</div><div>55</div>
            </div>

            <!-- Scrollable Slots Container -->
            <div id="timelineGrid" class="divide-y divide-slate-800/60 max-h-[60vh] overflow-y-auto pr-1 mt-1">
                <!-- Interactive rows generated dynamically by js entry scripts -->
            </div>
        </div>
    </main>

    <!-- Global App Control Footer Metrics Status Bar -->
    <footer class="bg-slate-900 border-t border-slate-800/80 px-4 py-2.5 text-xs text-slate-400 flex items-center justify-between">
        <div id="connectionStatus" class="flex items-center gap-1.5 text-emerald-400">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> System Synchronized
        </div>
        <div id="metricsFooter" class="font-medium">Active Workers: 0 / 100</div>
    </footer>

    <!-- Core App Application Scripts Matrix Routing Systems -->
    <script>
        const WORKER_URL = "https://breakplanner-backend.tortrix03.workers.dev";
        
        // Grab credentials from local environment configuration maps
        let username = localStorage.getItem('bp_username');
        while (!username || username.trim() === "" || username.startsWith("__")) {
            username = prompt("Please entry your official identification signature name (e.g. John, Sarah):");
            if (username) {
                username = username.trim();
                localStorage.setItem('bp_username', username);
            }
        }
        document.getElementById('userBadge').innerText = `User: ${username}`;

        // Helper to handle the P:\ local drive mapping constraints
        function copyNetworkPath() {
            const path = "P:\\01_Agents\\WFM HOLIDAYS - DLF\\CUPOS HOLIDAYS";
            navigator.clipboard.writeText(path).then(() => {
                const textEl = document.getElementById('cuposText');
                const iconEl = document.getElementById('cuposIcon');
                
                textEl.innerText = "Path Copied!";
                iconEl.innerText = "✅";
                
                setTimeout(() => {
                    textEl.innerText = "Cupos Holidays";
                    iconEl.innerText = "📋";
                }, 2000);
            });
        }

        // Generate Time Slot Strings 07:00 through 19:45
        const hours = Array.from({length: 13}, (_, i) => i + 7); 
        const intervals = ["00", "05", "10", "15", "20", "25", "30", "35", "40", "45", "50", "55"];
        const timeSlots = [];
        hours.forEach(h => {
            const padH = String(h).padStart(2, '0');
            intervals.forEach(m => timeSlots.push(`${padH}:${m}`));
        });

        let appState = {};
        let isDragging = false;
        let dragMode = true; 

        // Generate Core Grid DOM Tree Rendering Systems
        const gridContainer = document.getElementById('timelineGrid');
        timeSlots.forEach(slot => {
            const row = document.createElement('div');
            row.className = "grid grid-compact gap-1 py-1.5 items-center border-b border-slate-800/30 hover:bg-slate-800/20 transition duration-150";
            row.dataset.slot = slot;

            const label = document.createElement('div');
            label.className = "text-xs font-bold text-slate-300 pl-2 tracking-tight cursor-pointer flex flex-col justify-center";
            label.innerHTML = `<span>${slot}</span><span class="text-[9px] text-slate-500 font-normal limit-indicator" id="limit-label-${slot}">Limit: 3</span>`;
            
            label.addEventListener('dblclick', () => toggleSlotLimit(slot));
            row.appendChild(label);

            for(let index = 0; index < 12; index++) {
                const block = document.createElement('div');
                block.className = "h-7 rounded-md bg-slate-800 border border-slate-700/40 cursor-pointer transition-all duration-100 shadow-sm relative overflow-hidden flex items-center justify-center text-[9px] font-bold";
                block.dataset.slot = slot;
                block.dataset.index = index;

                block.addEventListener('mousedown', (e) => startDrag(slot, index, block));
                block.addEventListener('mouseenter', () => handleDragEnter(slot, index, block));
                
                row.appendChild(block);
            }
            gridContainer.appendChild(row);
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        gridContainer.addEventListener('touchstart', (e) => {
            const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            if (target && target.dataset.index !== undefined) {
                e.preventDefault();
                startDrag(target.dataset.slot, parseInt(target.dataset.index), target);
            }
        }, {passive: false});

        gridContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            if (target && target.dataset.index !== undefined) {
                e.preventDefault();
                handleDragEnter(target.dataset.slot, parseInt(target.dataset.index), target);
            }
        }, {passive: false});

        gridContainer.addEventListener('touchend', () => { isDragging = false; });

        function startDrag(slot, index, element) {
            isDragging = true;
            const key = `${slot}-${index}`;
            const currentArr = appState[username] || [];
            dragMode = !currentArr.includes(key); 
            toggleBlock(slot, index, element);
        }

        function handleDragEnter(slot, index, element) {
            if (!isDragging) return;
            toggleBlock(slot, index, element);
        }

        function toggleBlock(slot, index, element) {
            const key = `${slot}-${index}`;
            let currentArr = appState[username] || [];

            if (dragMode && !currentArr.includes(key)) {
                currentArr.push(key);
            } else if (!dragMode && currentArr.includes(key)) {
                currentArr = currentArr.filter(item => item !== key);
            }

            appState[username] = currentArr;
            renderLocalFeedback();
            saveStateToDatabase();
        }

        function toggleQuickStatus(type, labelText, styles) {
            const key = `${username}${type}`;
            let currentArr = appState[key] || [];
            
            if (currentArr.length > 0) {
                currentArr = [];
            } else {
                currentArr = [labelText, styles];
            }
            
            appState[key] = currentArr;
            renderLocalFeedback();
            saveStateToDatabase(key, currentArr);
        }

        function toggleActiveStatus(type, labelText, styles) {
            const key = `__active_break__${username}`;
            let currentArr = appState[key] || [];
            
            if (currentArr.length > 0) {
                currentArr = [];
            } else {
                currentArr = [labelText, styles];
            }
            
            appState[key] = currentArr;
            renderLocalFeedback();
            saveStateToDatabase(key, currentArr);
        }

        function toggleSlotLimit(slot) {
            if (username.toLowerCase() !== 'admin') {
                alert("Authorization Denied: Only Admin credentials can overwrite slot thresholds.");
                return;
            }
            let currentLimits = appState['__limits__'] || [];
            
            if (!currentLimits.includes(`${slot}-1`) && !currentLimits.includes(`${slot}-2`)) {
                currentLimits.push(`${slot}-1`);
            } else if (currentLimits.includes(`${slot}-1`)) {
                currentLimits = currentLimits.filter(i => i !== `${slot}-1`);
                currentLimits.push(`${slot}-2`);
            } else {
                currentLimits = currentLimits.filter(i => i !== `${slot}-2`);
            }

            appState['__limits__'] = currentLimits;
            renderLocalFeedback();
            saveStateToDatabase('__limits__', currentLimits);
        }

        async function saveStateToDatabase(customUser, customData) {
            const targetUser = customUser || username;
            const targetData = customData || appState[username] || [];

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: targetUser, selectedSlots: targetData })
                });
                if (!response.ok) throw new Error("Sync failure anomaly caught");
            } catch (err) {
                document.getElementById('connectionStatus').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Connection Offline`;
                document.getElementById('connectionStatus').className = "flex items-center gap-1.5 text-rose-400";
            }
        }

        async function fetchStateFromDatabase() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) throw new Error("Fetch stream parsing exception");
                const res = await response.json();
                
                appState = res.data || {};
                document.getElementById('metricsFooter').innerText = `Active Workers: ${res.userCount || 0}`;
                document.getElementById('connectionStatus').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> System Synchronized`;
                document.getElementById('connectionStatus').className = "flex items-center gap-1.5 text-emerald-400";
                
                renderLocalFeedback();
            } catch (err) {
                document.getElementById('connectionStatus').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Latency Reconnect Sync`;
                document.getElementById('connectionStatus').className = "flex items-center gap-1.5 text-amber-400";
            }
        }

        function renderLocalFeedback() {
            const allBlocks = gridContainer.querySelectorAll('[data-index]');
            const slotUserCountMap = {};
            const limitsArray = appState['__limits__'] || [];

            const myBreakKey = `__active_break__${username}`;
            const isCurrentlyOnBreak = appState[myBreakKey] && appState[myBreakKey].length > 0;
            const breakDot = document.getElementById('breakDot');
            const breakText = document.getElementById('breakText');
            
            if (isCurrentlyOnBreak) {
                breakDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
                breakText.innerText = "End Break";
                breakText.parentElement.className = "px-4 py-2.5 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95";
            } else {
                breakDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                breakText.innerText = "Start Break";
                breakText.parentElement.className = "px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/60 text-sm font-medium transition flex items-center gap-2 shadow-sm active:scale-95";
            }

            Object.keys(appState).forEach(user => {
                if (user.startsWith("__")) return;
                const selections = appState[user] || [];
                selections.forEach(key => {
                    slotUserCountMap[key] = (slotUserCountMap[key] || 0) + 1;
                });
            });

            const liveStatusContainer = document.getElementById('liveStatusContainer');
            liveStatusContainer.innerHTML = '';
            
            Object.keys(appState).forEach(key => {
                if ((key.includes('__wc__') || key.includes('__water__') || key.startsWith('__active_break__')) && appState[key].length > 0) {
                    let displayUser = key.replace('__wc__', '').replace('__water__', '').replace('__active_break__', '');
                    const [label, styles] = appState[key];
                    
                    const badge = document.createElement('div');
                    badge.className = `px-3 py-1.5 rounded-xl border font-semibold text-center shadow-md ${styles}`;
                    badge.innerText = `${displayUser}: ${label}`;
                    liveStatusContainer.appendChild(badge);
                }
            });

            allBlocks.forEach(block => {
                const slot = block.dataset.slot;
                const idx = block.dataset.index;
                const key = `${slot}-${idx}`;

                let currentMaxLimit = 3;
                if (limitsArray.includes(`${slot}-1`)) currentMaxLimit = 1;
                else if (limitsArray.includes(`${slot}-2`)) currentMaxLimit = 2;

                const limitIndicatorLabel = document.getElementById(`limit-label-${slot}`);
                if (limitIndicatorLabel) {
                    limitIndicatorLabel.innerText = `Limit: ${currentMaxLimit}`;
                    limitIndicatorLabel.className = currentMaxLimit < 3 ? "text-[9px] text-amber-400 font-bold tracking-wide limit-indicator" : "text-[9px] text-slate-500 font-normal limit-indicator";
                }

                const parallelUsersCount = slotUserCountMap[key] || 0;
                const iHaveSelectedThis = appState[username] && appState[username].includes(key);

                block.className = "h-7 rounded-md border text-[9px] font-bold flex items-center justify-center transition-all duration-100 shadow-sm relative overflow-hidden";
                block.innerText = "";

                if (iHaveSelectedThis) {
                    block.classList.add("bg-sky-500", "border-sky-400", "text-white", "shadow-sky-500/20");
                    block.innerText = "ME";
                } else if (parallelUsersCount > 0) {
                    if (parallelUsersCount >= currentMaxLimit) {
                        block.classList.add("bg-rose-500/20", "border-rose-500/40", "text-rose-400");
                        block.innerText = `FULL (${parallelUsersCount})`;
                    } else {
                        block.classList.add("bg-emerald-500/20", "border-emerald-500/30", "text-emerald-400");
                        block.innerText = `TAKEN (${parallelUsersCount})`;
                    }
                } else {
                    block.classList.add("bg-slate-800/80", "border-slate-700/40", "text-transparent");
                }
            });
        }

        fetchStateFromDatabase();
        setInterval(fetchStateFromDatabase, 10000);
    </script>
</body>
</html>
