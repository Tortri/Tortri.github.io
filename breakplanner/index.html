<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .time-slot-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 2px;
        }
        /* Hide scrollbars to keep synchronized movement perfectly flush */
        .sync-scroll::-webkit-scrollbar {
            display: none;
        }
        .sync-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-7xl mx-auto mb-4 p-4 bg-white rounded-lg shadow-md border border-gray-200">
        <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">🔗 Useful Links</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <a href="https://kronos8.nac.sitel-world.net/wfc/logon" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block">
                Kronos ↗
            </a>
            <a href="https://www.foundever.es/mifoundever/Account/Login" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block">
                My Foundever ES ↗
            </a>
            <a href="https://agentmail.emea.foundever.com/carbonio" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block">
                EMEA Mail ↗
            </a>
            <a href="https://www.foundever.es/mifoundever/Schedule" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block">
                Horarios ↗
            </a>
            <a href="https://www.50plus.de/spiele.html" target="_blank" rel="noopener noreferrer" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block">
                50plus ↗
            </a>
            <button onclick="copyNetworkPath()" class="p-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded text-center text-xs font-semibold border border-gray-300 transition block w-full">
                <span id="cuposText">Cupos Holidays</span> <span id="cuposIcon">📋</span>
            </button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 space-y-6">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Edit Grid</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Select User:</label>
                <select id="userSelect" onchange="handleUserChange()" class="w-full p-2 border border-gray-300 rounded bg-gray-50 text-gray-800 font-medium">
                    <option value="">-- Choose your Name --</option>
                    <option value="Agent 1">Agent 1</option>
                    <option value="Agent 2">Agent 2</option>
                    <option value="Agent 3">Agent 3</option>
                    <option value="Agent 4">Agent 4</option>
                    <option value="Agent 5">Agent 5</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <div class="flex flex-wrap gap-2 pt-2">
                <button id="btnBreak" onclick="toggleActiveStatus('__active_break__', '☕ Break', 'bg-amber-100 text-amber-800 border-amber-300')" class="px-4 py-2 rounded font-semibold text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 border border-gray-300 transition">
                    ☕ Start Break
                </button>
                <button onclick="toggleQuickStatus('__wc__', '🚽 WC', 'bg-blue-100 text-blue-800 border-blue-300')" class="px-4 py-2 rounded font-semibold text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 border border-gray-300 transition">
                    🚽 Toilet Quick
                </button>
                <button onclick="toggleQuickStatus('__water__', '💧 Water', 'bg-cyan-100 text-cyan-800 border-cyan-300')" class="px-4 py-2 rounded font-semibold text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 border border-gray-300 transition">
                    💧 Water Quick
                </button>
            </div>

            <div class="border border-gray-300 rounded overflow-hidden">
                <div id="editorGridContainer" onscroll="syncScroll(this, 'viewerGridContainer')" class="sync-scroll max-h-[60vh] overflow-y-auto divide-y divide-gray-200">
                    </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 space-y-4">
            <div class="flex items-center justify-between border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">See Others</h2>
                <span id="syncBadge" class="text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-semibold">Synced</span>
            </div>

            <div id="liveStatusContainer" class="flex flex-wrap gap-2 min-h-[36px] p-2 bg-gray-50 border border-dashed border-gray-300 rounded">
                </div>

            <div class="border border-gray-300 rounded overflow-hidden">
                <div id="viewerGridContainer" onscroll="syncScroll(this, 'editorGridContainer')" class="sync-scroll max-h-[60vh] overflow-y-auto divide-y divide-gray-200">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://breakplanner-backend.tortrix03.workers.dev";
        
        let username = "";
        let appState = {};
        let isDragging = false;
        let dragMode = true;
        let isSyncing = false;

        // Dual Synchronized Scroll Mechanism Logic Handler
        function syncScroll(scrolledElement, targetId) {
            if (isSyncing) {
                isSyncing = false;
                return;
            }
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
                isSyncing = true;
                targetElement.scrollTop = scrolledElement.scrollTop;
            }
        }

        function handleUserChange() {
            username = document.getElementById('userSelect').value;
            renderLocalFeedback();
        }

        function copyNetworkPath() {
            const path = "P:\\01_Agents\\WFM HOLIDAYS - DLF\\CUPOS HOLIDAYS";
            navigator.clipboard.writeText(path).then(() => {
                const textEl = document.getElementById('cuposText');
                const iconEl = document.getElementById('cuposIcon');
                textEl.innerText = "Path Copied!";
                iconEl.innerText = "✅";
                setTimeout(() => {
                    textEl.innerText = "Cupos Holidays";
                    iconEl.innerText = "📋";
                }, 2000);
            });
        }

        // Generate Master Intervals Time Scales Array (07:00 -> 19:55)
        const hours = Array.from({length: 13}, (_, i) => i + 7);
        const intervals = ["00", "05", "10", "15", "20", "25", "30", "35", "40", "45", "50", "55"];
        const timeSlots = [];
        hours.forEach(h => {
            const padH = String(h).padStart(2, '0');
            intervals.forEach(m => timeSlots.push(`${padH}:${m}`));
        });

        const editorContainer = document.getElementById('editorGridContainer');
        const viewerContainer = document.getElementById('viewerGridContainer');

        // Build Rows for Both Sides Synchronously
        timeSlots.forEach(slot => {
            // 1. Build Left Side (Editor)
            const eRow = document.createElement('div');
            eRow.className = "grid grid-cols-12 items-center p-1.5 hover:bg-gray-50";
            
            const eLabel = document.createElement('div');
            eLabel.className = "col-span-3 text-xs font-bold text-gray-700 flex flex-col cursor-pointer";
            eLabel.innerHTML = `<span>${slot}</span><span class="text-[9px] text-gray-400 font-normal" id="limit-label-${slot}">Limit: 3</span>`;
            eLabel.addEventListener('dblclick', () => toggleSlotLimit(slot));
            eRow.appendChild(eLabel);

            const eGrid = document.createElement('div');
            eGrid.className = "col-span-9 time-slot-grid";

            // 2. Build Right Side (Viewer)
            const vRow = document.createElement('div');
            vRow.className = "grid grid-cols-12 items-center p-1.5 hover:bg-gray-50";
            
            const vLabel = document.createElement('div');
            vLabel.className = "col-span-3 text-xs font-bold text-gray-500";
            vLabel.innerText = slot;
            vRow.appendChild(vLabel);

            const vGrid = document.createElement('div');
            vGrid.className = "col-span-9 time-slot-grid";

            for(let index = 0; index < 12; index++) {
                // Interactive Editor Block
                const eBlock = document.createElement('div');
                eBlock.className = "h-6 border border-gray-300 bg-white cursor-pointer rounded-sm transition-all";
                eBlock.dataset.slot = slot;
                eBlock.dataset.index = index;
                eBlock.addEventListener('mousedown', (e) => startDrag(slot, index, eBlock));
                eBlock.addEventListener('mouseenter', () => handleDragEnter(slot, index, eBlock));
                eGrid.appendChild(eBlock);

                // Static Viewer Block
                const vBlock = document.createElement('div');
                vBlock.className = "h-6 border border-gray-200 bg-gray-50 rounded-sm text-[9px] font-bold flex items-center justify-center transition-all";
                vBlock.id = `view-${slot}-${index}`;
                vGrid.appendChild(vBlock);
            }

            eRow.appendChild(eGrid);
            vRow.appendChild(vGrid);
            editorContainer.appendChild(eRow);
            viewerContainer.appendChild(vRow);
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        function startDrag(slot, index, element) {
            if (!username) { alert("Please select your name first."); return; }
            isDragging = true;
            const key = `${slot}-${index}`;
            const currentArr = appState[username] || [];
            dragMode = !currentArr.includes(key);
            toggleBlock(slot, index, element);
        }

        function handleDragEnter(slot, index, element) {
            if (!isDragging || !username) return;
            toggleBlock(slot, index, element);
        }

        function toggleBlock(slot, index, element) {
            const key = `${slot}-${index}`;
            let currentArr = appState[username] || [];

            if (dragMode && !currentArr.includes(key)) {
                currentArr.push(key);
            } else if (!dragMode && currentArr.includes(key)) {
                currentArr = currentArr.filter(item => item !== key);
            }

            appState[username] = currentArr;
            renderLocalFeedback();
            saveStateToDatabase();
        }

        function toggleQuickStatus(type, labelText, styles) {
            if (!username) { alert("Please select your name first."); return; }
            const key = `${username}${type}`;
            let currentArr = appState[key] || [];
            appState[key] = currentArr.length > 0 ? [] : [labelText, styles];
            renderLocalFeedback();
            saveStateToDatabase(key, appState[key]);
        }

        function toggleActiveStatus(type, labelText, styles) {
            if (!username) { alert("Please select your name first."); return; }
            const key = `__active_break__${username}`;
            let currentArr = appState[key] || [];
            appState[key] = currentArr.length > 0 ? [] : [labelText, styles];
            renderLocalFeedback();
            saveStateToDatabase(key, appState[key]);
        }

        function toggleSlotLimit(slot) {
            if (username.toLowerCase() !== 'admin') {
                alert("Only Admin accounts can adjust row layout limits.");
                return;
            }
            let currentLimits = appState['__limits__'] || [];
            if (!currentLimits.includes(`${slot}-1`) && !currentLimits.includes(`${slot}-2`)) {
                currentLimits.push(`${slot}-1`);
            } else if (currentLimits.includes(`${slot}-1`)) {
                currentLimits = currentLimits.filter(i => i !== `${slot}-1`);
                currentLimits.push(`${slot}-2`);
            } else {
                currentLimits = currentLimits.filter(i => i !== `${slot}-2`);
            }
            appState['__limits__'] = currentLimits;
            renderLocalFeedback();
            saveStateToDatabase('__limits__', currentLimits);
        }

        async function saveStateToDatabase(customUser, customData) {
            const targetUser = customUser || username;
            const targetData = customData || appState[username] || [];
            try {
                await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: targetUser, selectedSlots: targetData })
                });
            } catch (err) {
                document.getElementById('syncBadge').innerText = "Offline";
                document.getElementById('syncBadge').className = "text-xs bg-red-100 text-red-800 px-2.5 py-1 rounded-full font-semibold";
            }
        }

        async function fetchStateFromDatabase() {
            try {
                const response = await fetch(WORKER_URL);
                const res = await response.json();
                appState = res.data || {};
                document.getElementById('syncBadge').innerText = "Synced";
                document.getElementById('syncBadge').className = "text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-semibold";
                renderLocalFeedback();
            } catch (err) {
                document.getElementById('syncBadge').innerText = "Syncing...";
                document.getElementById('syncBadge').className = "text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-semibold";
            }
        }

        function renderLocalFeedback() {
            const slotUserCountMap = {};
            const limitsArray = appState['__limits__'] || [];

            // Dynamic Break Button Feedback state change
            const myBreakKey = `__active_break__${username}`;
            const isCurrentlyOnBreak = appState[myBreakKey] && appState[myBreakKey].length > 0;
            const btnBreak = document.getElementById('btnBreak');
            if (isCurrentlyOnBreak) {
                btnBreak.innerText = "☕ End Break";
                btnBreak.className = "px-4 py-2 rounded font-semibold text-sm bg-red-600 hover:bg-red-700 text-white border border-red-700 transition";
            } else {
                btnBreak.innerText = "☕ Start Break";
                btnBreak.className = "px-4 py-2 rounded font-semibold text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 border border-gray-300 transition";
            }

            // Build structural counts mapping
            Object.keys(appState).forEach(user => {
                if (user.startsWith("__")) return;
                const selections = appState[user] || [];
                selections.forEach(key => {
                    slotUserCountMap[key] = (slotUserCountMap[key] || 0) + 1;
                });
            });

            // Live Activity Log Parsing
            const liveStatusContainer = document.getElementById('liveStatusContainer');
            liveStatusContainer.innerHTML = '';
            Object.keys(appState).forEach(key => {
                if ((key.includes('__wc__') || key.includes('__water__') || key.startsWith('__active_break__')) && appState[key].length > 0) {
                    let displayUser = key.replace('__wc__', '').replace('__water__', '').replace('__active_break__', '');
                    const [label, styles] = appState[key];
                    const badge = document.createElement('div');
                    badge.className = `px-2 py-1 rounded text-xs font-bold border ${styles}`;
                    badge.innerText = `${displayUser}: ${label}`;
                    liveStatusContainer.appendChild(badge);
                }
            });

            // Re-render blocks and labels maps loops
            timeSlots.forEach(slot => {
                let currentMaxLimit = 3;
                if (limitsArray.includes(`${slot}-1`)) currentMaxLimit = 1;
                else if (limitsArray.includes(`${slot}-2`)) currentMaxLimit = 2;

                const limitIndicatorLabel = document.getElementById(`limit-label-${slot}`);
                if (limitIndicatorLabel) {
                    limitIndicatorLabel.innerText = `Limit: ${currentMaxLimit}`;
                    limitIndicatorLabel.className = currentMaxLimit < 3 ? "text-[9px] text-red-500 font-bold" : "text-[9px] text-gray-400 font-normal";
                }

                for(let index = 0; index < 12; index++) {
                    const key = `${slot}-${index}`;
                    const parallelUsersCount = slotUserCountMap[key] || 0;
                    const iHaveSelectedThis = username && appState[username] && appState[username].includes(key);

                    const eBlock = editorContainer.querySelector(`[data-slot="${slot}"][data-index="${index}"]`);
                    const vBlock = document.getElementById(`view-${slot}-${index}`);

                    // Render interactive Editor block lookups
                    if (eBlock) {
                        if (iHaveSelectedThis) {
                            eBlock.className = "h-6 border border-sky-500 bg-sky-500 rounded-sm shadow-inner";
                        } else {
                            eBlock.className = "h-6 border border-gray-300 bg-white rounded-sm";
                        }
                    }

                    // Render Shared View Matrix dashboard outputs
                    if (vBlock) {
                        vBlock.innerText = "";
                        if (iHaveSelectedThis) {
                            vBlock.className = "h-6 border border-sky-500 bg-sky-500 text-white rounded-sm text-[9px] font-bold flex items-center justify-center shadow-sm";
                            vBlock.innerText = "ME";
                        } else if (parallelUsersCount > 0) {
                            if (parallelUsersCount >= currentMaxLimit) {
                                vBlock.className = "h-6 border border-red-300 bg-red-100 text-red-700 rounded-sm text-[9px] font-bold flex items-center justify-center";
                                vBlock.innerText = `FULL (${parallelUsersCount})`;
                            } else {
                                vBlock.className = "h-6 border border-green-300 bg-green-100 text-green-700 rounded-sm text-[9px] font-bold flex items-center justify-center";
                                vBlock.innerText = `TAKEN (${parallelUsersCount})`;
                            }
                        } else {
                            vBlock.className = "h-6 border border-gray-200 bg-gray-50 text-transparent rounded-sm";
                        }
                    }
                }
            });
        }

        fetchStateFromDatabase();
        setInterval(fetchStateFromDatabase, 10000);
    </script>
</body>
</html>
