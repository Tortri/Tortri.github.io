<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Pérez Wibe - Website</title>
    <!-- Link to the stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Import futuristic font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <!-- Add favicon link -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body>
    <!-- Always Visible Navigation Bar -->
    <header class="title-box">
        <h1>Jacob Pérez Wibe</h1>
    </header>

    <div class="nav-bar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Other projects</a></li>
                <li><a href="useful.html">Useful tools</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>

  
    <div class="neon-green-box" id="about-me-content">
        <h2>About Me</h2>

        <div class="about-me-grid-container">
            <div class="about-me-box photo-welcome-box">
                <div class="profile-picture-container">
                    <img src="images/me.png" alt="Jacob Pérez Wibe" class="profile-picture">
                </div>
                <div class="welcome-message-container">
                    <p id="welcome-text-rotator"></p>
                </div>
            </div>

            <div class="about-me-box summary-box">
                <h3>Hey!</h3>
                <p> Nice to see you here, let me introduce you to my page. </p>
            </div>


        </div> </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const welcomeMessages = [
                    "Welcome!",      // English
                    "Willkommen!",   // German
                    "Velkommen!",    // Norwegian
                    "¡Bienvenido!",   // Spanish
                    "Bienvenue!"     // French
                ];
                let currentMessageIndex = 0;
                const welcomeTextElement = document.getElementById('welcome-text-rotator');
    
                function updateWelcomeMessage() {
                    welcomeTextElement.textContent = welcomeMessages[currentMessageIndex];
                    currentMessageIndex = (currentMessageIndex + 1) % welcomeMessages.length;
                }
    
                // Initial message display
                updateWelcomeMessage();
    
                // Change message every 2 seconds (2000 milliseconds)
                setInterval(updateWelcomeMessage, 2000);
            });
        </script>
</body>
</html>
