<!DOCTYPE html>
<html>
<head>
    <title>Live Weather in Trondheim</title>
</head>
<body>
    <h1>Current Weather in Trondheim</h1>
    <div id="weather-info">
        <p>Loading...</p>
    </div>

    <script>
        // Replace 'YOUR_API_KEY' with your actual API key from weatherapi.com
        const apiKey = '452a37930b3c429384e160439230210';
        const city = 'Trondheim';

        const weatherInfo = document.getElementById('weather-info');

        fetch(`https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}`)
            .then(response => response.json())
            .then(data => {
                const { temp_c, condition } = data.current;
                const location = data.location.name;

                weatherInfo.innerHTML = `
                    <p>Location: ${location}</p>
                    <p>Temperature: ${temp_c}°C</p>
                    <p>Condition: ${condition.text}</p>
                `;
            })
            .catch(error => {
                console.error('Error fetching weather data:', error);
                weatherInfo.innerHTML = '<p>Unable to fetch weather data.</p>';
            });
    </script>
</body>
</html>
