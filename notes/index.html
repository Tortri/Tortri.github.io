            // stays the old section name, so the notes in it don't have to change.
            const sectionsData = itemsCache.find(i => i.id === "SYSTEM_SECTIONS_CONFIG");
            if (!sectionsData) return;
            try {
                const names = JSON.parse(sectionsData.content).filter(n => typeof n === "string" && n.trim() && n.toUpperCase() !== "ALL");
                noteFolders = cleanFolders(names.map((name, i) => ({ id: name, name, parent: null, color: FOLDER_COLORS[(i + 1) % FOLDER_COLORS.length] })));
                if (noteFolders.length) saveFolders();
            } catch (e) { noteFolders = []; }
        }

        function saveFolders() {
            const person = activePerson, content = JSON.stringify({ v: 1, folders: noteFolders });
            return saveNow(`sys:${person}:folders`, (opts) => apiPost("/items", {
                id: "SYSTEM_FOLDERS_CONFIG",
                type: "SYSTEM_INTERNAL",
                title: "SYSTEM_FOLDERS",
                content,
                is_completed: 0
            }, opts, person));
        }

        function openFolder(id) {
            currentFolder = id && id !== "ALL" && folderById(id) ? id : "ALL";
            localStorage.setItem(sectionStorageKey(), currentFolder);
            if (searchQuery) { searchQuery = ""; document.getElementById("searchInput").value = ""; }
            // opening a folder in the tree also shows the folders above it
            folderPath(currentFolder).forEach(f => collapsedFolders.delete(f.id));
            renderUI();
        }

        // Drag-to-reorder among folders with the same parent (tree or tiles).
        function reorderSiblings(parent, orderedIds) {
            const siblings = orderedIds.map(id => folderById(id)).filter(f => f && (f.parent || null) === (parent || null));
            if (!siblings.length) return;
            const others = noteFolders.filter(f => !siblings.includes(f));
            noteFolders = [...others, ...siblings];
            saveFolders();
            renderUI();
        }

        // Collapsed folders in the tree are remembered per device and person.
        const collapsedKey = () => `notes_collapsed_${activePerson}`;
        let collapsedFolders = new Set();
        function loadCollapsed() {
            try { collapsedFolders = new Set(JSON.parse(localStorage.getItem(collapsedKey()) || "[]")); } catch (e) { collapsedFolders = new Set(); }
        }
        function toggleCollapsed(id) {
            if (collapsedFolders.has(id)) collapsedFolders.delete(id); else collapsedFolders.add(id);
            localStorage.setItem(collapsedKey(), JSON.stringify([...collapsedFolders]));
            renderFolderTree();
        }
        loadCollapsed();

        // --- folder dialog (new / edit / move / delete) ---
        let folderDialogState = null;

        function openFolderDialog({ id = null, parent = null } = {}) {
            if (!personConfirmed[activePerson]) { alert(notReadyMessage()); return; }
            const f = id ? folderById(id) : null;
            folderDialogState = {
                id: f ? f.id : null,
                color: f ? f.color : FOLDER_COLORS[(noteFolders.length + 1) % FOLDER_COLORS.length],
            };
            const parentId = f ? f.parent : (parent && folderById(parent) ? parent : null);
            document.getElementById("folderDialogTitle").textContent =
                f ? "Edit folder" : (parentId ? `New folder in ${folderById(parentId).name}` : "New folder");
            const nameInput = document.getElementById("folderNameInput");
            nameInput.value = f ? f.name : "";

            // "Inside": top level or any folder that isn't this one (or inside it)
            const blocked = f ? descendantIds(f.id) : new Set();
            let opts = `<option value="">(top level)</option>`;
            const walk = (p, depth) => childFolders(p).forEach(c => {
                if (blocked.has(c.id)) return;
                opts += `<option value="${escapeHtml(c.id)}" ${c.id === parentId ? "selected" : ""}>${"   ".repeat(depth)}${escapeHtml(c.name)}</option>`;
                walk(c.id, depth + 1);
            });
            walk(null, 0);
            document.getElementById("folderParentSelect").innerHTML = opts;

            document.getElementById("folderDeleteBtn").classList.toggle("hidden", !f);
            renderFolderSwatches();
            document.getElementById("folderDialog").showModal();
            nameInput.focus();
            nameInput.select();
        }

        function renderFolderSwatches() {
            const box = document.getElementById("folderColorSwatches");
            box.innerHTML = FOLDER_COLORS.map(c => `
                <button type="button" data-color="${c}" title="${c}" aria-pressed="${c === folderDialogState.color}"
                    class="w-7 h-7 rounded-full transition ${c === folderDialogState.color ? 'ring-2 ring-offset-2 ring-slate-500 dark:ring-offset-slate-800' : 'hover:scale-110'}"
                    style="background:${c}"></button>`).join("");
            box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
                folderDialogState.color = b.dataset.color;
                renderFolderSwatches();
            }));
        }

        document.getElementById("folderForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("folderNameInput").value.trim();
            if (!name || !folderDialogState) return;
            const parent = document.getElementById("folderParentSelect").value || null;
            const existing = folderDialogState.id ? folderById(folderDialogState.id) : null;
            if (existing) {
                existing.name = name;
                existing.color = folderDialogState.color;
                if (!parent || !descendantIds(existing.id).has(parent)) existing.parent = parent;
                saveFolders();
                document.getElementById("folderDialog").close();
                renderUI();
            } else {
                const folder = { id: `f_${uid()}`, name, parent, color: folderDialogState.color };
                noteFolders.push(folder);
                saveFolders();
                document.getElementById("folderDialog").close();
                openFolder(folder.id);
            }
        });

        document.getElementById("folderDeleteBtn").addEventListener("click", async () => {
            const f = folderDialogState && folderById(folderDialogState.id);
            if (!f) return;
            const parent = f.parent ? folderById(f.parent) : null;
            const where = parent ? `"${parent.name}"` : "no folder (they stay in All notes)";
            const hasKids = childFolders(f.id).length > 0;
            if (!confirm(`Delete the folder "${f.name}"?\n\nIts notes${hasKids ? " and subfolders" : ""} move to ${where}. No notes are deleted.`)) return;
            document.getElementById("folderDialog").close();
            childFolders(f.id).forEach(c => { c.parent = f.parent || null; });
            noteFolders = noteFolders.filter(x => x.id !== f.id);
            await saveFolders();
            for (const item of itemsCache.filter(i => !isSystemItem(i) && i.type === f.id)) {
                item.type = f.parent || null;
                saveItem(item.id);
            }
            if (currentFolder === f.id) openFolder(f.parent || "ALL"); else renderUI();
        });

        async function moveNoteToFolder(id, selectElement) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            el.type = selectElement.value || null;
            renderUI();
            await saveItem(id);
        }

        function folderOptionsHtml(selectedId) {
            let html = `<option value="" ${!selectedId ? 'selected' : ''}>no folder</option>`;
            if (selectedId && !folderById(selectedId)) {
                // The note points at a folder that no longer exists (e.g. an old deleted section).
                html += `<option value="${escapeHtml(selectedId)}" selected>${escapeHtml(selectedId)} (deleted)</option>`;
            }
            const walk = (parent, depth) => childFolders(parent).forEach(f => {
                html += `<option value="${escapeHtml(f.id)}" ${f.id === selectedId ? 'selected' : ''}>${"   ".repeat(depth)}${escapeHtml(f.name)}</option>`;
                walk(f.id, depth + 1);
            });
            walk(null, 0);
            return html;
        }

        // --- folder tree (sidebar) ---
        function renderFolderTree() {
            const tree = document.getElementById("folderTree");
            if (!tree) return;
            tree.innerHTML = "";
            const total = itemsCache.filter(i => !isSystemItem(i)).length;

            const row = (f, depth, count, hasKids) => {
                const isAll = f.id === "ALL";
                const active = currentFolder === f.id;
                const el = document.createElement("div");
                el.className = `tree-row group flex items-center gap-1 rounded-md pr-1 ${active
                    ? 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-100'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/50'}`;
                el.style.paddingLeft = `${4 + depth * 14}px`;
                const toggle = hasKids
                    ? `<button type="button" data-act="toggle" class="w-4 h-6 text-[9px] text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" title="Show / hide subfolders">${collapsedFolders.has(f.id) ? '▶' : '▼'}</button>`
                    : `<span class="w-4"></span>`;
                const icon = isAll
                    ? `<svg viewBox="0 0 24 24" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>`
                    : folderIcon(f.color);
                el.innerHTML = `
                    ${toggle}
                    <button type="button" data-act="open" class="flex-1 min-w-0 flex items-center gap-2 py-1.5 text-left">
                        ${icon}
                        <span class="truncate ${active ? 'font-medium' : ''}">${escapeHtml(f.name)}</span>
                    </button>
                    <span class="text-[11px] tabular-nums text-slate-400 dark:text-slate-500 group-hover:hidden">${count || ''}</span>
                    ${isAll ? '' : `<button type="button" data-act="edit" class="hidden group-hover:block text-[11px] text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 px-1" title="Rename, colour, move or delete">edit</button>`}`;
                el.querySelector('[data-act="open"]').addEventListener("click", () => openFolder(f.id));
                const t = el.querySelector('[data-act="toggle"]');
                if (t) t.addEventListener("click", (e) => { e.stopPropagation(); toggleCollapsed(f.id); });
                const ed = el.querySelector('[data-act="edit"]');
                if (ed) ed.addEventListener("click", (e) => { e.stopPropagation(); openFolderDialog({ id: f.id }); });
                return el;
            };

            tree.appendChild(row({ id: "ALL", name: "All notes" }, 0, total, false));

            const buildList = (parent, depth) => {
                const kids = childFolders(parent);
                if (!kids.length) return null;
                const list = document.createElement("div");
                kids.forEach(f => {
                    const wrap = document.createElement("div");
                    wrap.dataset.id = f.id;
                    const hasKids = childFolders(f.id).length > 0;
                    wrap.appendChild(row(f, depth, noteCount(f.id), hasKids));
                    if (hasKids && !collapsedFolders.has(f.id)) {
                        const sub = buildList(f.id, depth + 1);
                        if (sub) wrap.appendChild(sub);
                    }
                    list.appendChild(wrap);
                });
                makeSortable(`tree:${parent || ""}`, list, {
                    group: `tree-${parent || "root"}`, // reorder among siblings only
                    animation: 150, delay: 150, delayOnTouchOnly: true,
                    onEnd: () => reorderSiblings(parent, Array.from(list.children).map(c => c.dataset.id)),
                });
                return list;
            };
            const rootList = buildList(null, 0);
            if (rootList) tree.appendChild(rootList);
            else {
                const hint = document.createElement("p");
                hint.className = "text-xs text-slate-400 dark:text-slate-500 px-2 py-2";
                hint.textContent = "No folders yet — press + to make one.";
                tree.appendChild(hint);
            }
        }

        // --- breadcrumb + folder actions ---
        function renderBreadcrumb() {
            const bc = document.getElementById("breadcrumb");
            const actions = document.getElementById("folderActions");
            if (!bc || !actions) return;
            const path = currentFolder === "ALL" ? [] : folderPath(currentFolder);
            const crumb = (label, id, isLast, color) => isLast
                ? `<span class="flex items-center gap-1.5 font-semibold text-slate-800 dark:text-slate-100 min-w-0">${color ? folderIcon(color) : ''}<span class="truncate">${escapeHtml(label)}</span></span>`
                : `<button type="button" data-open="${escapeHtml(id)}" class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:underline">${escapeHtml(label)}</button>`;
            const sep = `<span class="text-slate-300 dark:text-slate-600">/</span>`;
            let html = crumb("All notes", "ALL", path.length === 0, null);
            path.forEach((f, i) => { html += sep + crumb(f.name, f.id, i === path.length - 1, f.color); });
            bc.innerHTML = html;
            bc.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openFolder(b.dataset.open)));

            const link = "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 underline decoration-dotted";
            if (currentFolder === "ALL") {
                actions.innerHTML = `<button type="button" data-act="new" class="${link}">+ folder</button>`;
            } else {
                actions.innerHTML = `<button type="button" data-act="new" class="${link}">+ subfolder</button>
                    <button type="button" data-act="edit" class="${link}">edit folder</button>`;
            }
            actions.querySelector('[data-act="new"]').addEventListener("click", () =>
                openFolderDialog({ parent: currentFolder === "ALL" ? null : currentFolder }));
            const ed = actions.querySelector('[data-act="edit"]');
            if (ed) ed.addEventListener("click", () => openFolderDialog({ id: currentFolder }));
        }

        // --- subfolder tiles ---
        function renderFolderTiles() {
            const box = document.getElementById("folderTiles");
            if (!box) return;
            const parent = currentFolder === "ALL" ? null : currentFolder;
            const kids = childFolders(parent);
            box.innerHTML = "";
            if (searchQuery.trim() || !kids.length) { box.classList.add("hidden"); return; }
            box.classList.remove("hidden");
            kids.forEach(f => {
                const n = noteCount(f.id), subs = childFolders(f.id).length;
                const tile = document.createElement("button");
                tile.type = "button";
                tile.dataset.id = f.id;
                tile.className = "folder-tile flex items-center gap-2.5 text-left px-3 py-2.5 rounded-lg border transition hover:-translate-y-px hover:shadow-sm min-w-0";
                tile.style.background = hexToRgba(f.color, 0.1);
                tile.style.borderColor = hexToRgba(f.color, 0.35);
                tile.innerHTML = `
                    ${folderIcon(f.color, "w-7 h-7")}
                    <span class="min-w-0">
                        <span class="block text-sm font-medium truncate text-slate-800 dark:text-slate-100">${escapeHtml(f.name)}</span>
                        <span class="block text-[11px] text-slate-500 dark:text-slate-400">${n} note${n === 1 ? '' : 's'}${subs ? ` · ${subs} folder${subs === 1 ? '' : 's'}` : ''}</span>
                    </span>`;
                tile.addEventListener("click", () => openFolder(f.id));
                box.appendChild(tile);
            });
            makeSortable("tiles", box, {
                animation: 150, delay: 150, delayOnTouchOnly: true,
                onEnd: () => reorderSiblings(parent, Array.from(box.children).map(c => c.dataset.id)),
            });
        }

        // --- one or two notes per row ---
        function setViewCols(n) {
            viewCols = n === 1 ? 1 : 2;
            localStorage.setItem("notes_view_cols", String(viewCols));
            applyViewCols();
            renderDrawingPreviews();
        }
        function applyViewCols() {
            const grid = document.getElementById("notesGrid");
            grid.className = viewCols === 1 ? "notes-big grid grid-cols-1 gap-4" : "grid grid-cols-1 sm:grid-cols-2 gap-4";
            document.querySelectorAll("#viewToggle [data-cols]").forEach(b => {
                const on = Number(b.dataset.cols) === viewCols;
                b.setAttribute("aria-pressed", on ? "true" : "false");
                b.classList.toggle("bg-slate-700", on); b.classList.toggle("text-white", on);
                b.classList.toggle("dark:bg-slate-200", on); b.classList.toggle("dark:text-slate-900", on);
                b.classList.toggle("text-slate-500", !on);
            });
            grid.querySelectorAll(".line-input").forEach(autoGrow);
        }


        function noteMatches(item, q) {
            if ((item.title || "").toLowerCase().includes(q)) return true;
            if ((item.lines || []).some(l => (l.text || "").toLowerCase().includes(q))) return true;
            const d = window.NoteDraw && drawings.get(item.id);
            return !!d && NoteDraw.docText(d).toLowerCase().includes(q);
        }

        // --- NOTE CARD ---
        const CARD_CLASSES = "p-4 rounded-lg bg-white dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700/60 transition flex flex-col justify-between space-y-3 shadow-sm dark:shadow-none";
        const EXPANDED_CARD_CLASSES = "note-expanded fixed inset-0 sm:inset-4 lg:inset-y-6 z-50 mx-auto w-full max-w-6xl overflow-y-auto overscroll-contain p-2 sm:p-3 sm:rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-2xl flex flex-col gap-2";

        function buildNoteCard(item) {
            const isExpanded = item.id === expandedNoteId;
            const hasDrawing = window.NoteDraw && drawings.has(item.id) && !NoteDraw.isEmpty(drawings.get(item.id));
            const isDrawNote = item.kind === 'draw';
            const card = document.createElement("div");
            card.dataset.id = item.id;
            card.className = isExpanded ? EXPANDED_CARD_CLASSES : CARD_CLASSES;
            const folder = item.type ? folderById(item.type) : null;
            if (folder) {
                // the note wears its folder's colour on its left edge
                card.classList.add("border-l-4");
                card.style.borderLeftColor = folder.color;
            }
            // When notes from different folders are mixed (All notes, search), show which folder each is in.
            const showFolderChip = folder && (currentFolder === "ALL" || searchQuery.trim()) && folder.id !== currentFolder;
            const chipHtml = showFolderChip
                ? `<button type="button" data-action="open-folder" title="Open folder" class="shrink-0 max-w-[40%] truncate text-[10px] font-medium px-1.5 py-0.5 rounded" style="color:${escapeHtml(folder.color)};background:${hexToRgba(folder.color, 0.14)}">${escapeHtml(folder.name)}</button>`
                : '';

            const handleHtml = isExpanded
                ? ''
                : `<span class="card-handle cursor-grab active:cursor-grabbing text-slate-400 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-300 text-sm select-none p-1" title="Drag card">⋮⋮</span>`;

            const titleHtml = `<input id="title-${item.id}" value="${escapeHtml(item.title || '')}" placeholder="${isDrawNote ? 'Untitled drawing' : 'Untitled'}" class="w-full bg-transparent font-medium text-slate-800 dark:text-slate-200 focus:outline-none placeholder-slate-400 dark:placeholder-slate-600 ${isExpanded ? 'text-lg' : 'text-base'}">`;

            // full-screen editor: only title, pdf and done at the top - the rest of the space is for drawing
            const doneHtml = isExpanded
                ? `<button data-action="note-pdf" class="shrink-0 text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 px-2 py-1.5" title="Download as PDF">pdf</button>
                   <button data-action="close-draw" class="shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 hover:opacity-90 transition">done</button>`
                : '';

            let inner = `
                <div class="w-full ${isExpanded ? 'flex-1 min-h-0 flex flex-col' : ''}">
                    <div class="flex items-center gap-2 ${isExpanded ? 'mb-1.5' : 'mb-2'}">
                        ${handleHtml}
                        ${titleHtml}
                        ${chipHtml}
                        ${doneHtml}
                    </div>
                    <div class="lines-list space-y-1 ${isDrawNote ? 'hidden' : ''} ${isExpanded ? 'shrink-0 max-h-[18vh] overflow-y-auto overscroll-contain pr-1' : ''}">`;

            (item.lines || []).forEach(line => {
                const foundUrl = extractFirstURL(line.text);
                const linkBtnClass = foundUrl ? "" : "hidden";

                if (line.checked === null) {
                    inner += `
                        <div data-line-id="${line.id}" class="line-item flex items-start gap-1 group">
                            <span class="line-handle cursor-grab active:cursor-grabbing text-slate-300 dark:text-slate-700 hover:text-slate-500 dark:hover:text-slate-400 text-xs mt-1 select-none opacity-50 sm:opacity-0 group-hover:opacity-100 transition p-0.5">⋮⋮</span>
                            <textarea id="line-${item.id}-${line.id}" data-id="${item.id}" data-line="${line.id}" rows="1" placeholder="write..." class="line-input w-full bg-transparent text-sm text-slate-700 dark:text-slate-300 focus:outline-none placeholder-slate-400 dark:placeholder-slate-600 py-0.5 resize-none overflow-hidden leading-snug break-words">${escapeHtml(line.text)}</textarea>
                            <a id="url-btn-${item.id}-${line.id}" href="${escapeHtml(foundUrl || '#')}" target="_blank" rel="noopener noreferrer" class="${linkBtnClass} shrink-0 text-[10px] font-semibold text-blue-500 hover:underline bg-blue-50 dark:bg-blue-950/40 px-1.5 py-0.5 rounded mt-0.5 transition">↗ open</a>
                        </div>`;
                } else {
                    inner += `
                        <div data-line-id="${line.id}" class="line-item flex items-start gap-1 group">
                            <span class="line-handle cursor-grab active:cursor-grabbing text-slate-300 dark:text-slate-700 hover:text-slate-500 dark:hover:text-slate-400 text-xs mt-1 select-none opacity-50 sm:opacity-0 group-hover:opacity-100 transition p-0.5">⋮⋮</span>
                            <div class="flex items-start gap-2 w-full">
                                <input type="checkbox" ${line.checked ? 'checked' : ''} onchange="toggleCheck('${item.id}','${line.id}', this)" class="h-3.5 w-3.5 mt-1.5 rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-900 checked:bg-slate-500 focus:ring-0 shrink-0">
                                <textarea id="line-${item.id}-${line.id}" data-id="${item.id}" data-line="${line.id}" rows="1" placeholder="task..." class="line-input w-full bg-transparent text-sm focus:outline-none py-0.5 resize-none overflow-hidden leading-snug break-words ${line.checked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-300'}">${escapeHtml(line.text)}</textarea>
                                <a id="url-btn-${item.id}-${line.id}" href="${escapeHtml(foundUrl || '#')}" target="_blank" rel="noopener noreferrer" class="${linkBtnClass} shrink-0 text-[10px] font-semibold text-blue-500 hover:underline bg-blue-50 dark:bg-blue-950/40 px-1.5 py-0.5 rounded mt-0.5 transition">↗ open</a>
                            </div>
                        </div>`;
                }
            });

            inner += `
                    </div>`;

            if (isExpanded) {
                inner += `<div class="draw-slot flex-1 min-h-0 flex flex-col ${isDrawNote ? '' : 'mt-2'}"></div>`;
            } else if (hasDrawing) {
                inner += `
                    <div class="drawing-preview ${isDrawNote ? 'mt-1' : 'mt-3'} rounded-md overflow-hidden cursor-pointer" data-note="${escapeHtml(item.id)}" data-big="${isDrawNote ? 1 : 0}" title="Open drawing">
                        <canvas></canvas>
                    </div>`;
            } else if (isDrawNote) {
                inner += `
                    <button type="button" data-action="toggle-draw" class="w-full h-28 mt-1 rounded-md border-2 border-dashed border-slate-200 dark:border-slate-700 text-sm text-slate-400 dark:text-slate-500 hover:border-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition">empty drawing — tap to draw</button>`;
            }
            inner += `
                </div>`;

            const options = folderOptionsHtml(item.type);

            // Drawing notes open the editor; text notes only show it if they already
            // have a drawing from before (so nothing that was drawn gets lost).
            const showDrawBtn = isDrawNote || hasDrawing;
            const drawLabel = isDrawNote ? 'open' : 'edit drawing';
            const footerArea = isExpanded ? '' : `
                <div class="flex justify-end items-center border-t border-slate-200 dark:border-slate-800/50 pt-2 text-xs text-slate-400 dark:text-slate-500">
                    <div class="flex flex-wrap items-center justify-end gap-x-3 gap-y-1">
                        ${showDrawBtn ? `<button data-action="toggle-draw" class="flex items-center gap-1 text-slate-500 dark:text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 transition" title="Open the drawing">
                            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/></svg>
                            <span>${drawLabel}</span>
                        </button>` : ''}
                        ${isDrawNote ? '' : `<button onclick="copyNote('${item.id}', this)" class="text-slate-500 dark:text-slate-600 hover:text-slate-800 dark:hover:text-slate-300 transition">copy</button>`}
                        <button data-action="note-pdf" class="text-slate-500 dark:text-slate-600 hover:text-slate-800 dark:hover:text-slate-300 transition" title="Download this note as a PDF">pdf</button>
                        <select onchange="moveNoteToFolder('${item.id}', this)" title="Move to folder" class="bg-transparent text-slate-500 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-400 border-none focus:ring-0 cursor-pointer text-xs p-0 max-w-[7.5rem]">
                            ${options}
                        </select>
                        <button onclick="deleteItem('${item.id}')" class="text-slate-500 dark:text-slate-600 hover:text-red-500 transition">delete</button>
                    </div>
                </div>`;

            card.innerHTML = inner + footerArea;

            const titleInput = card.querySelector(`#title-${CSS.escape(item.id)}`);
            if (titleInput) {
                titleInput.addEventListener('input', () => updateTitle(item.id, titleInput.value));
            }

            card.querySelectorAll('[data-action="toggle-draw"]').forEach(b => b.addEventListener('click', () => toggleDraw(item.id)));
            card.querySelectorAll('[data-action="close-draw"]').forEach(b => b.addEventListener('click', () => closeDraw()));
            card.querySelectorAll('[data-action="note-pdf"]').forEach(b => b.addEventListener('click', () => exportNotePDF(item.id)));
            card.querySelectorAll('[data-action="open-folder"]').forEach(b => b.addEventListener('click', () => openFolder(folder.id)));
            const preview = card.querySelector('.drawing-preview');
            if (preview) preview.addEventListener('click', () => openDraw(item.id));
            if (isExpanded && drawEditor) card.querySelector('.draw-slot').appendChild(drawEditor.el);

            card.querySelectorAll('.line-input').forEach(inputEl => {
                const lineId = inputEl.dataset.line;
                inputEl.addEventListener('input', () => { autoGrow(inputEl); handleLineInput(item.id, lineId, inputEl); });
                inputEl.addEventListener('keydown', (e) => handleLineKeydown(e, item.id, lineId));
                inputEl.addEventListener('beforeinput', (e) => {
                    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
                        e.preventDefault();
                        performEnterSplit(item.id, lineId, inputEl);
                    }
                });
            });

            const linesContainer = card.querySelector('.lines-list');
            if (linesContainer && !isDrawNote) new Sortable(linesContainer, {
                handle: '.line-handle',
                animation: 150,
                onEnd: function () {
                    const lineElements = Array.from(linesContainer.querySelectorAll('.line-item'));
                    const newLinesOrder = lineElements.map(el => {
                        const lId = el.dataset.lineId;
                        return item.lines.find(l => l.id === lId);
                    }).filter(Boolean);

                    item.lines = newLinesOrder;
                    saveItem(item.id);
                }
            });

            return card;
        }

        function notesInView(q) {
            let pool = itemsCache.filter(i => !isSystemItem(i));
            if (q) {
                // search looks in the open folder and everything inside it
                if (currentFolder !== "ALL") { const ids = descendantIds(currentFolder); pool = pool.filter(i => ids.has(i.type)); }
                return pool.filter(i => noteMatches(i, q));
            }
            if (currentFolder === "ALL") return pool;          // every note, like the old ALL tab
            return pool.filter(i => i.type === currentFolder);   // just this folder; subfolders show as tiles
        }

        function renderUI() {
            renderBookmarks();
            applyBookmarksVisibility();
            renderFolderTree();
            renderBreadcrumb();
            renderFolderTiles();
            applyViewCols();

            // --- Render Notes Grid ---
            const grid = document.getElementById("notesGrid");
            const openCard = expandedNoteId && grid.querySelector(`[data-id="${CSS.escape(expandedNoteId)}"]`);
            const openScroll = openCard ? openCard.scrollTop : 0;
            grid.innerHTML = "";

            const q = searchQuery.trim().toLowerCase();
            const filtered = notesInView(q);
            // Never lose the note that is open in drawing mode.
            if (expandedNoteId && !filtered.some(i => i.id === expandedNoteId)) {
                const ex = itemsCache.find(i => i.id === expandedNoteId);
                if (ex) filtered.push(ex);
            }

            if (filtered.length === 0) {
                const empty = document.createElement("div");
                empty.className = "col-span-full text-center text-sm text-slate-400 dark:text-slate-600 py-16";
                const hasSubfolders = childFolders(currentFolder === "ALL" ? null : currentFolder).length > 0;
                empty.textContent = !personConfirmed[activePerson] ? notReadyMessage()
                    : personLoading ? "Loading…"
                    : q ? `No notes match “${searchQuery.trim()}”.`
                    : currentFolder !== "ALL" && hasSubfolders ? "No notes directly in this folder — open a subfolder above, or press + to add one here."
                    : "No notes here yet — press + to make one.";
                grid.appendChild(empty);
            }

            filtered.forEach(item => grid.appendChild(buildNoteCard(item)));
            // auto-size textareas once they are in the page
            grid.querySelectorAll('.line-input').forEach(autoGrow);
            renderDrawingPreviews();
            if (openScroll) {
                const again = grid.querySelector(`[data-id="${CSS.escape(expandedNoteId)}"]`);
                if (again) again.scrollTop = openScroll;
            }

            makeSortable("grid", grid, {
                handle: '.card-handle',
                animation: 150,
                disabled: !!expandedNoteId,
                onEnd: function () {
                    // Put the dragged cards in their new order, keeping notes that
                    // aren't visible (other folders / search) where they were.
                    const byId = new Map(itemsCache.map(i => [i.id, i]));
                    const visibleIds = Array.from(grid.children).map(c => c.dataset.id).filter(id => byId.has(id));
                    const visible = new Set(visibleIds);
                    let k = 0;
                    itemsCache = itemsCache.map(i => visible.has(i.id) ? byId.get(visibleIds[k++]) : i);
                    saveNoteOrder(); // previously the order was lost on reload
                }
            });
        }

        // --- PERSON SWITCH (Jacob / Zara) ---
        function personLabel(person = activePerson) {
            return (PEOPLE.find(p => p.key === person) || PEOPLE[0]).label;
        }

        function notReadyMessage() {
            return `${personLabel()}'s notes need the updated worker. Deploy the new worker.js in Cloudflare, then reload.`;
        }

        function renderPersonButtons() {
            PEOPLE.forEach(p => {
                const btn = document.getElementById(`personBtn${p.label}`);
                if (!btn) return;
                const active = activePerson === p.key;
                btn.setAttribute("aria-pressed", active ? "true" : "false");
                btn.className = `px-4 py-1.5 transition ${p.key !== PEOPLE[0].key ? 'border-l border-slate-300 dark:border-slate-700' : ''} ${
                    active
                        ? 'bg-slate-700 text-white dark:bg-slate-200 dark:text-slate-900'
                        : 'bg-transparent text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800'
                }`;
            });
            document.title = activePerson === "jacob" ? "Notes & Bookmarks" : `Notes & Bookmarks · ${personLabel()}`;
        }

        function setPerson(person) {
            if (person === activePerson || !PEOPLE.some(p => p.key === person)) return;
            if (expandedNoteId) closeDraw();
            flushPendingSaves(); // the current person's edits go out now (each save knows whose it is)
            activePerson = person;
            localStorage.setItem("notes_active_person", person);
            currentFolder = localStorage.getItem(sectionStorageKey()) || "ALL";
            itemsCache = []; noteFolders = []; bookmarks = []; noteOrder = null; drawings = new Map();
            loadCollapsed();
            activeOpenFolderId = null;
            searchQuery = "";
            document.getElementById("searchInput").value = "";
            personLoading = true;
            renderPersonButtons();
            renderUI();
            updateSyncStatus();
            fetchItems();
        }

        // --- SEARCH ---
        let searchTimer = null;
        document.getElementById("searchInput").addEventListener("input", (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { searchQuery = e.target.value; renderUI(); }, 120);
        });

        renderPersonButtons();
        personLoading = true;
        fetchItems();
    </script>
</body>
</html>
