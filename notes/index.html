<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <div class="max-w-4xl mx-auto p-4 sm:p-8">
        <header class="flex justify-between items-baseline border-b border-slate-800 pb-3 mb-4">
            <h1 class="text-xl font-semibold tracking-tight text-slate-200">Notes</h1>
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-300 transition underline decoration-dotted">
                logout
            </button>
        </header>

        <div class="relative mb-6 border-b border-slate-800 pb-1">
            <div class="flex items-center justify-between">
                <div id="sectionsContainer" class="flex gap-2 overflow-x-auto scrollbar-none py-1 pr-12 scroll-smooth flex-1 select-none">
                    </div>
                <button onclick="addSection()" class="absolute right-0 bg-slate-900 pl-4 pr-1 text-slate-400 hover:text-slate-200 text-lg font-bold" title="Add Section">+</button>
            </div>
        </div>

        <main>
            <div class="flex justify-end mb-4">
                <button onclick="createNewNote()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xl w-10 h-10 rounded-full flex items-center justify-center transition shadow-sm">
                    +
                </button>
            </div>

            <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </main>
    </div>

    <script>
        const API_BASE = "https://notes-backend.tortrix03.workers.dev/api"; 
        let itemsCache = [];
        let sections = ["all", "personal"]; // Fallback defaults
        let activeSection = localStorage.getItem("active_section") || "all";

        function getAuthHeader() {
            let key = localStorage.getItem("notes_api_key");
            if (!key) {
                key = prompt("Enter portal password:");
                if (key) localStorage.setItem("notes_api_key", key);
            }
            return { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" };
        }

        function logout() {
            localStorage.removeItem("notes_api_key");
            window.location.reload();
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener" class="text-blue-400 underline hover:text-blue-300 break-all">${url}</a>`);
        }

        async function fetchItems() {
            try {
                const res = await fetch(`${API_BASE}/items`, { headers: getAuthHeader() });
                if (res.status === 401) { alert("Incorrect password!"); logout(); return; }
                itemsCache = await res.json();
                
                // Load global sections from database if they exist
                const sectionsData = itemsCache.find(i => i.id === "SYSTEM_SECTIONS_CONFIG");
                if (sectionsData) {
                    try { sections = JSON.parse(sectionsData.content); } catch(e) { sections = ["all", "personal"]; }
                } else {
                    // Initialize system config if it doesn't exist in database yet
                    saveSectionsToDatabase(["all", "personal"]);
                }

                renderUI();
            } catch (err) { console.error("Network error:", err); }
        }

        async function saveItem(id) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            
            el.title = document.getElementById(`title-${id}`).value;
            el.content = document.getElementById(`content-${id}`).value;

            const res = await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: getAuthHeader(),
                body: JSON.stringify(el)
            });
            if (res.status === 401) { logout(); }
        }

        async function saveTodoState(id, todoIndex, checkbox) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            
            let todos = [];
            try { todos = JSON.parse(el.is_completed ? el.content : "[]"); } catch(e) { todos = []; }
            todos[todoIndex].completed = checkbox.checked;
            el.content = JSON.stringify(todos);

            const res = await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: getAuthHeader(),
                body: JSON.stringify(el)
            });
            if (res.status === 401) { logout(); }
            renderUI();
        }

        async function deleteItem(id) {
            if (!confirm("delete this item?")) return;
            const res = await fetch(`${API_BASE}/items/${id}`, { method: "DELETE", headers: getAuthHeader() });
            if (res.status === 401) { logout(); }
            fetchItems();
        }

        function createNewNote() {
            const newItem = {
                id: crypto.randomUUID(),
                type: activeSection === 'all' ? 'personal' : activeSection,
                title: '',
                content: '',
                is_completed: 0
            };
            itemsCache.unshift(newItem);
            renderUI();
        }

        async function updateTodoText(id, todoIndex, newText) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            let todos = JSON.parse(el.content || "[]");
            todos[todoIndex].text = newText;
            el.content = JSON.stringify(todos);
            
            await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: getAuthHeader(),
                body: JSON.stringify(el)
            });
        }

        function addChecklistItem(id) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            
            let todos = [];
            if (el.is_completed === 1) {
                try { todos = JSON.parse(el.content || "[]"); } catch(e) { todos = []; }
            } else {
                el.is_completed = 1;
            }
            
            todos.push({ text: '', completed: false });
            el.content = JSON.stringify(todos);
            renderUI();
            
            const newlyCreatedInput = document.getElementById(`todo-${id}-${todos.length - 1}`);
            if (newlyCreatedInput) newlyCreatedInput.focus();
        }

        async function convertToPlaintext(id) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            let todos = [];
            try { todos = JSON.parse(el.content || "[]"); } catch(e) { todos = []; }
            el.is_completed = 0;
            el.content = todos.map(t => t.text).join('\n');
            renderUI();
            saveItem(id);
        }

        async function saveSectionsToDatabase(updatedSectionsList) {
            const sectionPayload = {
                id: "SYSTEM_SECTIONS_CONFIG",
                type: "SYSTEM_INTERNAL",
                title: "SYSTEM_SECTIONS",
                content: JSON.stringify(updatedSectionsList),
                is_completed: 0
            };
            await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: getAuthHeader(),
                body: JSON.stringify(sectionPayload)
            });
        }

        async function addSection() {
            const name = prompt("Enter new section name:").toLowerCase().trim();
            if (name && !sections.includes(name)) {
                sections.push(name);
                await saveSectionsToDatabase(sections);
                selectSection(name);
            }
        }

        async function deleteSection(name, event) {
            event.stopPropagation();
            if (name === "all" || name === "personal") {
                alert("Cannot delete default sections.");
                return;
            }
            if (confirm(`Delete the section "${name}"? This will untag its notes (they will stay in "all").`)) {
                sections = sections.filter(s => s !== name);
                await saveSectionsToDatabase(sections);
                
                if (activeSection === name) {
                    activeSection = "all";
                    localStorage.setItem("active_section", "all");
                }
                fetchItems();
            }
        }

        function selectSection(name) {
            activeSection = name;
            localStorage.setItem("active_section", name);
            renderUI();
        }

        async function changeNoteSection(id, selectElement) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            el.type = selectElement.value;
            await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: getAuthHeader(),
                body: JSON.stringify(el)
            });
            renderUI();
        }

        function renderUI() {
            // Render Horizontal Section Tabs
            const sectContainer = document.getElementById("sectionsContainer");
            sectContainer.innerHTML = "";
            
            sections.forEach(s => {
                const tab = document.createElement("div");
                tab.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium transition cursor-pointer whitespace-nowrap shrink-0 ${activeSection === s ? 'bg-slate-800 text-slate-100' : 'text-slate-400 hover:text-slate-200'}`;
                tab.onclick = () => selectSection(s);
                
                const textSpan = document.createElement("span");
                textSpan.textContent = s;
                tab.appendChild(textSpan);

                if (s !== "all" && s !== "personal") {
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "text-[10px] text-slate-500 hover:text-red-400 font-bold px-1 rounded";
                    deleteBtn.textContent = "×";
                    deleteBtn.onclick = (e) => deleteSection(s, e);
                    tab.appendChild(deleteBtn);
                }
                sectContainer.appendChild(tab);
            });

            // Render Notes Grid
            const grid = document.getElementById("notesGrid");
            grid.innerHTML = "";

            // Filter out system configuration and filter by active section
            const filtered = itemsCache.filter(item => 
                item.id !== "SYSTEM_SECTIONS_CONFIG" && 
                (activeSection === 'all' || item.type === activeSection)
            );

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "p-4 rounded-lg bg-slate-800/40 border border-slate-800 hover:border-slate-700/60 transition flex flex-col justify-between space-y-4";
                
                let upperArea = `
                    <div class="w-full">
                        <input id="title-${item.id}" onblur="saveItem('${item.id}')" value="${item.title}" placeholder="untitled" class="w-full bg-transparent font-medium text-slate-200 focus:outline-none placeholder-slate-600 text-base mb-2">`;
                
                if (item.is_completed === 0) {
                    upperArea += `
                        <textarea id="content-${item.id}" onblur="saveItem('${item.id}')" placeholder="write..." rows="5" class="w-full bg-transparent text-sm text-slate-300 resize-none focus:outline-none placeholder-slate-600 leading-relaxed">${item.content}</textarea>
                        <div class="mt-2 text-xs text-slate-500 pt-1 border-t border-slate-800/50 break-words">${linkify(item.content)}</div>`;
                } else {
                    upperArea += `<div class="space-y-2 mt-1 border-b border-slate-800/30 pb-2">`;
                    let todos = [];
                    try { todos = JSON.parse(item.content || "[]"); } catch(e) { todos = []; }
                    
                    todos.forEach((todo, idx) => {
                        upperArea += `
                            <div class="flex items-center gap-2">
                                <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="saveTodoState('${item.id}', ${idx}, this)" class="h-3.5 w-3.5 rounded border-slate-700 bg-slate-900 checked:bg-slate-500 focus:ring-0">
                                <input id="todo-${item.id}-${idx}" onblur="updateTodoText('${item.id}', ${idx}, this.value)" value="${todo.text}" placeholder="task..." class="w-full bg-transparent text-sm text-slate-300 focus:outline-none ${todo.completed ? 'line-through text-slate-500' : ''}">
                            </div>
                            <div class="text-xs px-5 text-slate-500 break-all">${linkify(todo.text)}</div>`;
                    });
                    
                    upperArea += `</div>`;
                }
                
                upperArea += `
                    <div class="flex gap-3 mt-2">
                        <button onclick="addChecklistItem('${item.id}')" class="text-xs text-slate-500 hover:text-slate-400 font-medium">+ add list item</button>
                        ${item.is_completed === 1 ? `<button onclick="convertToPlaintext('${item.id}')" class="text-xs text-slate-500 hover:text-slate-400">convert to text</button>` : ''}
                    </div>`;

                upperArea += `</div>`;

                let options = sections.filter(s => s !== 'all').map(s => `<option value="${s}" ${item.type === s ? 'selected' : ''}>${s}</option>`).join('');
                
                let footerArea = `
                    <div class="flex justify-between items-center border-t border-slate-800/50 pt-2 text-xs text-slate-500">
                        <span class="text-[10px] uppercase text-slate-600 font-semibold">${item.is_completed ? 'List + Text' : 'Plain Text'}</span>
                        <div class="flex items-center gap-3">
                            <select onchange="changeNoteSection('${item.id}', this)" class="bg-transparent text-slate-500 hover:text-slate-400 border-none focus:ring-0 cursor-pointer text-xs p-0 w-20">
                                ${options}
                            </select>
                            <button onclick="deleteItem('${item.id}')" class="text-slate-600 hover:text-red-400 transition">delete</button>
                        </div>
                    </div>`;

                card.innerHTML = upperArea + footerArea;
                grid.appendChild(card);
            });
        }

        fetchItems();
    </script>
</body>
</html>
