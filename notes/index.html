<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes & Bookmarks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Drawing editor (pen / touch / mouse). Bump ?v= after changing draw.js so browsers fetch the new copy. -->
    <script src="draw.js?v=1"></script>
    <style>
        .sortable-ghost { opacity: 0.3; }
        .sortable-drag { cursor: grabbing !important; }
        /* Prevent touch delay on interactive elements */
        button, a { touch-action: manipulation; }
        .scrollbar-none { scrollbar-width: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
        .drawing-preview canvas { display: block; margin: 0 auto; }
        /* Let the drawing toolbar stick flush to the top edge of the open note
           (minus the note's padding), so nothing peeks out above it. */
        .note-expanded { --nd-sticky-top: -0.75rem; }
        @media (min-width: 640px) { .note-expanded { --nd-sticky-top: -1.25rem; } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">

    <div class="max-w-4xl mx-auto p-4 sm:p-8">
        <!-- Header -->
        <header class="flex justify-between items-baseline border-b border-slate-300 dark:border-slate-800 pb-3 mb-3 relative">

            <!-- Date & Week Title with Calendar Dropdown -->
            <div class="relative inline-block" id="calendarWrapper">
                <button onclick="toggleCalendar(event)" class="flex items-center gap-2 text-xl font-semibold tracking-tight text-slate-800 dark:text-slate-200 hover:text-slate-600 dark:hover:text-slate-400 transition text-left">
                    <span id="pageDateTitle">Loading date...</span>
                    <span class="text-xs text-slate-400">▼</span>
                </button>

                <!-- Calendar Dropdown -->
                <div id="calendarDropdown" class="hidden absolute top-full left-0 mt-2 w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-xl z-50 p-3">
                    <div class="flex justify-between items-center mb-2">
                        <button onclick="changeMonth(-1, event)" class="p-1 text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">◄</button>
                        <span id="calMonthYear" class="text-xs font-bold text-slate-700 dark:text-slate-200"></span>
                        <button onclick="changeMonth(1, event)" class="p-1 text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">►</button>
                    </div>

                    <!-- Days of Week Header -->
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1">
                        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
                    </div>

                    <!-- Calendar Grid -->
                    <div id="calDaysGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Save status: shows when changes are still being sent or could not be saved -->
                <span id="syncStatus" class="text-[11px] text-slate-400 dark:text-slate-500 whitespace-nowrap" aria-live="polite"></span>
                <button onclick="exportToPDF()" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition underline decoration-dotted">
                    export pdf
                </button>
                <button onclick="toggleTheme()" id="themeToggleBtn" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition underline decoration-dotted">
                    light mode
                </button>
                <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition underline decoration-dotted">
                    logout
                </button>
            </div>
        </header>

        <!-- Bookmarks Bar -->
        <div class="mb-4 p-2 bg-slate-200/50 dark:bg-slate-800/40 rounded-lg border border-slate-300 dark:border-slate-800/60 flex items-center justify-between gap-2">
            <div id="bookmarksContainer" class="flex flex-wrap items-center gap-2 select-none flex-1">
                <!-- Dynamically rendered shortcuts/folders -->
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="toggleBookmarksVisibility()" id="bookmarksToggleBtn" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition underline decoration-dotted">
                    hide
                </button>
                <button id="addBookmarkBtn" onclick="addBookmarkPrompt()" class="text-xs font-semibold px-2.5 py-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded transition shrink-0">
                    + Link / Folder
                </button>
            </div>
        </div>

        <!-- Section Navigation Header -->
        <div class="relative mb-6 border-b border-slate-300 dark:border-slate-800 pb-1">
            <div class="flex items-center justify-between">
                <div id="sectionsContainer" class="flex gap-2 overflow-x-auto scrollbar-none py-1 pr-12 scroll-smooth flex-1 select-none">
                </div>
                <button onclick="addSection()" class="absolute right-0 bg-slate-100 dark:bg-slate-900 pl-4 pr-1 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 text-lg font-bold" title="Add Section">+</button>
            </div>
        </div>

        <main>
            <div class="flex items-center justify-between gap-3 mb-4">
                <input id="searchInput" type="search" placeholder="search notes…" autocomplete="off"
                    class="w-full max-w-xs bg-transparent text-sm px-3 py-2 rounded-full border border-slate-300 dark:border-slate-800 focus:outline-none focus:border-slate-400 dark:focus:border-slate-600 placeholder-slate-400 dark:placeholder-slate-600 text-slate-700 dark:text-slate-200">
                <button onclick="createNewNote()" title="New note" class="shrink-0 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xl w-10 h-10 rounded-full flex items-center justify-center transition shadow-sm">
                    +
                </button>
            </div>

            <!-- Notes Grid -->
            <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </main>
    </div>

    <!-- Dimmed background behind a note that is open in drawing mode -->
    <div id="drawBackdrop" onclick="closeDraw()" class="hidden fixed inset-0 z-40 bg-slate-900/50 dark:bg-black/60 backdrop-blur-[2px]"></div>

    <script>
        const API_BASE = "https://notes-backend.tortrix03.workers.dev/api";
        // Config rows that live in the items table but are not notes.
        const SYSTEM_IDS = new Set(["SYSTEM_SECTIONS_CONFIG", "SYSTEM_BOOKMARKS_CONFIG", "SYSTEM_NOTE_ORDER"]);
        let itemsCache = [];
        let sections = ["ALL"];
        let bookmarks = [];
        let noteOrder = null;           // saved card order (array of note ids), null until first drag
        let drawings = new Map();       // note id -> drawing document
        let drawingsAvailable = true;   // false when the worker has no /drawings route yet
        let activeSection = localStorage.getItem("active_section") || "ALL";
        let activeOpenFolderId = null;
        let bookmarksHidden = localStorage.getItem("bookmarks_hidden") === "true";
        let searchQuery = "";
        let expandedNoteId = null;      // note currently open in drawing mode
        let drawEditor = null;
        let lastHiddenAt = 0;

        function isSystemItem(item) {
            return SYSTEM_IDS.has(item.id) || item.type === "SYSTEM_INTERNAL";
        }

        // --- DATE & CALENDAR SYSTEM ---
        let calendarDate = new Date();

        function getWeekNumber(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        function renderDateTitle() {
            const now = new Date();
            const week = getWeekNumber(now);
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);
            document.getElementById("pageDateTitle").textContent = `${dateStr} • Week ${week}`;
        }

        function toggleCalendar(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const dropdown = document.getElementById("calendarDropdown");
            const isOpen = !dropdown.classList.contains("hidden");
            if (isOpen) {
                dropdown.classList.add("hidden");
            } else {
                dropdown.classList.remove("hidden");
                calendarDate = new Date();
                renderCalendarGrid();
            }
        }

        function changeMonth(offset, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            calendarDate.setDate(1); // avoid skipping a month when today is the 31st
            calendarDate.setMonth(calendarDate.getMonth() + offset);
            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const today = new Date();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("calMonthYear").textContent = `${monthNames[month]} ${year}`;

            const grid = document.getElementById("calDaysGrid");
            grid.innerHTML = "";

            const firstDay = new Date(year, month, 1);
            let startingDay = firstDay.getDay() - 1; // Convert Sunday=0 to Monday=0
            if (startingDay === -1) startingDay = 6;

            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Blank slots for alignment
            for (let i = 0; i < startingDay; i++) {
                const blank = document.createElement("div");
                grid.appendChild(blank);
            }

            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement("div");
                dayCell.textContent = day;
                dayCell.className = "py-1 rounded text-slate-700 dark:text-slate-300";

                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                if (isToday) {
                    dayCell.className += " bg-blue-500 text-white font-bold";
                }

                grid.appendChild(dayCell);
            }
        }

        // Close dropdowns on outside clicks
        const closeAllDropdowns = (e) => {
            if (activeOpenFolderId && !e.target.closest('#bookmarksContainer')) {
                activeOpenFolderId = null;
                renderBookmarks();
            }
            if (!e.target.closest('#calendarWrapper')) {
                const calDropdown = document.getElementById("calendarDropdown");
                if (calDropdown) calDropdown.classList.add("hidden");
            }
        };
        document.addEventListener('click', closeAllDropdowns);
        document.addEventListener('touchstart', closeAllDropdowns, { passive: true });

        // --- APP INITIALIZATION & THEME ---
        function initTheme() {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "light") {
                document.documentElement.classList.remove("dark");
                document.getElementById("themeToggleBtn").textContent = "dark mode";
            } else {
                document.documentElement.classList.add("dark");
                document.getElementById("themeToggleBtn").textContent = "light mode";
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").textContent = isDark ? "light mode" : "dark mode";
            renderDrawingPreviews(); // "ink" strokes switch between black and white
        }

        // --- BOOKMARKS VISIBILITY TOGGLE ---
        function applyBookmarksVisibility() {
            const container = document.getElementById("bookmarksContainer");
            const addBtn = document.getElementById("addBookmarkBtn");
            const toggleBtn = document.getElementById("bookmarksToggleBtn");
            if (!container || !toggleBtn) return;

            if (bookmarksHidden) {
                container.classList.add("hidden");
                if (addBtn) addBtn.classList.add("hidden");
                toggleBtn.textContent = "show bookmarks";
            } else {
                container.classList.remove("hidden");
                if (addBtn) addBtn.classList.remove("hidden");
                toggleBtn.textContent = "hide";
            }
        }

        function toggleBookmarksVisibility() {
            bookmarksHidden = !bookmarksHidden;
            localStorage.setItem("bookmarks_hidden", bookmarksHidden ? "true" : "false");
            applyBookmarksVisibility();
        }

        initTheme();
        renderDateTitle();
        setInterval(renderDateTitle, 60 * 1000); // keep the date right if the tab stays open past midnight
        applyBookmarksVisibility();

        function uid() {
            return crypto.randomUUID().slice(0, 8);
        }

        function getAuthHeader() {
            let key = localStorage.getItem("notes_api_key");
            if (!key) {
                key = prompt("Enter portal password:");
                if (key) localStorage.setItem("notes_api_key", key);
            }
            return { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" };
        }

        function logout() {
            localStorage.removeItem("notes_api_key");
            window.location.reload();
        }

        // Also escapes quotes: titles like  He said "hi"  used to cut the
        // title input short (and the shortened text could then be saved).
        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
        }

        function extractFirstURL(text) {
            if (!text) return null;
            const mdMatch = text.match(/\[.*?\]\((https?:\/\/[^\s\)]+)\)/);
            if (mdMatch) return mdMatch[1];
            const urlMatch = text.match(/(https?:\/\/[^\s"'<>]+)/);
            if (urlMatch) return urlMatch[1];
            return null;
        }

        function normalizeItem(item) {
            if (item.lines) return item;

            let lines = [];
            try {
                const parsed = JSON.parse(item.content);
                if (Array.isArray(parsed)) {
                    lines = parsed.map(p => {
                        if (p && typeof p === 'object' && 'checked' in p) {
                            return { id: p.id || uid(), text: p.text || '', checked: p.checked };
                        }
                        if (p && typeof p === 'object' && 'type' in p) {
                            return { id: uid(), text: p.text || '', checked: p.type === 'check' ? !!p.completed : null };
                        }
                        return { id: uid(), text: p.text || '', checked: !!p.completed };
                    });
                } else if (item.content) {
                    lines = item.content.split('\n').map(t => ({ id: uid(), text: t, checked: null }));
                }
            } catch (e) {
                if (item.content) lines = item.content.split('\n').map(t => ({ id: uid(), text: t, checked: null }));
            }
            if (lines.length === 0) lines = [{ id: uid(), text: '', checked: null }];
            item.lines = lines;
            return item;
        }

        function serializeLines(item) {
            item.content = JSON.stringify(item.lines || []);
            return item.content;
        }

        // =====================================================================
        // SAVE QUEUE
        // Saves for the same thing go out one at a time, in order, and fast
        // typing is batched into one request. Before, every keystroke sent its
        // own request; when two arrived out of order the older text won, which
        // is how notes could lose content. Failed saves are retried.
        // =====================================================================
        const saveJobs = new Map();

        function getJob(key, send) {
            let j = saveJobs.get(key);
            if (!j) {
                j = { timer: null, running: null, dirty: false, failed: false, retryTimer: null, error: "", send };
                saveJobs.set(key, j);
            }
            if (send) j.send = send;
            return j;
        }

        function queueSave(key, send, delay = 500) {
            const j = getJob(key, send);
            j.dirty = true;
            clearTimeout(j.timer);
            j.timer = setTimeout(() => { j.timer = null; runJob(key); }, delay);
            updateSyncStatus();
        }

        function saveNow(key, send) {
            const j = getJob(key, send);
            j.dirty = true;
            clearTimeout(j.timer);
            j.timer = null;
            return runJob(key);
        }

        function runJob(key, opts) {
            const j = saveJobs.get(key);
            if (!j) return Promise.resolve();
            if (j.running) return j.running; // the running loop picks up the newest state
            clearTimeout(j.retryTimer);
            j.running = (async () => {
                try {
                    while (j.dirty) {
                        j.dirty = false;
                        try {
                            await j.send(opts);
                            j.failed = false;
                            j.error = "";
                        } catch (err) {
                            console.error(`Save failed (${key}):`, err);
                            j.failed = true;
                            j.error = err.userMessage || err.message || "save failed";
                            if (err.retry !== false) {
                                j.dirty = true; // keep the change and try again shortly
                                j.retryTimer = setTimeout(() => runJob(key), 5000);
                            }
                            break;
                        }
                        opts = undefined;
                    }
                } finally {
                    j.running = null;
                    updateSyncStatus();
                }
            })();
            updateSyncStatus();
            return j.running;
        }

        function cancelJob(key) {
            const j = saveJobs.get(key);
            if (!j) return Promise.resolve();
            clearTimeout(j.timer); clearTimeout(j.retryTimer);
            j.timer = null; j.dirty = false; j.failed = false;
            return j.running || Promise.resolve();
        }

        function hasPendingSaves() {
            for (const j of saveJobs.values()) if (j.timer || j.running || (j.failed && j.dirty)) return true;
            return false;
        }

        // Send anything still waiting right away (used when the tab is hidden or closed).
        function flushPendingSaves() {
            for (const [key, j] of saveJobs) {
                if (j.timer) { clearTimeout(j.timer); j.timer = null; runJob(key, { keepalive: true }); }
            }
        }

        function updateSyncStatus() {
            let busy = false, retrying = false, failedMsg = "";
            for (const j of saveJobs.values()) {
                if (j.timer || j.running) busy = true;
                if (j.failed && j.dirty) retrying = true;
                else if (j.failed) failedMsg = j.error;
            }
            const el = document.getElementById("syncStatus");
            if (el) {
                el.title = failedMsg;
                if (failedMsg) { el.textContent = "⚠ not saved"; el.className = "text-[11px] text-red-500 whitespace-nowrap"; }
                else if (retrying) { el.textContent = "offline · retrying"; el.className = "text-[11px] text-amber-500 whitespace-nowrap"; }
                else if (busy) { el.textContent = "saving…"; el.className = "text-[11px] text-slate-400 dark:text-slate-500 whitespace-nowrap"; }
                else { el.textContent = saveJobs.size ? "saved" : ""; el.className = "text-[11px] text-slate-400 dark:text-slate-600 whitespace-nowrap"; }
            }
            // The drawing editor shows the state of its own drawing.
            if (drawEditor && expandedNoteId) {
                const j = saveJobs.get(`draw:${expandedNoteId}`);
                if (!j) drawEditor.setStatus("");
                else if (j.failed && !j.dirty) drawEditor.setStatus("⚠ not saved", "err", j.error);
                else if (j.failed) drawEditor.setStatus("retrying…", "warn", "Couldn't reach the server - retrying");
                else if (j.timer || j.running) drawEditor.setStatus("saving…");
                else drawEditor.setStatus("saved");
            }
        }

        async function apiPost(path, body, opts = {}) {
            const payload = JSON.stringify(body);
            const res = await fetch(`${API_BASE}${path}`, {
                method: "POST",
                headers: getAuthHeader(),
                body: payload,
                keepalive: !!opts.keepalive && payload.length < 60000,
            });
            if (res.status === 401) {
                logout();
                const e = new Error("unauthorized"); e.retry = false; throw e;
            }
            if (!res.ok) {
                const e = new Error(`server returned ${res.status}`);
                e.status = res.status;
                e.retry = res.status >= 500 || res.status === 429;
                throw e;
            }
        }

        window.addEventListener("online", () => {
            for (const [key, j] of saveJobs) if (j.failed && j.dirty) runJob(key);
        });
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") {
                lastHiddenAt = Date.now();
                flushPendingSaves();
            } else if (lastHiddenAt && Date.now() - lastHiddenAt > 30000) {
                refreshIfIdle(); // pick up changes made on another device in the meantime
            }
        });
        window.addEventListener("pagehide", flushPendingSaves);
        window.addEventListener("beforeunload", (e) => {
            flushPendingSaves();
            for (const j of saveJobs.values()) {
                if (j.failed && j.dirty) { e.preventDefault(); e.returnValue = ""; return; }
            }
        });

        // --- NOTES: LOAD & SAVE ---
        function postItem(id, opts) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return Promise.resolve(); // deleted in the meantime
            serializeLines(el);
            return apiPost("/items", {
                id: el.id,
                type: el.type ?? null,
                title: el.title || "",
                content: el.content,
                is_completed: el.is_completed ? 1 : 0,
            }, opts);
        }

        // Save a note now (returns a promise that resolves once it is stored).
        function saveItem(id) {
            return saveNow(`item:${id}`, (opts) => postItem(id, opts));
        }

        // Save a note shortly (used while typing).
        function scheduleItemSave(id) {
            queueSave(`item:${id}`, (opts) => postItem(id, opts), 500);
        }

        function applyNoteOrder() {
            if (!Array.isArray(noteOrder)) return; // never reordered: keep newest-first from the server
            const pos = new Map(noteOrder.map((id, i) => [id, i]));
            const unordered = itemsCache.filter(i => !pos.has(i.id)); // new notes (e.g. from another device) go first
            const ordered = itemsCache.filter(i => pos.has(i.id)).sort((a, b) => pos.get(a.id) - pos.get(b.id));
            itemsCache = [...unordered, ...ordered];
        }

        function saveNoteOrder() {
            noteOrder = itemsCache.filter(i => !isSystemItem(i)).map(i => i.id);
            queueSave("sys:order", (opts) => apiPost("/items", {
                id: "SYSTEM_NOTE_ORDER",
                type: "SYSTEM_INTERNAL",
                title: "SYSTEM_NOTE_ORDER",
                content: JSON.stringify(itemsCache.filter(i => !isSystemItem(i)).map(i => i.id)),
                is_completed: 0
            }, opts), 300);
        }

        async function fetchItems() {
            try {
                const headers = getAuthHeader();
                const [res, drawRes] = await Promise.all([
                    fetch(`${API_BASE}/items`, { headers }),
                    fetch(`${API_BASE}/drawings`, { headers }).catch(() => null),
                ]);
                if (res.status === 401) { alert("Incorrect password!"); logout(); return; }
                if (!res.ok) throw new Error(`server returned ${res.status}`);
                itemsCache = (await res.json()).map(normalizeItem);

                const sectionsData = itemsCache.find(i => i.id === "SYSTEM_SECTIONS_CONFIG");
                if (sectionsData) {
                    try {
                        const loaded = JSON.parse(sectionsData.content);
                        const updatedLoaded = loaded.map(s => s === "all" ? "ALL" : s);
                        sections = updatedLoaded.includes("ALL") ? updatedLoaded : ["ALL", ...updatedLoaded];
                    } catch (e) { sections = ["ALL"]; }
                } else {
                    saveSectionsToDatabase(["ALL"]);
                }

                const bookmarksData = itemsCache.find(i => i.id === "SYSTEM_BOOKMARKS_CONFIG");
                if (bookmarksData) {
                    try { bookmarks = JSON.parse(bookmarksData.content); } catch (e) { bookmarks = []; }
                }

                const orderData = itemsCache.find(i => i.id === "SYSTEM_NOTE_ORDER");
                if (orderData) {
                    try { const o = JSON.parse(orderData.content); noteOrder = Array.isArray(o) ? o : null; } catch (e) { noteOrder = null; }
                }
                applyNoteOrder();

                if (drawRes && drawRes.ok && window.NoteDraw) {
                    const rows = await drawRes.json();
                    drawings = new Map(rows.map(r => [r.note_id, NoteDraw.normalizeDoc(r.data)]));
                    drawingsAvailable = true;
                } else if (drawRes && drawRes.status === 404) {
                    drawingsAvailable = false;
                    console.warn("The worker has no /api/drawings route yet - deploy the updated worker to save drawings.");
                }

                renderUI();
            } catch (err) { console.error("Network error:", err); }
        }

        // Reload from the server when coming back to the tab, unless something
        // is mid-edit. Keeps this tab from overwriting newer edits made elsewhere.
        function refreshIfIdle() {
            if (hasPendingSaves() || expandedNoteId) return;
            const active = document.activeElement;
            const focusId = active && active.id;
            const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
            fetchItems().then(() => {
                if (!focusId) return;
                const again = document.getElementById(focusId);
                if (again) { again.focus(); if (caret !== null && again.setSelectionRange) again.setSelectionRange(caret, caret); }
            });
        }

        async function deleteItem(id) {
            if (!confirm("Delete this item?")) return;
            if (expandedNoteId === id) closeDraw();
            // Make sure a save that is still on its way can't bring the note back.
            await Promise.all([cancelJob(`item:${id}`), cancelJob(`draw:${id}`)]);
            const res = await fetch(`${API_BASE}/items/${encodeURIComponent(id)}`, { method: "DELETE", headers: getAuthHeader() });
            if (res.status === 401) { logout(); return; }
            drawings.delete(id);
            if (drawingsAvailable) {
                // older worker versions don't remove the drawing together with the note
                fetch(`${API_BASE}/drawings/${encodeURIComponent(id)}`, { method: "DELETE", headers: getAuthHeader() }).catch(() => {});
            }
            fetchItems();
        }

        function createNewNote() {
            if (searchQuery) {
                searchQuery = "";
                document.getElementById("searchInput").value = "";
            }
            const firstLineId = uid();
            const newItem = {
                id: crypto.randomUUID(),
                type: activeSection === 'ALL' ? null : activeSection,
                title: '',
                lines: [{ id: firstLineId, text: '', checked: null }],
                is_completed: 0
            };
            itemsCache.unshift(newItem);
            if (Array.isArray(noteOrder)) saveNoteOrder();
            renderUI();
            focusLine(newItem.id, firstLineId, 0);
        }

        function focusLine(itemId, lineId, caretPos) {
            setTimeout(() => {
                const node = document.getElementById(`line-${itemId}-${lineId}`);
                if (!node) return;
                node.focus();
                if (typeof caretPos === 'number') {
                    node.setSelectionRange(caretPos, caretPos);
                }
            }, 0);
        }

        function updateTitle(id, value) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            el.title = value;
            scheduleItemSave(id);
        }

        function handleLineInput(id, lineId, inputEl) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            const line = el.lines.find(l => l.id === lineId);
            if (!line) return;

            let value = inputEl.value;

            if (line.checked === null) {
                const match = value.match(/^\*\(\)\s?(.*)$/);
                if (match) {
                    line.checked = false;
                    line.text = match[1];
                    saveItem(id);
                    renderUI();
                    focusLine(id, lineId, line.text.length);
                    return;
                }
            }

            line.text = value;
            scheduleItemSave(id);

            const url = extractFirstURL(value);
            const linkBtnNode = document.getElementById(`url-btn-${id}-${lineId}`);
            if (linkBtnNode) {
                if (url) {
                    linkBtnNode.href = url;
                    linkBtnNode.classList.remove('hidden');
                } else {
                    linkBtnNode.classList.add('hidden');
                }
            }
        }

        function toggleCheck(id, lineId, checkbox) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            const line = el.lines.find(l => l.id === lineId);
            if (!line) return;
            line.checked = checkbox.checked;
            saveItem(id);
            renderUI();
        }

        function performEnterSplit(id, lineId, textareaEl) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            const idx = el.lines.findIndex(l => l.id === lineId);
            if (idx === -1) return;
            const line = el.lines[idx];

            const caret = textareaEl.selectionStart;
            const before = line.text.slice(0, caret);
            const after = line.text.slice(caret);
            line.text = before;

            const newLine = { id: uid(), text: after, checked: line.checked !== null ? false : null };
            el.lines.splice(idx + 1, 0, newLine);
            saveItem(id);
            renderUI();
            focusLine(id, newLine.id, 0);
        }

        function handleLineKeydown(e, id, lineId) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            const idx = el.lines.findIndex(l => l.id === lineId);
            if (idx === -1) return;
            const line = el.lines[idx];
            const inputEl = e.target;

            if (e.key === 'Enter') {
                e.preventDefault();
                performEnterSplit(id, lineId, inputEl);
                return;
            }

            if (e.key === 'Backspace') {
                const atStart = inputEl.selectionStart === 0 && inputEl.selectionEnd === 0;
                if (!atStart) return;

                if (line.checked !== null) {
                    e.preventDefault();
                    line.checked = null;
                    saveItem(id);
                    renderUI();
                    focusLine(id, lineId, 0);
                    return;
                }

                if (idx > 0) {
                    e.preventDefault();
                    const prev = el.lines[idx - 1];
                    const mergeCaret = prev.text.length;
                    prev.text = prev.text + line.text;
                    el.lines.splice(idx, 1);
                    saveItem(id);
                    renderUI();
                    focusLine(id, prev.id, mergeCaret);
                }
                return;
            }

            if (e.key === 'ArrowUp' && idx > 0 && inputEl.selectionStart === 0) {
                e.preventDefault();
                focusLine(id, el.lines[idx - 1].id, el.lines[idx - 1].text.length);
            }
            if (e.key === 'ArrowDown' && idx < el.lines.length - 1 && inputEl.selectionStart === line.text.length) {
                e.preventDefault();
                focusLine(id, el.lines[idx + 1].id, 0);
            }
        }

        async function copyNote(id, btn) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;

            const parts = [];
            if (el.title) parts.push(el.title);
            (el.lines || []).forEach(line => {
                if (line.checked === null) {
                    parts.push(line.text || '');
                } else {
                    parts.push(`${line.checked ? '[x]' : '[ ]'} ${line.text || ''}`);
                }
            });
            const text = parts.join('\n');

            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }

            if (btn) {
                const original = btn.textContent;
                btn.textContent = 'copied';
                setTimeout(() => { btn.textContent = original; }, 1200);
            }
        }

        // =====================================================================
        // DRAWING MODE
        // "draw" on a note opens it big (on top of everything) with the pen
        // tools. The drawing is saved separately from the note's text.
        // =====================================================================
        function postDrawing(id, opts) {
            const doc = drawings.get(id);
            const data = doc && !NoteDraw.isEmpty(doc) ? JSON.stringify(doc) : null;
            return apiPost("/drawings", { note_id: id, data }, opts).catch(err => {
                if (err.status === 404) {
                    drawingsAvailable = false;
                    err.retry = false;
                    err.userMessage = "not saved – update the worker";
                } else if (err.status === 413) {
                    err.userMessage = "drawing too large to save";
                }
                throw err;
            });
        }

        function queueDrawingSave(id) {
            queueSave(`draw:${id}`, (opts) => postDrawing(id, opts), 800);
        }

        function openDraw(id) {
            if (!window.NoteDraw) { alert("The drawing tools didn't load (draw.js). Check your connection and reload."); return; }
            const item = itemsCache.find(i => i.id === id);
            if (!item) return;
            if (expandedNoteId === id) return;
            if (expandedNoteId) closeDraw();
            expandedNoteId = id;
            saveItem(id); // a brand-new note must exist on the server before its drawing does
            drawEditor = NoteDraw.createEditor({
                doc: drawings.get(id) || NoteDraw.emptyDoc(),
                onChange: (doc) => { drawings.set(id, doc); queueDrawingSave(id); },
            });
            document.body.classList.add("overflow-hidden");
            document.getElementById("drawBackdrop").classList.remove("hidden");
            renderUI();
            updateSyncStatus();
            requestAnimationFrame(() => {
                if (!drawEditor) return;
                drawEditor.layout();
                const card = document.querySelector(`#notesGrid [data-id="${CSS.escape(id)}"]`);
                const slot = card && card.querySelector(".draw-slot");
                if (card && slot && slot.offsetTop > card.clientHeight * 0.45) card.scrollTop = slot.offsetTop - 12;
            });
        }

        function closeDraw() {
            if (!expandedNoteId) return;
            const id = expandedNoteId;
            expandedNoteId = null;
            if (drawEditor) { drawEditor.destroy(); drawEditor = null; }
            const j = saveJobs.get(`draw:${id}`);
            if (j && j.timer) { clearTimeout(j.timer); j.timer = null; runJob(`draw:${id}`); }
            document.body.classList.remove("overflow-hidden");
            document.getElementById("drawBackdrop").classList.add("hidden");
            renderUI();
            requestAnimationFrame(() => {
                const card = document.querySelector(`#notesGrid [data-id="${CSS.escape(id)}"]`);
                if (card) card.scrollIntoView({ block: "nearest" });
            });
        }

        function toggleDraw(id) {
            if (expandedNoteId === id) closeDraw(); else openDraw(id);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && expandedNoteId) { e.preventDefault(); closeDraw(); }
        });

        function renderDrawingPreviews() {
            if (!window.NoteDraw) return;
            const dark = document.documentElement.classList.contains("dark");
            document.querySelectorAll("#notesGrid .drawing-preview").forEach(box => {
                const doc = drawings.get(box.dataset.note);
                const canvas = box.querySelector("canvas");
                const w = box.clientWidth;
                if (!doc || !canvas || !w) return;
                NoteDraw.renderPreview(canvas, doc, { width: w, maxHeight: 320, dark });
            });
        }

        // Re-draw previews when the cards change width (rotate phone, resize window).
        let previewRaf = 0, lastGridWidth = 0;
        new ResizeObserver(() => {
            if (previewRaf) return;
            previewRaf = requestAnimationFrame(() => {
                previewRaf = 0;
                const w = document.getElementById("notesGrid").clientWidth;
                if (w !== lastGridWidth) { lastGridWidth = w; renderDrawingPreviews(); }
            });
        }).observe(document.getElementById("notesGrid"));

        // --- BOOKMARKS & FOLDERS ---
        function saveBookmarksToDatabase() {
            return saveNow("sys:bookmarks", (opts) => apiPost("/items", {
                id: "SYSTEM_BOOKMARKS_CONFIG",
                type: "SYSTEM_INTERNAL",
                title: "SYSTEM_BOOKMARKS",
                content: JSON.stringify(bookmarks),
                is_completed: 0
            }, opts));
        }

        function addBookmarkPrompt() {
            const choice = prompt("Type 'link' to add a Direct Link, or 'folder' to create a Folder:", "link");
            if (!choice) return;

            if (choice.trim().toLowerCase() === 'folder') {
                const folderTitle = prompt("Folder Name:");
                if (folderTitle) {
                    bookmarks.push({ id: uid(), type: 'folder', title: folderTitle.trim(), children: [] });
                    saveBookmarksToDatabase();
                    renderUI();
                }
            } else if (choice.trim().toLowerCase() === 'link') {
                const title = prompt("Link Title:");
                if (!title) return;
                let url = prompt("Link URL:");
                if (!url) return;
                url = url.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

                bookmarks.push({ id: uid(), type: 'link', title: title.trim(), url });
                saveBookmarksToDatabase();
                renderUI();
            }
        }

        function addLinkToFolder(folderId, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const folder = bookmarks.find(b => b.id === folderId);
            if (!folder) return;

            const title = prompt("Link Title:");
            if (!title) return;
            let url = prompt("Link URL:");
            if (!url) return;
            url = url.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

            folder.children = folder.children || [];
            folder.children.push({ id: uid(), type: 'link', title: title.trim(), url });
            saveBookmarksToDatabase();
            renderUI();
        }

        function deleteBookmark(id, folderId = null, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            if (!confirm("Delete this bookmark?")) return;
            if (folderId) {
                const folder = bookmarks.find(b => b.id === folderId);
                if (folder) folder.children = (folder.children || []).filter(c => c.id !== id);
            } else {
                bookmarks = bookmarks.filter(b => b.id !== id);
                if (activeOpenFolderId === id) activeOpenFolderId = null;
            }
            saveBookmarksToDatabase();
            renderUI();
        }

        function toggleFolderDropdown(folderId, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            activeOpenFolderId = (activeOpenFolderId === folderId) ? null : folderId;
            renderBookmarks();
        }

        // One Sortable per container. Previously a new one was stacked on the
        // same element at every re-render, so drag handlers piled up.
        const sortables = {};
        function makeSortable(key, el, options) {
            if (sortables[key]) { try { sortables[key].destroy(); } catch (e) { /* element was replaced */ } }
            sortables[key] = new Sortable(el, options);
        }

        function renderBookmarks() {
            const container = document.getElementById("bookmarksContainer");
            container.innerHTML = "";

            if (bookmarks.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-400 dark:text-slate-500 italic pl-1">No shortcuts added yet. Click "+ Link / Folder".</span>`;
                return;
            }

            bookmarks.forEach(bm => {
                const itemDiv = document.createElement("div");
                itemDiv.dataset.id = bm.id;

                if (bm.type === 'link') {
                    itemDiv.className = "flex items-center gap-1.5 bg-white dark:bg-slate-800 px-2.5 py-1 rounded text-xs border border-slate-200 dark:border-slate-700/60 shadow-sm group";
                    itemDiv.innerHTML = `
                        <a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener noreferrer" class="hover:underline text-slate-700 dark:text-slate-200 font-medium">
                            ${escapeHtml(bm.title)}
                        </a>
                        <button onclick="deleteBookmark('${bm.id}', null, event)" class="text-slate-400 hover:text-red-500 font-bold ml-1 sm:opacity-0 group-hover:opacity-100 transition">×</button>
                    `;
                } else if (bm.type === 'folder') {
                    const isOpen = activeOpenFolderId === bm.id;
                    itemDiv.className = "relative inline-block";

                    let childrenHtml = (bm.children || []).map(child => `
                        <div class="flex items-center justify-between gap-3 px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs text-slate-700 dark:text-slate-200">
                            <a href="${escapeHtml(child.url)}" target="_blank" rel="noopener noreferrer" class="hover:underline truncate py-0.5">
                                ${escapeHtml(child.title)}
                            </a>
                            <button onclick="deleteBookmark('${child.id}', '${bm.id}', event)" class="text-slate-400 hover:text-red-500 font-bold ml-2 p-1">×</button>
                        </div>
                    `).join('');

                    itemDiv.innerHTML = `
                        <button onclick="toggleFolderDropdown('${bm.id}', event)" class="flex items-center gap-1 bg-slate-200 dark:bg-slate-700/80 hover:bg-slate-300 dark:hover:bg-slate-600 px-2.5 py-1 rounded text-xs font-medium text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition">
                            <span>${escapeHtml(bm.title)}</span>
                            <span class="text-[9px] text-slate-400 ml-1">${isOpen ? '▲' : '▼'}</span>
                        </button>

                        <div class="${isOpen ? 'block' : 'hidden'} absolute top-full left-0 mt-1.5 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg z-50 py-1">
                            ${childrenHtml || '<div class="px-3 py-1 text-[11px] text-slate-400 italic">Folder empty</div>'}
                            <div class="border-t border-slate-200 dark:border-slate-700 mt-1 pt-1 flex justify-between px-2 py-1">
                                <button onclick="addLinkToFolder('${bm.id}', event)" class="text-[11px] font-semibold text-blue-500 hover:underline p-0.5">
                                    + Add Link
                                </button>
                                <button onclick="deleteBookmark('${bm.id}', null, event)" class="text-[11px] font-semibold text-red-500 hover:underline p-0.5">
                                    Delete Folder
                                </button>
                            </div>
                        </div>
                    `;
                }
                container.appendChild(itemDiv);
            });

            makeSortable("bookmarks", container, {
                animation: 150,
                delay: 150,
                delayOnTouchOnly: true,
                onEnd: function () {
                    const newOrderIds = Array.from(container.children).map(child => child.dataset.id);
                    bookmarks = newOrderIds.map(id => bookmarks.find(b => b.id === id)).filter(Boolean);
                    saveBookmarksToDatabase();
                }
            });
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: "pt", format: "a4" });

            const filtered = itemsCache.filter(item =>
                !isSystemItem(item) &&
                (activeSection === 'ALL' || item.type === activeSection)
            );

            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 40;
            const contentWidth = pageWidth - (margin * 2);

            let y = margin;

            // Drawings are rendered to images first (always on white, dark ink).
            const drawingImages = new Map();
            if (window.NoteDraw) {
                const maxW = contentWidth - 24;
                const maxH = pageHeight - (margin * 2) - 80;
                filtered.forEach(item => {
                    const d = drawings.get(item.id);
                    if (!d || NoteDraw.isEmpty(d)) return;
                    const img = NoteDraw.renderToDataURL(d, { pxWidth: 1400, dark: false });
                    let w = maxW, h = maxW * (img.height / img.width);
                    if (h > maxH) { h = maxH; w = h * (img.width / img.height); }
                    drawingImages.set(item.id, { url: img.url, w, h });
                });
            }

            // --- Header Setup ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.setTextColor(30, 41, 59); // Slate-800
            doc.text(`Notes - ${activeSection}`, margin, y + 15);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.setTextColor(148, 163, 184); // Slate-400
            const exportDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            doc.text(`Exported: ${exportDate}`, pageWidth - margin, y + 15, { align: "right" });

            y += 30;

            // Header Divider Line
            doc.setDrawColor(226, 232, 240); // Slate-200
            doc.setLineWidth(1);
            doc.line(margin, y, pageWidth - margin, y);
            y += 20;

            // --- SECTION 1: BOOKMARKS EXPORT ---
            if (bookmarks.length > 0) {
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(30, 41, 59);
                doc.text("Bookmarks & Shortcuts", margin, y);
                y += 14;

                doc.setFont("helvetica", "normal");
                doc.setFontSize(9.5);

                bookmarks.forEach(bm => {
                    if (bm.type === 'link') {
                        if (y + 16 > pageHeight - margin) { doc.addPage(); y = margin; }
                        doc.setTextColor(51, 65, 85);
                        doc.text(`• ${bm.title}: `, margin + 10, y);
                        const titleWidth = doc.getTextWidth(`• ${bm.title}: `);
                        doc.setTextColor(37, 99, 235); // Blue link
                        doc.textWithLink(bm.url, margin + 10 + titleWidth, y, { url: bm.url });
                        y += 14;
                    } else if (bm.type === 'folder') {
                        if (y + 24 > pageHeight - margin) { doc.addPage(); y = margin; }
                        doc.setFont("helvetica", "bold");
                        doc.setTextColor(71, 85, 105);
                        // (The PDF's built-in font can't draw emoji, so the old folder icon came out garbled.)
                        doc.text(`Folder: ${bm.title}`, margin + 5, y);
                        y += 14;

                        doc.setFont("helvetica", "normal");
                        if (!bm.children || bm.children.length === 0) {
                            doc.setTextColor(148, 163, 184);
                            doc.text("(empty folder)", margin + 20, y);
                            y += 14;
                        } else {
                            bm.children.forEach(child => {
                                if (y + 16 > pageHeight - margin) { doc.addPage(); y = margin; }
                                doc.setTextColor(51, 65, 85);
                                doc.text(`• ${child.title}: `, margin + 20, y);
                                const childTitleWidth = doc.getTextWidth(`• ${child.title}: `);
                                doc.setTextColor(37, 99, 235);
                                doc.textWithLink(child.url, margin + 20 + childTitleWidth, y, { url: child.url });
                                y += 14;
                            });
                        }
                    }
                });

                y += 10;
                doc.setDrawColor(241, 245, 249);
                doc.setLineWidth(0.5);
                doc.line(margin, y, pageWidth - margin, y);
                y += 20;
            }

            // --- Helper: Estimate Note Height ---
            function calculateNoteHeight(item) {
                let h = 16; // Top padding inside card
                const titleText = item.title || "Untitled Note";
                const splitTitle = doc.splitTextToSize(titleText, contentWidth - 24);
                h += (splitTitle.length * 14) + 4; // Title height
                h += 10; // Divider spacing

                (item.lines || []).forEach(line => {
                    const textStr = line.text || "";
                    const textIndent = line.checked !== null ? 44 : 24;
                    const splitText = doc.splitTextToSize(textStr, contentWidth - textIndent);
                    h += (splitText.length * 13) + (line.checked !== null ? 4 : 2);
                });

                const img = drawingImages.get(item.id);
                if (img) h += img.h + 10;

                h += 6; // Bottom padding inside card
                return h;
            }

            // --- SECTION 2: NOTES EXPORT ---
            if (filtered.length === 0) {
                doc.setFont("helvetica", "italic");
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text("No notes available in this section.", margin, y);
            }

            filtered.forEach((item, index) => {
                const estimatedHeight = calculateNoteHeight(item);
                const printableAreaHeight = pageHeight - (margin * 2);

                // Prevent Note Splitting Across Pages:
                // If a note fits entirely on one page, but doesn't fit in remaining space on current page, start a clean new page.
                if (estimatedHeight <= printableAreaHeight && (y + estimatedHeight > pageHeight - margin)) {
                    doc.addPage();
                    y = margin;
                }

                let cardStartY = y;
                let cardInternalY = y + 16;

                // Card Title
                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.setTextColor(15, 23, 42); // Slate-900
                const titleText = item.title || `Untitled Note #${index + 1}`;
                const splitTitle = doc.splitTextToSize(titleText, contentWidth - 24);

                doc.text(splitTitle, margin + 12, cardInternalY);
                cardInternalY += (splitTitle.length * 14) + 4;

                // Inner divider under title
                doc.setDrawColor(241, 245, 249); // Slate-100
                doc.setLineWidth(0.5);
                doc.line(margin + 12, cardInternalY, pageWidth - margin - 12, cardInternalY);
                cardInternalY += 10;

                // Lines / Tasks Content
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);

                (item.lines || []).forEach(line => {
                    const textStr = line.text || "";

                    // Multi-page fallback check for exceptionally large notes (> 1 full page)
                    if (cardInternalY > pageHeight - margin - 20) {
                        doc.addPage();
                        cardInternalY = margin + 15;
                        cardStartY = margin;
                    }

                    if (line.checked !== null) {
                        // Task / Checklist Item
                        const isChecked = line.checked;

                        // Checkbox Box Drawing
                        doc.setDrawColor(isChecked ? 100 : 148, isChecked ? 116 : 163, isChecked ? 139 : 184);
                        doc.setFillColor(isChecked ? 226 : 255, isChecked ? 232 : 255, isChecked ? 240 : 255);
                        doc.roundedRect(margin + 12, cardInternalY - 7, 9, 9, 2, 2, "FD");

                        if (isChecked) {
                            // Draw Checkmark
                            doc.setDrawColor(71, 85, 105);
                            doc.setLineWidth(1);
                            doc.line(margin + 14, cardInternalY - 3, margin + 16, cardInternalY - 1);
                            doc.line(margin + 16, cardInternalY - 1, margin + 19, cardInternalY - 6);
                            doc.setLineWidth(0.5); // Reset line width

                            doc.setTextColor(148, 163, 184); // Strikethrough/Muted color
                        } else {
                            doc.setTextColor(51, 65, 85);
                        }

                        const splitText = doc.splitTextToSize(textStr, contentWidth - 44);
                        doc.text(splitText, margin + 26, cardInternalY);

                        // Draw Strikethrough line if checked
                        if (isChecked && textStr.trim().length > 0) {
                            const textWidth = doc.getTextWidth(splitText[0]);
                            doc.setDrawColor(148, 163, 184);
                            doc.line(margin + 26, cardInternalY - 3, margin + 26 + Math.min(textWidth, contentWidth - 44), cardInternalY - 3);
                        }

                        cardInternalY += (splitText.length * 13) + 4;
                    } else {
                        // Standard Text Line
                        doc.setTextColor(51, 65, 85);
                        const splitText = doc.splitTextToSize(textStr, contentWidth - 24);
                        doc.text(splitText, margin + 12, cardInternalY);
                        cardInternalY += (splitText.length * 13) + 2;
                    }
                });

                // Drawing
                const img = drawingImages.get(item.id);
                if (img) {
                    if (cardInternalY + img.h > pageHeight - margin) {
                        doc.addPage();
                        cardInternalY = margin + 12;
                        cardStartY = margin;
                    }
                    doc.addImage(img.url, "PNG", margin + 12, cardInternalY, img.w, img.h, undefined, "FAST");
                    cardInternalY += img.h + 10;
                }

                cardInternalY += 6; // Bottom padding

                // Draw Background Card Outline
                const cardHeight = cardInternalY - cardStartY;
                doc.setDrawColor(226, 232, 240); // Slate-200 border
                doc.setFillColor(255, 255, 255); // White background
                doc.roundedRect(margin, cardStartY, contentWidth, cardHeight, 6, 6, "S");

                y = cardInternalY + 14; // Gap before next card
            });

            // Footer Page Numbers
            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184);
                doc.text(`Page ${i} of ${totalPages}`, pageWidth / 2, pageHeight - 20, { align: "center" });
            }

            doc.save(`notes_${activeSection.toLowerCase()}_${Date.now()}.pdf`);
        }

        function saveSectionsToDatabase(updatedSectionsList) {
            return saveNow("sys:sections", (opts) => apiPost("/items", {
                id: "SYSTEM_SECTIONS_CONFIG",
                type: "SYSTEM_INTERNAL",
                title: "SYSTEM_SECTIONS",
                content: JSON.stringify(updatedSectionsList || sections),
                is_completed: 0
            }, opts));
        }

        async function addSection() {
            const raw = prompt("Enter new section/type name:");
            if (!raw) return;
            const name = raw.trim();
            if (name && !sections.includes(name)) {
                sections.push(name);
                await saveSectionsToDatabase(sections);
                selectSection(name);
            }
        }

        async function deleteSection(name, event) {
            event.stopPropagation();
            if (name === "ALL") {
                alert("Cannot delete the 'ALL' section.");
                return;
            }
            if (confirm(`Delete section "${name}"? Notes in it will be moved to uncategorized.`)) {
                sections = sections.filter(s => s !== name);
                await saveSectionsToDatabase(sections);

                // Notes in the deleted section become uncategorized.
                // (Needs the updated worker, which now saves `type` changes.)
                const orphaned = itemsCache.filter(i => i.type === name);
                for (const item of orphaned) {
                    item.type = null;
                    await saveItem(item.id);
                }

                if (activeSection === name) {
                    activeSection = "ALL";
                    localStorage.setItem("active_section", "ALL");
                }
                fetchItems();
            }
        }

        function selectSection(name) {
            activeSection = name;
            localStorage.setItem("active_section", name);
            renderUI();
        }

        async function changeNoteSection(id, selectElement) {
            const el = itemsCache.find(i => i.id === id);
            if (!el) return;
            el.type = selectElement.value || null;
            renderUI();
            // The worker used to ignore `type` when updating an existing note,
            // which is why category changes reverted after a reload. Fixed in
            // the worker; the frontend just has to send it.
            await saveItem(id);
        }

        function noteMatches(item, q) {
            if ((item.title || "").toLowerCase().includes(q)) return true;
            return (item.lines || []).some(l => (l.text || "").toLowerCase().includes(q));
        }

        // --- NOTE CARD ---
        const CARD_CLASSES = "p-4 rounded-lg bg-white dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700/60 transition flex flex-col justify-between space-y-3 shadow-sm dark:shadow-none";
        const EXPANDED_CARD_CLASSES = "note-expanded fixed inset-0 sm:inset-4 lg:inset-y-6 z-50 mx-auto w-full max-w-5xl overflow-y-auto overscroll-contain p-3 sm:p-5 sm:rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-2xl flex flex-col justify-between space-y-3";

        function buildNoteCard(item) {
            const isExpanded = item.id === expandedNoteId;
            const hasDrawing = window.NoteDraw && drawings.has(item.id) && !NoteDraw.isEmpty(drawings.get(item.id));
            const card = document.createElement("div");
            card.dataset.id = item.id;
            card.className = isExpanded ? EXPANDED_CARD_CLASSES : CARD_CLASSES;

            const handleHtml = isExpanded
                ? ''
                : `<span class="card-handle cursor-grab active:cursor-grabbing text-slate-400 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-300 text-sm select-none p-1" title="Drag card">⋮⋮</span>`;

            const titleHtml = `<input id="title-${item.id}" value="${escapeHtml(item.title || '')}" placeholder="Untitled" class="w-full bg-transparent font-medium text-slate-800 dark:text-slate-200 focus:outline-none placeholder-slate-400 dark:placeholder-slate-600 ${isExpanded ? 'text-lg' : 'text-base'}">`;

            const doneHtml = isExpanded
                ? `<button data-action="close-draw" class="shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 hover:opacity-90 transition">done</button>`
                : '';

            let inner = `
                <div class="w-full">
                    <div class="flex items-center gap-2 mb-2">
                        ${handleHtml}
                        ${titleHtml}
                        ${doneHtml}
                    </div>
                    <div class="lines-list space-y-1">`;

            (item.lines || []).forEach(line => {
                const foundUrl = extractFirstURL(line.text);
                const linkBtnClass = foundUrl ? "" : "hidden";

                if (line.checked === null) {
                    inner += `
                        <div data-line-id="${line.id}" class="line-item flex items-start gap-1 group">
                            <span class="line-handle cursor-grab active:cursor-grabbing text-slate-300 dark:text-slate-700 hover:text-slate-500 dark:hover:text-slate-400 text-xs mt-1 select-none opacity-50 sm:opacity-0 group-hover:opacity-100 transition p-0.5">⋮⋮</span>
                            <textarea id="line-${item.id}-${line.id}" data-id="${item.id}" data-line="${line.id}" rows="1" placeholder="write..." class="line-input w-full bg-transparent text-sm text-slate-700 dark:text-slate-300 focus:outline-none placeholder-slate-400 dark:placeholder-slate-600 py-0.5 resize-none overflow-hidden leading-snug break-words">${escapeHtml(line.text)}</textarea>
                            <a id="url-btn-${item.id}-${line.id}" href="${escapeHtml(foundUrl || '#')}" target="_blank" rel="noopener noreferrer" class="${linkBtnClass} shrink-0 text-[10px] font-semibold text-blue-500 hover:underline bg-blue-50 dark:bg-blue-950/40 px-1.5 py-0.5 rounded mt-0.5 transition">↗ open</a>
                        </div>`;
                } else {
                    inner += `
                        <div data-line-id="${line.id}" class="line-item flex items-start gap-1 group">
                            <span class="line-handle cursor-grab active:cursor-grabbing text-slate-300 dark:text-slate-700 hover:text-slate-500 dark:hover:text-slate-400 text-xs mt-1 select-none opacity-50 sm:opacity-0 group-hover:opacity-100 transition p-0.5">⋮⋮</span>
                            <div class="flex items-start gap-2 w-full">
                                <input type="checkbox" ${line.checked ? 'checked' : ''} onchange="toggleCheck('${item.id}','${line.id}', this)" class="h-3.5 w-3.5 mt-1.5 rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-900 checked:bg-slate-500 focus:ring-0 shrink-0">
                                <textarea id="line-${item.id}-${line.id}" data-id="${item.id}" data-line="${line.id}" rows="1" placeholder="task..." class="line-input w-full bg-transparent text-sm focus:outline-none py-0.5 resize-none overflow-hidden leading-snug break-words ${line.checked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-300'}">${escapeHtml(line.text)}</textarea>
                                <a id="url-btn-${item.id}-${line.id}" href="${escapeHtml(foundUrl || '#')}" target="_blank" rel="noopener noreferrer" class="${linkBtnClass} shrink-0 text-[10px] font-semibold text-blue-500 hover:underline bg-blue-50 dark:bg-blue-950/40 px-1.5 py-0.5 rounded mt-0.5 transition">↗ open</a>
                            </div>
                        </div>`;
                }
            });

            inner += `
                    </div>`;

            if (isExpanded) {
                inner += `<div class="draw-slot mt-3"></div>`;
            } else if (hasDrawing) {
                inner += `
                    <div class="drawing-preview mt-3 rounded-md overflow-hidden cursor-pointer" data-note="${escapeHtml(item.id)}" title="Open drawing">
                        <canvas></canvas>
                    </div>`;
            }
            inner += `
                </div>`;

            const customSections = sections.filter(s => s !== 'ALL');
            let options = `<option value="" ${!item.type ? 'selected' : ''}>uncategorized</option>`;
            if (item.type && !customSections.includes(item.type)) {
                // The note's stored type doesn't match any current section
                // (e.g. that section was deleted). Show it explicitly rather
                // than letting the dropdown silently show "uncategorized".
                options += `<option value="${escapeHtml(item.type)}" selected>${escapeHtml(item.type)} (deleted)</option>`;
            }
            options += customSections.map(s => `<option value="${escapeHtml(s)}" ${item.type === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('');

            const drawLabel = isExpanded ? 'done' : (hasDrawing ? 'edit drawing' : 'draw');
            const footerArea = `
                <div class="flex justify-end items-center border-t border-slate-200 dark:border-slate-800/50 pt-2 text-xs text-slate-400 dark:text-slate-500">
                    <div class="flex items-center gap-3">
                        <button data-action="toggle-draw" class="flex items-center gap-1 text-slate-500 dark:text-slate-500 hover:text-slate-800 dark:hover:text-slate-300 transition" title="Draw or write with a pen, finger or mouse">
                            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/></svg>
                            <span>${drawLabel}</span>
                        </button>
                        <button onclick="copyNote('${item.id}', this)" class="text-slate-500 dark:text-slate-600 hover:text-slate-800 dark:hover:text-slate-300 transition">copy</button>
                        <select onchange="changeNoteSection('${item.id}', this)" class="bg-transparent text-slate-500 dark:text-slate-500 hover:text-slate-700 dark:hover:text-slate-400 border-none focus:ring-0 cursor-pointer text-xs p-0 w-24">
                            ${options}
                        </select>
                        <button onclick="deleteItem('${item.id}')" class="text-slate-500 dark:text-slate-600 hover:text-red-500 transition">delete</button>
                    </div>
                </div>`;

            card.innerHTML = inner + footerArea;

            const titleInput = card.querySelector(`#title-${CSS.escape(item.id)}`);
            if (titleInput) {
                titleInput.addEventListener('input', () => updateTitle(item.id, titleInput.value));
            }

            card.querySelectorAll('[data-action="toggle-draw"]').forEach(b => b.addEventListener('click', () => toggleDraw(item.id)));
            card.querySelectorAll('[data-action="close-draw"]').forEach(b => b.addEventListener('click', () => closeDraw()));
            const preview = card.querySelector('.drawing-preview');
            if (preview) preview.addEventListener('click', () => openDraw(item.id));
            if (isExpanded && drawEditor) card.querySelector('.draw-slot').appendChild(drawEditor.el);

            card.querySelectorAll('.line-input').forEach(inputEl => {
                const lineId = inputEl.dataset.line;
                inputEl.addEventListener('input', () => { autoGrow(inputEl); handleLineInput(item.id, lineId, inputEl); });
                inputEl.addEventListener('keydown', (e) => handleLineKeydown(e, item.id, lineId));
                inputEl.addEventListener('beforeinput', (e) => {
                    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
                        e.preventDefault();
                        performEnterSplit(item.id, lineId, inputEl);
                    }
                });
            });

            const linesContainer = card.querySelector('.lines-list');
            new Sortable(linesContainer, {
                handle: '.line-handle',
                animation: 150,
                onEnd: function () {
                    const lineElements = Array.from(linesContainer.querySelectorAll('.line-item'));
                    const newLinesOrder = lineElements.map(el => {
                        const lId = el.dataset.lineId;
                        return item.lines.find(l => l.id === lId);
                    }).filter(Boolean);

                    item.lines = newLinesOrder;
                    saveItem(item.id);
                }
            });

            return card;
        }

        function renderUI() {
            renderBookmarks();
            applyBookmarksVisibility();

            // --- Render Section Tabs ---
            const sectContainer = document.getElementById("sectionsContainer");
            sectContainer.innerHTML = "";

            sections.forEach(s => {
                const tab = document.createElement("div");
                tab.dataset.section = s;
                tab.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium transition cursor-pointer whitespace-nowrap shrink-0 ${
                    activeSection === s
                        ? 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-100'
                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'
                }`;
                tab.onclick = () => selectSection(s);

                const textSpan = document.createElement("span");
                textSpan.textContent = s;
                tab.appendChild(textSpan);

                if (s !== "ALL") {
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "text-[10px] text-slate-400 dark:text-slate-500 hover:text-red-500 font-bold px-1 rounded";
                    deleteBtn.textContent = "×";
                    deleteBtn.onclick = (e) => deleteSection(s, e);
                    tab.appendChild(deleteBtn);
                }
                sectContainer.appendChild(tab);
            });

            makeSortable("sections", sectContainer, {
                animation: 150,
                delay: 150,
                delayOnTouchOnly: true,
                onEnd: function () {
                    const newOrder = Array.from(sectContainer.children).map(child => child.dataset.section);
                    sections = newOrder;
                    saveSectionsToDatabase(sections);
                }
            });

            // --- Render Notes Grid ---
            const grid = document.getElementById("notesGrid");
            const openCard = expandedNoteId && grid.querySelector(`[data-id="${CSS.escape(expandedNoteId)}"]`);
            const openScroll = openCard ? openCard.scrollTop : 0;
            grid.innerHTML = "";

            const q = searchQuery.trim().toLowerCase();
            const filtered = itemsCache.filter(item =>
                !isSystemItem(item) &&
                (activeSection === 'ALL' || item.type === activeSection) &&
                (!q || noteMatches(item, q))
            );
            // Never lose the note that is open in drawing mode.
            if (expandedNoteId && !filtered.some(i => i.id === expandedNoteId)) {
                const ex = itemsCache.find(i => i.id === expandedNoteId);
                if (ex) filtered.push(ex);
            }

            if (filtered.length === 0) {
                const empty = document.createElement("div");
                empty.className = "col-span-full text-center text-sm text-slate-400 dark:text-slate-600 py-16";
                empty.textContent = q ? `No notes match “${searchQuery.trim()}”.` : "No notes here yet — press + to make one.";
                grid.appendChild(empty);
            }

            filtered.forEach(item => grid.appendChild(buildNoteCard(item)));
            // auto-size textareas once they are in the page
            grid.querySelectorAll('.line-input').forEach(autoGrow);
            renderDrawingPreviews();
            if (openScroll) {
                const again = grid.querySelector(`[data-id="${CSS.escape(expandedNoteId)}"]`);
                if (again) again.scrollTop = openScroll;
            }

            makeSortable("grid", grid, {
                handle: '.card-handle',
                animation: 150,
                disabled: !!expandedNoteId,
                onEnd: function () {
                    // Put the dragged cards in their new order, keeping notes that
                    // aren't visible (other sections / search) where they were.
                    const byId = new Map(itemsCache.map(i => [i.id, i]));
                    const visibleIds = Array.from(grid.children).map(c => c.dataset.id).filter(id => byId.has(id));
                    const visible = new Set(visibleIds);
                    let k = 0;
                    itemsCache = itemsCache.map(i => visible.has(i.id) ? byId.get(visibleIds[k++]) : i);
                    saveNoteOrder(); // previously the order was lost on reload
                }
            });
        }

        // --- SEARCH ---
        let searchTimer = null;
        document.getElementById("searchInput").addEventListener("input", (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { searchQuery = e.target.value; renderUI(); }, 120);
        });

        fetchItems();
    </script>
</body>
</html>
