<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export All Notes to PDF</title>
  
  <!-- html2pdf.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px;
      color: #333;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0052a3;
    }

    /* Container for PDF generation */
    #pdf-container {
      margin-top: 20px;
    }

    /* Styles applied inside the generated PDF */
    .pdf-note-page {
      padding: 24px;
      background: white;
      /* Forces each note onto a new page in the PDF */
      page-break-after: always;
    }

    .pdf-note-page:last-child {
      page-break-after: auto;
    }

    .note-title {
      font-size: 22px;
      margin-top: 0;
      color: #111;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
    }

    .note-content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap; /* Keeps line breaks */
    }

    /* Clickable Link Styling for PDF */
    .note-content a {
      color: #0066cc;
      text-decoration: underline;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <button id="export-btn">Export ALL Notes to PDF</button>

  <!-- Container where rendered notes will be placed before PDF generation -->
  <div id="pdf-container"></div>

  <script>
    // Sample Data Source: 'ALL' notes
    const ALL_NOTES = [
      {
        id: "1",
        title: "Project Kickoff & Resources",
        body: "Here are the important links for the project:\n- Documentation: [Project Docs](https://example.com/docs)\n- Repo: https://github.com/example/repo"
      },
      {
        id: "2",
        title: "Research & References",
        body: "Check out the guidelines at [MDN Web Docs](https://developer.mozilla.org) or visit https://wikipedia.org directly for general inquiries."
      },
      {
        id: "3",
        title: "Architecture Overview",
        body: "Review system specs on the internal wiki: [System Architecture](https://internal.example.com/arch)."
      }
    ];

    /**
     * Converts Markdown links [Label](URL) and raw text URLs into HTML <a> tags.
     */
    function formatLinksToHTML(text) {
      if (!text) return '';

      // 1. Convert Markdown links [text](url) -> <a href="url">text</a>
      let formatted = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // 2. Convert plain URLs (http:// or https://) not already inside an <a> tag
      const urlPattern = /(?<!href="|href=')\b(https?:\/\/[^\s<]+)/gi;
      formatted = formatted.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');

      return formatted;
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    /**
     * Main export function: renders ALL notes into the DOM and triggers PDF download.
     */
    async function exportAllNotesToPDF() {
      const container = document.getElementById('pdf-container');
      container.innerHTML = ''; // Clear prior renders

      // Render every note from ALL_NOTES into the container
      ALL_NOTES.forEach((note) => {
        const noteEl = document.createElement('article');
        noteEl.className = 'pdf-note-page';

        const formattedBody = formatLinksToHTML(note.body);

        noteEl.innerHTML = `
          <h1 class="note-title">${escapeHTML(note.title)}</h1>
          <div class="note-content">${formattedBody}</div>
        `;

        container.appendChild(noteEl);
      });

      // Configure PDF generation options
      const options = {
        margin: 10,
        filename: 'all_notes.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      // Generate and download the PDF
      await html2pdf().set(options).from(container).save();
    }

    // Attach click handler
    document.getElementById('export-btn').addEventListener('click', exportAllNotesToPDF);
  </script>
</body>
</html>
