<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Vault</title>
  <!-- jsPDF CDN for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-json {
      background: #3b82f6;
      color: #ffffff;
    }
    .btn-json:hover { background: #2563eb; }
    .btn-pdf {
      background: #ef4444;
      color: #ffffff;
    }
    .btn-pdf:hover { background: #dc2626; }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      display: none;
    }
    .status.error { background: #7f1d1d; color: #fca5a5; display: block; }
    .status.success { background: #14532d; color: #86efac; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>My Encrypted Vault</h2>
      <div class="btn-group">
        <button class="btn-json" onclick="exportVaultJSON()">Export JSON</button>
        <button class="btn-pdf" onclick="exportVaultPDF()">Export PDF</button>
      </div>
    </div>

    <div id="statusMessage" class="status"></div>
  </div>

  <script>
    // Global array keeping decrypted items in memory
    // (This should be populated when your app decrypts the vault on login)
    window.decryptedVaultItems = window.decryptedVaultItems || [];

    function showStatus(msg, isError = false) {
      const el = document.getElementById('statusMessage');
      el.textContent = msg;
      el.className = `status ${isError ? 'error' : 'success'}`;
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    /**
     * Fetches fresh encrypted data from API and exports as a raw JSON backup
     */
    async function exportVaultJSON() {
      const token = sessionStorage.getItem('session_token');
      if (!token) {
        showStatus('Export failed: No active session. Please log in first.', true);
        return;
      }

      try {
        const response = await fetch('/api/items', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP status ${response.status}`);
        }

        const items = await response.json();

        // Create download blob
        const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `vault-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showStatus('JSON Backup successfully exported!');
      } catch (err) {
        showStatus('Error downloading JSON backup: ' + err.message, true);
      }
    }

    /**
     * Generates a printable plain-text PDF document from local decrypted items
     */
    async function exportVaultPDF() {
      if (!window.decryptedVaultItems || window.decryptedVaultItems.length === 0) {
        showStatus('Export failed: No decrypted vault items found in memory. Log in and unlock your vault first.', true);
        return;
      }

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Header styling
        doc.setFontSize(18);
        doc.text("Password Vault Backup", 14, 20);
        doc.setFontSize(9);
        doc.setTextColor(100);
        doc.text(`Generated: ${new Date().toLocaleString()} | Unencrypted File`, 14, 27);
        doc.setLineWidth(0.5);
        doc.line(14, 31, 196, 31);
        
        let y = 40;
        doc.setTextColor(0);

        // Render each decrypted item
        window.decryptedVaultItems.forEach((item, index) => {
          // Add a new page if reaching the bottom margin
          if (y > 260) {
            doc.addPage();
            y = 20;
          }
          
          doc.setFontSize(12);
          doc.setFont("helvetica", "bold");
          doc.text(`${index + 1}. ${item.title || 'Untitled Entry'}`, 14, y);
          
          doc.setFontSize(10);
          doc.setFont("helvetica", "normal");
          doc.text(`Username: ${item.username || '—'}`, 20, y + 6);
          doc.text(`Password: ${item.password || '—'}`, 20, y + 12);
          if (item.url) {
            doc.text(`URL: ${item.url}`, 20, y + 18);
            y += 26;
          } else {
            y += 20;
          }
        });

        doc.save(`vault-backup-${new Date().toISOString().slice(0, 10)}.pdf`);
        showStatus('PDF Backup successfully exported!');
      } catch (err) {
        showStatus('Error generating PDF: ' + err.message, true);
      }
    }
  </script>
</body>
</html>
