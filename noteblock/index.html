<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noteblock</title>
    <style>
        /* Reset and basic styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            height: 100%;
            background-color: #fdfdfd; /* Off-white paper feel */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The scratchpad area */
        textarea {
            width: 100%;
            height: 100%;
            padding: 40px;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            
            /* Text styling */
            font-size: 18px;
            line-height: 1.6;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <textarea placeholder="Start typing... (Reloading will clear everything)" autofocus></textarea>

</body>
</html>
