<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Booking Notes</title>
    <style>
        /* Base Reset & Sleek Dark Mode */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-weight: 300;
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Form Layout */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .label-text {
            display: block;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Input Styling */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 45px 12px 14px; /* Space for copy button */
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s, background-color 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4a90e2;
            background-color: #2d2d2d;
        }

        /* Booking code capitalized & bold */
        .booking-code {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 3 Columns for Ref inputs */
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        /* Main Notes Field */
        textarea {
            height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        /* Copy Button Overlay */
        .copy-btn {
            position: absolute;
            right: 10px;
            bottom: 8px;
            background: none;
            border: none;
            color: #666;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Adjust copy button position for textarea */
        .form-group textarea + .copy-btn {
            bottom: 12px;
        }

        .copy-btn:hover {
            color: #ffffff;
            background-color: #3a3a3a;
        }

        .copy-btn.copied {
            color: #4caf50;
        }

        /* Global Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-global {
            flex: 1;
            padding: 12px;
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-global:hover {
            background-color: #444;
        }

        .btn-primary {
            background-color: #4a90e2;
            border: none;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Booking Intake Notes</h2>

    <div class="form-group">
        <label class="label-text" for="guest-name">Guest Name</label>
        <input type="text" id="guest-name">
        <button class="copy-btn" onclick="copyField('guest-name')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="stay-dates">Stay Dates</label>
        <input type="text" id="stay-dates">
        <button class="copy-btn" onclick="copyField('stay-dates')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="email">Email Address</label>
        <input type="email" id="email">
        <button class="copy-btn" onclick="copyField('email')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="phone">Phone Number</label>
        <input type="tel" id="phone">
        <button class="copy-btn" onclick="copyField('phone')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text">Ref</label>
        <div class="grid-3">
            <div style="position: relative;">
                <input type="text" id="ref-1" class="booking-code">
                <button class="copy-btn" onclick="copyField('ref-1')">Copy</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="ref-2" class="booking-code">
                <button class="copy-btn" onclick="copyField('ref-2')">Copy</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="ref-3" class="booking-code">
                <button class="copy-btn" onclick="copyField('ref-3')">Copy</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="label-text" for="notes">Notes</label>
        <textarea id="notes"></textarea>
        <button class="copy-btn" onclick="copyField('notes')">Copy</button>
    </div>

    <div class="actions">
        <button class="btn-global" onclick="clearAll()">Clear Form</button>
        <button class="btn-global btn-primary" onclick="copyAll()">Copy Summary</button>
    </div>
</div>

<script>
    // Copy Individual Field
    function copyField(fieldId) {
        const input = document.getElementById(fieldId);
        if (!input.value) return;

        const btn = input.nextElementSibling;
        
        navigator.clipboard.writeText(input.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    // Copy everything formatted for CRM/pasting
    function copyAll() {
        const fields = {
            'Guest Name': 'guest-name',
            'Stay Dates': 'stay-dates',
            'Email': 'email',
            'Phone': 'phone',
            'Ref 1': 'ref-1',
            'Ref 2': 'ref-2',
            'Ref 3': 'ref-3',
            'Notes': 'notes'
        };

        let summary = "--- BOOKING INTAKE --- \n";
        for (const [label, id] of Object.entries(fields)) {
            const val = document.getElementById(id).value;
            if (val) {
                if (['ref-1', 'ref-2', 'ref-3'].includes(id)) {
                    summary += `${label}: ${val.toUpperCase()}\n`;
                } else {
                    summary += `${label}: ${val}\n`;
                }
            }
        }

        navigator.clipboard.writeText(summary.trim()).then(() => {
            const mainBtn = document.querySelector('.btn-primary');
            mainBtn.innerText = "Summary Copied!";
            setTimeout(() => mainBtn.innerText = "Copy Summary", 1500);
        });
    }

    // Reset Form
    function clearAll() {
        if (confirm("Are you sure you want to clear all fields?")) {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => input.value = '');
        }
    }
</script>

</body>
</html>
