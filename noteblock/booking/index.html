<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Booking Notes</title>
    <style>
        /* Base Reset & Sleek Dark Mode Monospace/Sans Blend */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-weight: 300;
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Form Layout */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* Input Styling */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px 45px 12px 14px; /* Right padding leaves room for copy button */
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s, background-color 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4a90e2;
            background-color: #2d2d2d;
        }

        /* Specific Rule: Booking code capitalized & bold */
        .booking-code {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Date Range Row */
        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Main Notes Field */
        textarea {
            height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        /* Copy Button Overlay */
        .copy-btn {
            position: absolute;
            right: 10px;
            bottom: 8px;
            background: none;
            border: none;
            color: #666;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Adjust copy button position for textarea */
        .form-group textarea + .copy-btn {
            bottom: 12px;
        }

        .copy-btn:hover {
            color: #ffffff;
            background-color: #3a3a3a;
        }

        .copy-btn.copied {
            color: #4caf50;
        }

        /* Global Actions */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-global {
            flex: 1;
            padding: 12px;
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-global:hover {
            background-color: #444;
        }

        .btn-primary {
            background-color: #4a90e2;
            border: none;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Booking Intake Notes</h2>

    <div class="form-group">
        <label for="guest-name">Guest Name</label>
        <input type="text" id="guest-name" placeholder="John Doe">
        <button class="copy-btn" onclick="copyField('guest-name')">Copy</button>
    </div>

    <div class="form-group">
        <label for="booking-ref">Reservation Ref / GDS Code</label>
        <input type="text" id="booking-ref" class="booking-code" placeholder="X7R9PL2">
        <button class="copy-btn" onclick="copyField('booking-ref')">Copy</button>
    </div>

    <div class="form-group">
        <label for="pms-number">Internal PMS Number</label>
        <input type="text" id="pms-number" class="booking-code" placeholder="9876543">
        <button class="copy-btn" onclick="copyField('pms-number')">Copy</button>
    </div>

    <div class="form-group">
        <label for="channel-id">Channel/OTA ID</label>
        <input type="text" id="channel-id" class="booking-code" placeholder="EXP-45521">
        <button class="copy-btn" onclick="copyField('channel-id')">Copy</button>
    </div>

    <div class="date-row">
        <div class="form-group">
            <label for="check-in">Check-In</label>
            <input type="date" id="check-in">
            <button class="copy-btn" onclick="copyField('check-in')">Copy</button>
        </div>
        <div class="form-group">
            <label for="check-out">Check-Out</label>
            <input type="date" id="check-out">
            <button class="copy-btn" onclick="copyField('check-out')">Copy</button>
        </div>
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="guest@example.com">
        <button class="copy-btn" onclick="copyField('email')">Copy</button>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
        <button class="copy-btn" onclick="copyField('phone')">Copy</button>
    </div>

    <div class="form-group">
        <label for="notes">Special Requests & Notes</label>
        <textarea id="notes" placeholder="Late check-in, dietary restrictions, high floor request..."></textarea>
        <button class="copy-btn" onclick="copyField('notes')">Copy</button>
    </div>

    <div class="actions">
        <button class="btn-global" onclick="clearAll()">Clear Form</button>
        <button class="btn-global btn-primary" onclick="copyAll()">Copy Summary</button>
    </div>
</div>

<script>
    // Copy Individual Field
    function copyField(fieldId) {
        const input = document.getElementById(fieldId);
        if (!input.value) return;

        // Visual feedback setup
        const btn = input.nextElementSibling;
        
        // Use modern clipboard API
        navigator.clipboard.writeText(input.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    // Copy everything in a clean format for CRM pasting
    function copyAll() {
        const fields = {
            'Guest Name': 'guest-name',
            'Res Ref': 'booking-ref',
            'PMS Num': 'pms-number',
            'OTA ID': 'channel-id',
            'Check-In': 'check-in',
            'Check-Out': 'check-out',
            'Email': 'email',
            'Phone': 'phone',
            'Notes': 'notes'
        };

        let summary = "--- BOOKING INTAKE --- \n";
        for (const [label, id] of Object.entries(fields)) {
            const val = document.getElementById(id).value;
            if (val) {
                // Capitalize the booking specific fields in output summary too
                if (['booking-ref', 'pms-number', 'channel-id'].includes(id)) {
                    summary += `${label}: ${val.toUpperCase()}\n`;
                } else {
                    summary += `${label}: ${val}\n`;
                }
            }
        }

        navigator.clipboard.writeText(summary.trim()).then(() => {
            const mainBtn = document.querySelector('.btn-primary');
            mainBtn.innerText = "Summary Copied!";
            setTimeout(() => mainBtn.innerText = "Copy Summary", 1500);
        });
    }

    // Reset Form
    function clearAll() {
        if (confirm("Are you sure you want to clear all fields?")) {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => input.value = '');
        }
    }
</script>

</body>
</html>
