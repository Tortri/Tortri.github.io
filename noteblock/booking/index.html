<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Booking Notes</title>
    <style>
        /* CSS Variables for seamless theme switching */
        :root {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --bg-input: #2a2a2a;
            --bg-input-focus: #2d2d2d;
            --border-input: #3a3a3a;
            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #888888;
            --btn-copy: #666666;
            --btn-copy-hover: #ffffff;
            --btn-copy-bg: #3a3a3a;
            --shadow: rgba(0, 0, 0, 0.5);
            --bg-sidebar: #252525;
            --hover-sidebar-item: #333333;
            --btn-danger: #cf6679;
            --btn-danger-hover: #b85467;
            --icon-color: #a0a0a0;
            --icon-hover: #ffffff;
            --accent-blue: #4a90e2;
            
            /* Dynamic base value for input text size scaling */
            --input-font-size: 0.95rem;
        }

        [data-theme="light"] {
            --bg-body: #f4f6f8;
            --bg-container: #ffffff;
            --bg-input: #f9fafb;
            --bg-input-focus: #ffffff;
            --border-input: #d1d5db;
            --text-main: #1f2937;
            --text-heading: #111827;
            --text-muted: #6b7280;
            --btn-copy: #9ca3af;
            --btn-copy-hover: #111827;
            --btn-copy-bg: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --bg-sidebar: #f9fafb;
            --hover-sidebar-item: #f3f4f6;
            --btn-danger: #dc2626;
            --btn-danger-hover: #b91c1c;
            --icon-color: #4b5563;
            --icon-hover: #111827;
            --accent-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
            transition: background-color 0.2s, color 0.2s;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1300px;
            background-color: var(--bg-container);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px var(--shadow);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        /* Header Layout Split */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-input);
            padding-bottom: 15px;
        }

        h2 {
            font-weight: 300;
            font-size: 1.4rem;
            color: var(--text-heading);
            letter-spacing: 1px;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Custom Dropdown Styling for Text Size Control */
        .size-select-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            padding: 2px 8px;
            transition: border-color 0.2s;
        }

        .size-select-wrapper:focus-within {
            border-color: var(--accent-blue);
        }

        .size-select-wrapper svg {
            width: 16px;
            height: 16px;
            fill: var(--icon-color);
            margin-right: 4px;
        }

        .text-size-select {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            padding: 4px 20px 4px 4px;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23a0a0a0' d='M0 0l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center;
        }

        .text-size-select option {
            background-color: var(--bg-container);
            color: var(--text-main);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--icon-color);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .icon-btn:hover {
            color: var(--icon-hover);
            background-color: var(--btn-copy-bg);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Dynamic Split Screen Config Matrix */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 35px;
        }

        /* Layout direction switcher utility */
        .workspace-grid.flipped {
            direction: rtl;
        }
        .workspace-grid.flipped .form-group,
        .workspace-grid.flipped > div {
            direction: ltr;
        }

        @media (max-width: 900px) {
            .workspace-grid, .workspace-grid.flipped {
                grid-template-columns: 1fr;
                direction: ltr;
            }
        }

        .form-group {
            position: relative;
            margin-bottom: 22px;
        }

        .label-text {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 65px 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            color: var(--text-heading);
            font-size: var(--input-font-size); /* Uses globally configured variable variable scale mapping */
            transition: border-color 0.2s, background-color 0.2s, font-size 0.15s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-blue);
            background-color: var(--bg-input-focus);
        }

        .notes-textarea-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .notes-textarea-wrapper textarea {
            flex-grow: 1;
            min-height: 420px;
            resize: vertical;
            line-height: 1.6;
        }

        .booking-code {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            bottom: 8px;
            background: none;
            border: none;
            color: var(--btn-copy);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            z-index: 5;
        }

        .form-group textarea + .copy-btn {
            bottom: 12px;
        }

        .copy-btn:hover {
            color: var(--btn-copy-hover);
            background-color: var(--btn-copy-bg);
        }

        .copy-btn.copied {
            color: #4caf50 !important;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
            border-top: 1px solid var(--border-input);
            padding-top: 15px;
        }

        .btn-delete {
            background-color: var(--btn-danger);
            border: none;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--btn-danger-hover);
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- Sidebar Panel Drawer --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -340px;
            width: 340px;
            height: 100%;
            background-color: var(--bg-sidebar);
            box-shadow: -5px 0 25px rgba(0,0,0,0.3);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-input);
            padding-bottom: 10px;
        }

        .sidebar-header h3 {
            font-weight: 400;
            font-size: 1.1rem;
            color: var(--text-heading);
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-input);
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: var(--hover-sidebar-item);
        }

        .history-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }

        .history-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<!-- History Panels Drawer -->
<div class="sidebar" id="history-sidebar">
    <div class="sidebar-header">
        <h3>Recent Bookings</h3>
        <button class="icon-btn" onclick="toggleHistory()" title="Close History">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
    <ul class="history-list" id="history-list-element">
        <!-- Structural dynamic history entries managed via JS -->
    </ul>
</div>

<div class="container">
    <div class="header-bar">
        <h2>Booking Intake Notes</h2>
        <div class="top-controls">
            <!-- New Global Text Size Controller Dropdown Selection -->
            <div class="size-select-wrapper" title="Set Text Input Font Size">
                <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 6v3h3v6h3v-6h3v-3H3z"/></svg>
                <select id="text-size-picker" class="text-size-select" onchange="changeTextSize(this.value)">
                    <option value="small">Small</option>
                    <option value="normal" selected>Normal</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>

            <!-- Layout Orientation Direction Switcher Trigger Button -->
            <button class="icon-btn" onclick="toggleLayout()" title="Switch Layout Side (Left/Right)">
                <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            <!-- Tracking Log Drawers -->
            <button class="icon-btn" onclick="toggleHistory()" title="View Booking History">
                <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            </button>
            <!-- System Dark/Light Toggle -->
            <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                <svg id="theme-icon" viewBox="0 0 24 24"></svg>
            </button>
        </div>
    </div>

    <div class="workspace-grid" id="main-workspace-grid">
        <!-- LEFT PANEL: Raw Fast Intake Textarea Field -->
        <div class="form-group notes-textarea-wrapper">
            <label class="label-text" for="notes">Notes</label>
            <textarea id="notes" oninput="autoSave()"></textarea>
            <button class="copy-btn" onclick="copyField('notes')">Copy</button>
        </div>

        <!-- RIGHT PANEL: Structured Extracted Validation Targets -->
        <div>
            <!-- Guest Name -->
            <div class="form-group">
                <label class="label-text" for="guest-name">Guest Name</label>
                <input type="text" id="guest-name" oninput="autoSave()">
                <button class="copy-btn" onclick="copyField('guest-name')">Copy</button>
            </div>

            <!-- Stay Dates -->
            <div class="form-group">
                <label class="label-text" for="stay-dates">Stay Dates</label>
                <input type="text" id="stay-dates" oninput="autoSave()">
                <button class="copy-btn" onclick="copyField('stay-dates')">Copy</button>
            </div>

            <!-- Communication Blocks -->
            <div class="form-group">
                <label class="label-text" for="email">Email Address</label>
                <input type="email" id="email" oninput="autoSave()">
                <button class="copy-btn" onclick="copyField('email')">Copy</button>
            </div>

            <div class="form-group">
                <label class="label-text" for="phone">Phone Number</label>
                <input type="tel" id="phone" oninput="autoSave()">
                <button class="copy-btn" onclick="copyField('phone')">Copy</button>
            </div>

            <!-- System References Setup Match Matrix -->
            <div class="form-group">
                <label class="label-text">Ref</label>
                <div class="grid-2">
                    <div style="position: relative;">
                        <input type="text" id="ref-1" class="booking-code" oninput="autoSave();">
                        <button class="copy-btn" onclick="copyField('ref-1')">Copy</button>
                    </div>
                    <div style="position: relative;">
                        <input type="text" id="ref-2" class="booking-code" oninput="autoSave();">
                        <button class="copy-btn" onclick="copyField('ref-2')">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Active System Cache Clear Trigger -->
    <div class="actions">
        <button class="btn-delete" onclick="archiveAndClearAll()" title="Archive to History and Clear Form Workspaces">
            <svg viewBox="0 0 24 24">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const STRING_FIELDS = ['guest-name', 'stay-dates', 'email', 'phone', 'ref-1', 'ref-2', 'notes'];
    
    const sunIconPath = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.01c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z"/>`;
    const moonIconPath = `<path d="M12.3 2c4.4-.1 8 3.5 8 8 0 4.2-3.3 7.7-7.5 8-4.7.3-8.8-3.3-8.8-8 0-3.6 2.5-6.7 6.1-7.5-.4.7-.6 1.5-.6 2.4 0 3.9 3.1 7 7 7 1 0 1.9-.2 2.7-.6-1 3.2-3.9 5.6-7.4 5.6-4.4 0-8-3.6-8-8 0-3.9 2.8-7.1 6.6-7.7-.1.3-.1.6-.1.8z"/>`;

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.documentElement.setAttribute('data-theme', targetTheme);
        document.getElementById('theme-icon').innerHTML = targetTheme === 'light' ? moonIconPath : sunIconPath;
        localStorage.setItem('agent-theme', targetTheme);
    }

    function toggleLayout() {
        const grid = document.getElementById('main-workspace-grid');
        const isFlipped = grid.classList.toggle('flipped');
        localStorage.setItem('agent-layout-flipped', isFlipped);
    }

    // Interactive Font Scaling Engine
    function changeTextSize(sizeValue) {
        let targetRem = "0.95rem";
        switch(sizeValue) {
            case 'small':  targetRem = "0.82rem"; break;
            case 'normal': targetRem = "0.95rem"; break;
            case 'medium': targetRem = "1.1rem";  break;
            case 'large':  targetRem = "1.3rem";  break;
        }
        document.documentElement.style.setProperty('--input-font-size', targetRem);
        localStorage.setItem('agent-text-size-choice', sizeValue);
    }

    function toggleHistory() {
        document.getElementById('history-sidebar').classList.toggle('open');
    }

    function copyField(fieldId) {
        const input = document.getElementById(fieldId);
        if (!input.value) return;

        const btn = input.nextElementSibling;
        navigator.clipboard.writeText(input.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    function saveToHistoryLog() {
        const guestName = document.getElementById('guest-name').value.trim() || 'Unnamed Guest';
        const snapshot = {};
        let hasData = false;

        STRING_FIELDS.forEach(id => {
            const val = document.getElementById(id).value;
            snapshot[id] = val;
            if (val.trim() !== '') hasData = true;
        });

        if (!hasData) return;

        snapshot.metaName = guestName;
        snapshot.metaTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        log.unshift(snapshot);
        if (log.length > 5) log.pop();

        localStorage.setItem('agent-history-log', JSON.stringify(log));
        renderHistoryList();
    }

    function renderHistoryList() {
        const listContainer = document.getElementById('history-list-element');
        const log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        listContainer.innerHTML = '';

        if (log.length === 0) {
            listContainer.innerHTML = `<li style="font-size:0.85rem; color: var(--text-muted); text-align:center; margin-top:20px;">No history logged yet.</li>`;
            return;
        }

        log.forEach((entry, index) => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.onclick = () => restoreFromHistory(index);
            const dateTag = entry['stay-dates'] ? ` • ${entry['stay-dates']}` : '';

            li.innerHTML = `
                <div class="history-name">${entry.metaName}</div>
                <div class="history-meta">Saved at ${entry.metaTime}${dateTag}</div>
            `;
            listContainer.appendChild(li);
        });
    }

    function restoreFromHistory(index) {
        const log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        const entry = log[index];
        if (!entry) return;

        STRING_FIELDS.forEach(id => {
            document.getElementById(id).value = entry[id] || '';
        });

        autoSave();
        toggleHistory();
    }

    function autoSave() {
        STRING_FIELDS.forEach(id => {
            localStorage.setItem(`cache_v5_${id}`, document.getElementById(id).value);
        });
    }

    function loadCache() {
        const savedTheme = localStorage.getItem('agent-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-icon').innerHTML = savedTheme === 'light' ? moonIconPath : sunIconPath;

        const layoutFlipped = localStorage.getItem('agent-layout-flipped') === 'true';
        if (layoutFlipped) {
            document.getElementById('main-workspace-grid').classList.add('flipped');
        }

        // Hydrate Font Size Options from Cache Memory Structures
        const cachedSize = localStorage.getItem('agent-text-size-choice') || 'normal';
        document.getElementById('text-size-picker').value = cachedSize;
        changeTextSize(cachedSize);

        STRING_FIELDS.forEach(id => {
            const cachedValue = localStorage.getItem(`cache_v5_${id}`);
            if (cachedValue) document.getElementById(id).value = cachedValue;
        });

        renderHistoryList();
    }

    function archiveAndClearAll() {
        if (confirm("Are you sure you want to clear this form? (Current details will be saved to History)")) {
            saveToHistoryLog();
            STRING_FIELDS.forEach(id => {
                document.getElementById(id).value = '';
                localStorage.removeItem(`cache_v5_${id}`);
            });
            autoSave();
        }
    }

    window.onload = loadCache;
</script>

</body>
</html>
