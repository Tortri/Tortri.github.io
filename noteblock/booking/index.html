<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Booking Notes</title>
    <style>
        /* CSS Variables for seamless theme switching */
        :root {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --bg-input: #2a2a2a;
            --bg-input-focus: #2d2d2d;
            --border-input: #3a3a3a;
            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --text-muted: #888888;
            --btn-copy: #666666;
            --btn-copy-hover: #ffffff;
            --btn-copy-bg: #3a3a3a;
            --shadow: rgba(0, 0, 0, 0.5);
            --bg-sidebar: #252525;
            --hover-sidebar-item: #333333;
            --btn-danger: #cf6679;
            --btn-danger-hover: #b85467;
        }

        [data-theme="light"] {
            --bg-body: #f4f6f8;
            --bg-container: #ffffff;
            --bg-input: #f9fafb;
            --bg-input-focus: #ffffff;
            --border-input: #d1d5db;
            --text-main: #1f2937;
            --text-heading: #111827;
            --text-muted: #6b7280;
            --btn-copy: #9ca3af;
            --btn-copy-hover: #111827;
            --btn-copy-bg: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --bg-sidebar: #f9fafb;
            --hover-sidebar-item: #f3f4f6;
            --btn-danger: #dc2626;
            --btn-danger-hover: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.2s, color 0.2s;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-container);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px var(--shadow);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        /* Top Controls Setup */
        .top-controls {
            position: absolute;
            top: 28px;
            right: 30px;
            display: flex;
            gap: 10px;
        }

        .top-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .top-btn:hover {
            color: var(--text-heading);
            background-color: var(--btn-copy-bg);
        }

        h2 {
            font-weight: 300;
            font-size: 1.5rem;
            color: var(--text-heading);
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .label-text {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 65px 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            color: var(--text-heading);
            font-size: 0.95rem;
            transition: border-color 0.2s, background-color 0.2s;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4a90e2;
            background-color: var(--bg-input-focus);
        }

        .booking-code {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        textarea {
            height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            bottom: 8px;
            background: none;
            border: none;
            color: var(--btn-copy);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-group textarea + .copy-btn {
            bottom: 12px;
        }

        .copy-btn:hover {
            color: var(--btn-copy-hover);
            background-color: var(--btn-copy-bg);
        }

        .copy-btn.copied {
            color: #4caf50 !important;
        }

        /* Bottom Controls layout */
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-delete {
            background-color: var(--btn-danger);
            border: none;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--btn-danger-hover);
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- Sidebar History Layout --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background-color: var(--bg-sidebar);
            box-shadow: -5px 0 25px rgba(0,0,0,0.3);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-input);
            padding-bottom: 10px;
        }

        .sidebar-header h3 {
            font-weight: 400;
            font-size: 1.1rem;
            color: var(--text-heading);
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-input);
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: var(--hover-sidebar-item);
        }

        .history-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }

        .history-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="sidebar" id="history-sidebar">
    <div class="sidebar-header">
        <h3>Recent Bookings</h3>
        <button class="top-btn" onclick="toggleHistory()">Close</button>
    </div>
    <ul class="history-list" id="history-list-element">
        </ul>
</div>

<div class="container">
    <div class="top-controls">
        <button class="top-btn" onclick="toggleHistory()">History</button>
        <button class="top-btn" onclick="toggleTheme()" id="theme-toggle-btn">Light Mode</button>
    </div>
    
    <h2>Booking Intake Notes</h2>

    <div class="form-group">
        <label class="label-text" for="guest-name">Guest Name</label>
        <input type="text" id="guest-name" oninput="autoSave()">
        <button class="copy-btn" onclick="copyField('guest-name')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="stay-dates">Stay Dates</label>
        <input type="text" id="stay-dates" oninput="autoSave()">
        <button class="copy-btn" onclick="copyField('stay-dates')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="email">Email Address</label>
        <input type="email" id="email" oninput="autoSave()">
        <button class="copy-btn" onclick="copyField('email')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text" for="phone">Phone Number</label>
        <input type="tel" id="phone" oninput="autoSave()">
        <button class="copy-btn" onclick="copyField('phone')">Copy</button>
    </div>

    <div class="form-group">
        <label class="label-text">Ref</label>
        <div class="grid-3">
            <div style="position: relative;">
                <input type="text" id="ref-1" class="booking-code" oninput="autoSave();">
                <button class="copy-btn" onclick="copyField('ref-1')">Copy</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="ref-2" class="booking-code" oninput="autoSave();">
                <button class="copy-btn" onclick="copyField('ref-2')">Copy</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="ref-3" class="booking-code" oninput="autoSave();">
                <button class="copy-btn" onclick="copyField('ref-3')">Copy</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="label-text" for="notes">Notes</label>
        <textarea id="notes" oninput="autoSave()"></textarea>
        <button class="copy-btn" onclick="copyField('notes')">Copy</button>
    </div>

    <div class="actions">
        <button class="btn-delete" onclick="archiveAndClearAll()" title="Archive and Clear Form">
            <svg viewBox="0 0 24 24">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const FIELD_IDS = ['guest-name', 'stay-dates', 'email', 'phone', 'ref-1', 'ref-2', 'ref-3', 'notes'];

    // Theme Toggling
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.documentElement.setAttribute('data-theme', targetTheme);
        document.getElementById('theme-toggle-btn').innerText = targetTheme === 'light' ? 'Dark Mode' : 'Light Mode';
        localStorage.setItem('agent-theme', targetTheme);
    }

    // Toggle History Drawer
    function toggleHistory() {
        document.getElementById('history-sidebar').classList.toggle('open');
    }

    // Individual Copy Function
    function copyField(fieldId) {
        const input = document.getElementById(fieldId);
        if (!input.value) return;

        const btn = input.nextElementSibling;
        navigator.clipboard.writeText(input.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    // Silently log form data snapshots to local storage history
    function saveToHistoryLog() {
        const guestName = document.getElementById('guest-name').value.trim() || 'Unnamed Guest';
        
        const snapshot = {};
        let hasData = false;

        FIELD_IDS.forEach(id => {
            const val = document.getElementById(id).value;
            snapshot[id] = val;
            if (val.trim() !== '') hasData = true;
        });
        
        // Prevent archiving entirely blank cards
        if (!hasData) return;

        snapshot.metaName = guestName;
        snapshot.metaTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        log.unshift(snapshot);
        if (log.length > 5) log.pop();

        localStorage.setItem('agent-history-log', JSON.stringify(log));
        renderHistoryList();
    }

    // Build the list elements inside history panel
    function renderHistoryList() {
        const listContainer = document.getElementById('history-list-element');
        const log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        
        listContainer.innerHTML = '';

        if (log.length === 0) {
            listContainer.innerHTML = `<li style="font-size:0.85rem; color: var(--text-muted); text-align:center; margin-top:20px;">No history logged yet.</li>`;
            return;
        }

        log.forEach((entry, index) => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.onclick = () => restoreFromHistory(index);
            li.innerHTML = `
                <div class="history-name">${entry.metaName}</div>
                <div class="history-meta">Saved at ${entry.metaTime} • ${entry['stay-dates'] || 'No dates'}</div>
            `;
            listContainer.appendChild(li);
        });
    }

    // Restore previous state card back into main views
    function restoreFromHistory(index) {
        const log = JSON.parse(localStorage.getItem('agent-history-log')) || [];
        const entry = log[index];
        if (!entry) return;

        FIELD_IDS.forEach(id => {
            document.getElementById(id).value = entry[id] || '';
        });

        autoSave();
        toggleHistory();
    }

    // Cache current typing states locally
    function autoSave() {
        FIELD_IDS.forEach(id => {
            localStorage.setItem(`cache_${id}`, document.getElementById(id).value);
        });
    }

    function loadCache() {
        const savedTheme = localStorage.getItem('agent-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-toggle-btn').innerText = savedTheme === 'light' ? 'Dark Mode' : 'Light Mode';

        FIELD_IDS.forEach(id => {
            const cachedValue = localStorage.getItem(`cache_${id}`);
            if (cachedValue) document.getElementById(id).value = cachedValue;
        });

        renderHistoryList();
    }

    // Red Bin Trigger: Archives active data to history first, then resets form UI
    function archiveAndClearAll() {
        if (confirm("Are you sure you want to clear this form? (Current details will be saved to History)")) {
            saveToHistoryLog(); // Commit data to history stream first

            FIELD_IDS.forEach(id => {
                document.getElementById(id).value = '';
                localStorage.removeItem(`cache_${id}`);
            });
        }
    }

    window.onload = loadCache;
</script>

</body>
</html>
