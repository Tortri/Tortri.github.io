<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Pérez Wibe - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Always Visible Navigation Bar -->
    <header class="title-box">
        <h1>Jacob Pérez Wibe</h1>
    </header>

    <div class="nav-bar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Other projects</a></li>
                <li><a href="useful.html">Useful tools</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>

    <!-- Contact Section -->
    <main class="contact-section-container">
        <!-- Contact Form Container -->
        <div class="contact-form-container neon-green-box">
            <h3>Send a Message</h3>
            <form id="contactForm" action="https://formspree.io/f/mblkrleq" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="_replyto" required> <!-- Use _replyto for Formspree -->
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
            <div id="form-status" class="message-box" style="opacity: 0;"></div>
        </div>
        
        <div class="contact-info-grid">
            <!-- Email Display Box -->
            <div class="contact-box contact-display-box">
                <img src="images/mail.png" alt="Email Icon" />
                <p>jacob.p.wibe@gmail.com</p>
            </div>

            <!-- WhatsApp Box -->
            <div class="contact-box contact-display-box" onclick="goToLink('https://wa.me/4915739452254')">
                <img src="images/whatsapp.png" alt="WhatsApp" />
                <p>+49 15739452254</p>
            </div>

            <!-- LinkedIn Box -->
            <div class="contact-box clickable-box" onclick="goToLink('https://www.linkedin.com/in/jacob-p%C3%A9rez-wibe-3641721b6/')">
                <img src="images/linkedin.png" alt="LinkedIn" />
            </div>

            <!-- GitHub Box -->
            <div class="contact-box clickable-box" onclick="goToLink('https://github.com/Tortri')">
                <img src="images/github.png" alt="GitHub" />
            </div>


        </div>

        
    </main>

    <script src="app.js"></script> <!-- Ensure app.js is linked -->
    <script>
        function goToLink(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
